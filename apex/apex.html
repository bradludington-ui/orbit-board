  if (baeIn) {
    st_baeFill(st);
    const cur = st.bae.current, nw = st_clone(baeIn);
    nw.importedAt = importedAt;
    delete nw.sameSince;
    if (cur && st_sameBae(cur, nw)) {
      baeSame = true;
      const since = typeof cur.sameSince === 'string' && cur.sameSince ? cur.sameSince : cur.importedAt;
      if (typeof since === 'string' && since) nw.sameSince = since;
    } else if (cur) { st.bae.previous = cur; baeWas = cur; }
    st.bae.current = nw;
  }
  // The settings a person chose stay; only Data through follows the new pull (CONTRACT §4.1). An import that placed no
  // row in any appropriation brings no pull, so it leaves Data through where the person set it (review IMP-12).
  const aps = SP.APS.filter(a => keys.includes(a.id)).map(a => a.id);
  const def = SP.defaultSettings(importedAt);
  const first = !st_isObj(st.settings);
  const was = first ? null : st.settings.asOf;
  // an import holding only a BAE report leaves Data through alone (CONTRACT §14.7): the month is the pull's
  const moveAsOf = keys.length > 0 && (first || aps.length > 0);
  st.settings = moveAsOf ? (first ? def : Object.assign({}, st.settings, { asOf: def.asOf })) : st.settings;
  const hist = { importedAt, aps, totals: st_totals(st_pick(st.pulls.current, aps), st.settings) };
  if (baeIn) { const r = st_baeReadable(st.bae.current); hist.bae = { rows: r.rows, approved: r.approved, authorized: r.authorized }; }
  st.history.push(hist);
  st.lastImport = { report: st_clone(report) };
  st_changed();

  // what the person needs to know, in the order they need it. A refused file, rows that count nowhere and dates that could
  // not be read used to reach the Import report only, while the message line read as a clean success (review IMP-4, IMP-9).
  // Rows that count nowhere make it a warning too: an import whose every Amount was unreadable put an appropriation at $0
  // in a green message (review F4, DL-2).
  const said = [];
  let warn = false;
  if (aps.length) {
    said.push('Imported ' + st_list(aps.map(ap => st_apLabel(ap) + ' (' + st_rows(st.pulls.current[ap].rows.length) + ')')) + '.');
  } else if (keys.length) said.push('No row in this import could be placed in an appropriation.');
  // the report by name and date, and the rows it counts (CONTRACT §14.7): counted as the stoplight tables count them
  // (SP.baeTally, §14.2: readable, a sustainment budget, of First FY or later, its service and lane shown), the rest by
  // why. It gave the rows read and the money of every readable row, Flyaway, RDT&E and the years before First FY included,
  // so its Approved was far larger than any table shows (559 of the real report's 1,158 rows are sustainment budgets) and
  // matched nothing a reader could check it against (review I4-6). A page with no settings yet counts by the First FY a
  // first pull will give it.
  const baeRep = st_isObj(report.bae) ? report.bae : {};
  if (baeIn) {
    const b = st.bae.current, n = b.rows.length;
    let t = null;
    try { t = typeof SP.baeTally === 'function' ? SP.baeTally(b, st.settings || def, SP.getView()) : null; } catch (e) { t = null; }
    let counted = '';
    if (t) {
      const not = [];
      if (t.flyaway) not.push(SP.fmtInt(t.flyaway) + ' Flyaway (production)');
      if (t.noap) not.push(SP.fmtInt(t.noap) + (t.noap === 1 ? ' that names' : ' that name') + ' no appropriation');
      if (t.first) not.push(SP.fmtInt(t.first) + ' before FY' + t.firstFY);
      // §15.3, §17.3: FY2025 O&M OBBBA funding, left out by its own rule (SP.isObbba25), after the First FY as in §4.3
      if (t.obbba) not.push(SP.fmtInt(t.obbba) + ' FY' + SP.OBBBA_FY + ' O&M OBBBA');
      if (t.off) not.push(SP.fmtInt(t.off) + ' in a service or lane switched off');
      if (t.bad) not.push(SP.fmtInt(t.bad) + ' that could not be read');
      // what "counted" means names the rule too when it took rows out, as it names the switches (review P5-6: "30 of them
      // counted (sustainment budgets of FY2025 or later)" where 38 rows were that, 8 of them FY2025 OBBBA funding)
      counted = ', ' + (t.yes === n && n !== 1 ? 'every one' : t.yes === n ? 'it' : SP.fmtInt(t.yes) + ' of them') + ' counted (sustainment budgets of FY' + t.firstFY
        + ' or later' + (t.obbba ? ', FY' + SP.OBBBA_FY + ' O&M OBBBA funding left out' : '') + (t.off ? ', in the services and lanes shown' : '') + ')'
        + (not.length ? '; not counted: ' + st_list(not) : '');
    }
    said.push('Imported the BAE report “' + b.file + '” › “' + b.sheet + '”, ' + (b.stamp ? 'dated ' + b.stamp : 'which has no date in its file name')
      + ': ' + st_rows(n) + counted + '.');
  }
  const refused = (Array.isArray(report.refusedFiles) ? report.refusedFiles : []).filter(st_isObj);
  for (const f of refused) {
    warn = true;
    said.push('“' + f.file + '” was refused, so nothing in it was imported: ' + String(f.why).replace(/\.\s*$/, '') + '.');
  }
  for (const x of strays) {
    warn = true;
    said.push('Check: every ' + st_apLabel(x.ap) + ' row came from “' + x.file + '” › “' + x.sheet + '”, a sheet named for ' + sheetFor(x)
      + ' (' + st_rows(x.rows) + ', ' + st_usd(x.cents) + '), and ' + (x.rows === 1 ? 'it is' : 'they are') + ' now the whole ' + st_apLabel(x.ap) + ' pull.');
  }
  for (const z of shrinks) {
    warn = true;
    said.push('Check: the ' + st_apLabel(z.ap) + ' pull now has ' + SP.fmtInt(z.now.rows) + ' readable row' + (z.now.rows === 1 ? '' : 's') + ' (' + st_usd(z.now.cents)
      + '), where the pull it replaced had ' + SP.fmtInt(z.was.rows) + ' (' + st_usd(z.was.cents) + ').');
  }
  if (baeShrink) {
    warn = true;
    said.push('Check: the BAE report now has ' + SP.fmtInt(baeShrink.now.rows) + ' readable row' + (baeShrink.now.rows === 1 ? '' : 's') + ' (Approved '
      + st_usd(baeShrink.now.approved) + '), where the report it replaced had ' + SP.fmtInt(baeShrink.was.rows) + ' (Approved ' + st_usd(baeShrink.was.approved) + ').');
  }
  // the report's own total row disagreeing with its rows is a report to check before it is briefed from (CONTRACT §14.1)
  if (baeIn && st_isObj(baeRep.total) && baeRep.total.ok === false) {
    warn = true;
    said.push('Check: the BAE report’s own total row (row ' + baeRep.total.rowNo + ') does not agree with the sum of its readable rows (see the Import report).');
  }
  const replaced = aps.filter(ap => before[ap] && !same.includes(ap));
  if (replaced.length) said.push('The ' + st_list(replaced.map(st_apLabel)) + ' pull' + (replaced.length === 1 ? ' it replaces is' : 's it replaces are')
    + ' kept for What changed.');
  // "the earlier pull What changed compares with is kept" was said of a pull imported twice into a page that held no
  // earlier pull at all, and What changed then said "Only one pull so far" (review SEAM-6, F10, SCR2-6, BP-5)
  const sameWith = same.filter(k => st.pulls.previous[k]), sameAlone = same.filter(k => !st.pulls.previous[k]);
  const sameLead = ks => 'The ' + st_list(ks.map(st_apLabel)) + ' pull' + (ks.length === 1 ? ' is the same as the one' : 's are the same as the ones') + ' on screen, row for row';
  if (sameWith.length) said.push(sameLead(sameWith) + ', so What changed still compares ' + (sameWith.length === 1 ? 'it' : 'each')
    + ' with the pull before it, and says nothing changed since.');
  if (sameAlone.length) said.push(sameLead(sameAlone) + '; there is no earlier ' + (sameAlone.length === 1 ? 'pull' : 'pull of ' + (sameAlone.length === 2 ? 'either' : 'any'))
    + ' for What changed to compare with yet.');
  if (baeWas) said.push('The BAE report it replaces, ' + st_baeName(baeWas) + ', is kept for What changed.');
  if (baeSame) said.push('The BAE report is the same as the one on screen, row for row' + (st.bae.previous
    ? ', so What changed still compares it with the report before it, and says nothing changed since.'
    : '; there is no earlier report for What changed to compare with yet.'));
  const kept = SP.APS.filter(a => before[a.id] && !aps.includes(a.id));
  if (kept.length) {
    const byDay = new Map();
    for (const a of kept) {
      // to the minute when it came in the same day as this import: "keep their pulls of 2026-11-09" on the day of a
      // second import said nothing about which pulls were the older ones (review SCR2-11)
      const at = before[a.id].importedAt;
      const sec = x => { const t = new Date(Date.parse(x)); return isNaN(t.getTime()) ? '' : ':' + st_pad(t.getSeconds()); };
      const d = (!st_day(at) || st_day(at) !== st_day(importedAt) ? st_day(at)
        : st_when(at) !== st_when(importedAt) ? st_when(at) : st_when(at) + sec(at)) || 'an unknown date';
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(a.label);
    }
    said.push([...byDay].map(([d, l]) => st_list(l) + ' keep' + (l.length === 1 ? 's its pull' : ' their pulls') + ' of ' + d).join('; ') + '.');
  }
  if (unidSaid) said.push(unidSaid);
  const unread = aps.map(ap => [ap, st.pulls.current[ap].rows.filter(r => r.bad && r.bad.length).length]).filter(([, n]) => n);
  if (unread.length) {
    warn = true;
    const n = unread.reduce((a, [, k]) => a + k, 0);
    said.push(st_list(unread.map(([ap, k]) => SP.fmtInt(k) + ' ' + st_apLabel(ap))) + ' row' + (n === 1 ? '' : 's')
      + ' could not be read (FY or Amount): ' + (n === 1 ? 'it is' : 'they are') + ' kept and counted nowhere (see the Import report).');
  }
  const baeBad = baeIn ? st.bae.current.rows.filter(r => r.bad && r.bad.length).length : 0;
  if (baeBad) {
    warn = true;
    said.push(st_rows(baeBad) + ' of the BAE report could not be read (Budget Name, FY or an amount): ' + (baeBad === 1 ? 'it is' : 'they are')
      + ' kept and counted nowhere (see the Import report).');
  }
  const db = (Array.isArray(report.dateUnreadable) ? report.dateUnreadable : []).filter(st_isObj);
  const dDate = db.filter(d => d.column === 'Date').length, dMonth = db.filter(d => d.column === 'Month').length;
  if (dDate) said.push(st_rows(dDate) + ' ' + (dDate === 1 ? 'has a Date' : 'have a Date') + ' that could not be read: ' + (dDate === 1 ? 'it is' : 'they are')
    + ' in the No date column (see the Import report for the dates it reads).');
  if (dMonth) said.push(SP.fmtInt(dMonth) + ' Month value' + (dMonth === 1 ? '' : 's') + ' could not be read (see the Import report).');
  const un = keys.includes('unidentified') ? parsed.pulls.unidentified.rows.length : 0;
  if (un) {
    warn = true;
    said.push(st_rows(un) + ' whose appropriation was not identified ' + (un === 1 ? 'is' : 'are') + ' kept apart and counted nowhere (see the Import report).');
  }
  const lab = v => (SP.asOfLabel ? SP.asOfLabel(v) : v);
  if (moveAsOf) {
    said.push('Data through ' + (first ? 'set' : 'reset') + ' to ' + lab(def.asOf) + ', the last full month before this import'
      + (!first && was && was !== def.asOf ? ' (it was ' + lab(was) + ')' : '') + '; change it at the top if the pull runs later.');
  } else if (was) said.push('Data through stays ' + lab(was) + ': no pull came in to move it.');
  return { ok: true, warn, message: said.join(' ') };
};
function st_pick(current, aps) {
  const o = {};
  for (const ap of aps) o[ap] = current[ap];
  return o;
}

// TAKING A SAVED PLAN INTO THIS PAGE. Each copy of the tool holds its own data, so a plan could not reach a new or fixed
// copy: Import refused the .html as a "truncated" workbook, and re-importing the tool's own Excel export lost the
// Authorized entries, the special CCaRs, goal edits, budget overrides, the earlier pulls, the history and the unidentified
// rows (review IMP-7). The whole state is read from the file, checked exactly as an opening checks it, and becomes this
// page's, after a question when the page holds a plan or unsaved work. Every derived field is worked out again by THIS
// copy's rules (CONTRACT §3). This page's own file is not touched: Save writes it, through the same checks as ever.
//   text  the saved plan's HTML;  name  its file name, for the messages
SP.takePlan = function takePlan(text, name) {
  const fname = String(name || 'that file');
  const f = st_readFile(text);
  if (f.why) return { ok: false, message: 'Nothing was taken: “' + fname + '” ' + f.why + '.' };
  if (!f.state) return { ok: false, message: 'Nothing was taken: “' + fname + '” is a APEX file with no plan saved in it.' };
  const why = st_check(f.state);
  if (why) return { ok: false, message: 'Nothing was taken from “' + fname + '”: ' + why + '.' };
  const inc = f.state;
  const aps = SP.APS.filter(a => inc.pulls.current[a.id]).map(a => a.label);
  // a plan whose only data is a BAE report (CONTRACT §14) is a plan: the report is what it brings
  const incBae = st_isObj(inc.bae) && st_isObj(inc.bae.current);
  if (!aps.length && !incBae) return { ok: false, message: 'Nothing was taken: the plan in “' + fname + '” holds no pull.' };
  const st = SP.state;
  const mine = SP.APS.filter(a => st.pulls.current[a.id]).map(a => a.label);
  const mineBae = st_isObj(st.bae) && st_isObj(st.bae.current);
  // what each plan holds, in words: its pulls, and its BAE report when it has one (said only then, so a plan without one
  // reads as it always has)
  const holds = (l, b) => st_list(l.concat(b ? ['the BAE report'] : []));
  const saved = inc.savedAt ? ', saved ' + st_when(inc.savedAt) : '';
  const andBae = incBae || mineBae ? ', BAE reports' : '';
  if (mine.length || st_dirty || mineBae) {
    const q = 'This page holds ' + (mine.length || mineBae ? 'a plan (' + holds(mine, mineBae) + ')' : 'work') + (st_dirty ? ' with unsaved changes' : '') + '.\n\n'
      + 'Taking the plan in “' + fname + '” (' + holds(aps, incBae) + saved + ') replaces it on this page: its pulls, earlier pulls' + andBae + ', import '
      + 'history, settings and last import report. This page’s own file is not changed until you Save.\n\nTake it?';
    let yes = false;
    try { yes = typeof window.confirm === 'function' && !!window.confirm(q); } catch (e) { yes = false; }
    if (!yes) return { ok: false, message: 'Nothing was taken: you chose to keep this page’s plan, and “' + fname + '” was not read into it.' };
  }
  const next = st_clone(inc);
  if (!Array.isArray(next.history)) next.history = [];
  if (next.lastImport === undefined) next.lastImport = null;
  st_baeFill(next);   // a plan saved before CONTRACT §14 is taken with no report, as it opens with none
  // the save time stays this page's: it is what this page's own file holds, and what Save checks that file against
  next.savedAt = st.savedAt === undefined ? null : st.savedAt;
  SP.state = next;
  // A file that holds the very plan taken holds nothing this page lacks: Save told the person that plan "is not the one
  // on screen", or was saved "by someone else", and "is lost" (review SEAM-4). Remembered until this page saves.
  st_taken = { at: typeof inc.savedAt === 'string' && inc.savedAt ? inc.savedAt : null, name: fname };
  st_changed();
  return { ok: true, message: 'Took the plan in “' + fname + '” (' + holds(aps, incBae) + saved + '): its pulls, earlier pulls' + (incBae ? ', BAE reports' : '')
    + ', import history, settings and last import report. Its figures are worked out by this copy of the tool. Save to keep it in this page’s file.' };
};

// ---------------------------------------------------------------------------------------------------------------
// SETTINGS (saved in the file, so a change is unsaved work)
// ---------------------------------------------------------------------------------------------------------------
SP.setSettings = function setSettings(patch) {
  if (!st_isObj(patch)) return;
  const st = SP.state;
  const base = st_isObj(st.settings) ? st.settings
    : (typeof SP.defaultSettings === 'function' ? SP.defaultSettings(new Date().toISOString()) : {});
  const next = Object.assign({}, base, st_clone(patch));
  if (JSON.stringify(next) === JSON.stringify(st.settings)) return;   // nothing changed: nothing to save
  st.settings = next;
  st_changed(true);
};
SP.isDirty = function isDirty() { return st_dirty; };
SP.onStateChange = function onStateChange(fn) {
  if (typeof fn !== 'function') return () => {};
  st_subs.push(fn);
  return () => { const i = st_subs.indexOf(fn); if (i >= 0) st_subs.splice(i, 1); };
};

// ---------------------------------------------------------------------------------------------------------------
// SAVING. The first Save in a page goes through the browser's OPEN window: a file picked there is read and checked
// before anything is written, where a Save window empties the file the moment it is picked (measured in Chromium for
// ORBIT, v2.14), so one wrong pick would lose a plan. A file that cannot be read, is not this tool, or holds another
// tool's data is never written over. One saved by someone else since this page last read or wrote it is written over
// only after the person says so.
// ---------------------------------------------------------------------------------------------------------------
const ST_TYPES = name => [{ description: 'APEX — pick this file: ' + name, accept: { 'text/html': ['.html', '.htm'] } }];
// the file's text -> {state} (null when it holds none) or {why}: why it must not be written over. raw is the saved-data
// text as written, when there is a place for it: what tells the very data this page could not read from any other.
function st_readFile(txt) {
  if (typeof txt !== 'string' || !/<meta\s+name=["']?sfcb-spend-plan["'\s>]/i.test(txt)) return { why: 'is not a APEX file' };
  const m = /<script\b[^>]*\bid=["']?spState["']?[^>]*>([\s\S]*?)<\/script\s*>/i.exec(txt);
  if (!m) return { why: 'is a APEX page with no place for its data' };
  const raw = m[1].trim();
  let st;
  try { st = JSON.parse(raw || 'null'); } catch (e) { return { why: 'holds saved data that cannot be read', raw, unreadable: true }; }
  if (st === null) return { state: null, raw };
  if (!st_isObj(st)) return { why: 'holds saved data that is not a plan', raw };
  if (st.tool !== ST_TOOL) return { why: 'holds data saved by another tool', raw };
  return { state: st, raw };
}
function st_abortish(e) { return !!e && (e.name === 'AbortError'); }
function st_err(e) { return (e && e.message) || String(e); }
async function st_write(h, html) {
  const w = await h.createWritable();
  try { await w.write(html); await w.close(); }
  catch (e) { try { await w.abort(); } catch (e2) {} throw e; }
}
// -> {ok, asked}: asked when the browser had to put its own question ("Save changes to …?"), which can stay open as long
// as the person leaves it
async function st_permit(h) {
  let p = 'granted', asked = false;
  try {
    if (typeof h.queryPermission === 'function') p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted' && typeof h.requestPermission === 'function') { asked = true; p = await h.requestPermission({ mode: 'readwrite' }); }
  } catch (e) { p = 'denied'; }
  return { ok: p === 'granted', asked };
}
function st_saved(now, gen, h) {
  SP.state.savedAt = now;
  st_base = now; st_baseWhy = ''; st_refusedRaw = null; st_taken = null;
  if (h) st_handle = h;
  if (gen === st_gen) { st_dirty = false; st_dlOnly = false; st_dataMoved = false; st_savedSet = st_setJson(SP.state.settings); }   // an edit made while the file was being written is still unsaved
  else st_savedSet = null;      // the file holds a state this page no longer has: no setting put back makes the page clean
  st_fire();
}
// A Save that could only download: the work is in the download, not in this page's own file, until someone puts the
// download in its place. Marked clean, the page read "Saved" and let the tab close without a question while the file
// it was opened from still lacked the work (review S8). It stays unsaved, and says it was downloaded. This page's own
// file still holds what it held, so Save's check is still made against that (st_base does not move); the download's
// save time is remembered, so a download put in place reads as this page's own work, never "someone else's".
function st_downloaded(now, gen, name) {
  SP.state.savedAt = now;
  st_copies.set(now, name);
  if (gen === st_gen) st_dlOnly = true;
  st_fire();
}
// 'saved' | 'unsaved' | 'downloaded' (unsaved, but the last Save downloaded every change): what the top bar says
SP.saveStatus = function saveStatus() { return !st_dirty ? 'saved' : st_dlOnly ? 'downloaded' : 'unsaved'; };
// What a download is called is the browser's to decide: one that already holds the name adds a number ("… (1).html" in
// Chromium, "…(1).html" in Firefox). The message named the asked-for name, so following it put an OLDER download in place
// of the shared file (review DL-7).
function st_dlName(got) {
  return '“' + got + '” (or, if your downloads folder already holds that name, the newest download with a number added, such as “'
    + String(got).replace(/(\.html?)$/i, ' (1)$1') + '”)';
}

// WHERE WRITING IS REFUSED (a policy or site setting that blocks file editing, or a frame where the file windows throw),
// the work could not be kept at all: Save and Save a copy… each said so and offered nothing, and the settings typed into
// the page (Authorized, goals, special CCaRs, overrides) live nowhere else (review DL-4). A download is offered instead.
//   lead  'Not saved' / 'No copy was saved';  reason  why, as a clause;  name  the download's name;  own  the file it replaces
// -> the name downloaded under, or null when the person declined
function st_offerDownload(lead, reason, html, name, own) {
  const q = lead + ': ' + reason + '.\n\nDownload ' + (own ? 'the plan' : 'the copy') + ' instead, so this work is kept? The download is this page '
    + 'with the work in it' + (own ? '; put it in place of “' + own + '” to keep the work there.' : '.');
  let yes = false;
  try { yes = typeof window.confirm === 'function' && !!window.confirm(q); } catch (e) { yes = false; }
  return yes ? SP.download(name, html, 'text/html') : null;
}

SP.saveFile = async function saveFile() {
  if (st_busy) return { ok: false, message: 'A save is already running; nothing else was written.' };
  st_busy = true;
  try { return await st_saveFile(); }
  catch (e) { return { ok: false, message: 'Not saved: ' + st_err(e) + '. Nothing was written.' }; }
  finally { st_busy = false; }
};
async function st_readText(h) { return (await h.getFile()).text(); }
async function st_saveFile() {
  const name = st_pageName();
  const html0 = () => { const now = new Date().toISOString(); return { now, gen: st_gen, html: st_htmlFor(Object.assign({}, SP.state, { savedAt: now })) }; };
  // a download in place of a write the browser refused: the page stays unsaved and says it was downloaded
  const fallback = (reason) => {
    const w = html0();
    const got = st_offerDownload('Not saved', reason, w.html, name, name);
    if (got === null) return null;
    st_downloaded(w.now, w.gen, got);
    return { ok: true, message: 'The plan could not be saved to its file: ' + reason + '. It was downloaded instead, as ' + st_dlName(got) + '. The shared '
      + 'copy is not updated until you put the download in its place (replace “' + name + '” with it). Until then this page counts the work as '
      + 'unsaved, and asks before it is closed.' };
  };
  if (typeof window.showOpenFilePicker !== 'function') {
    // no way to write a file in place: the page is downloaded under its own name, and the person puts it in place
    const w = html0();
    const got = SP.download(name, w.html, 'text/html');
    st_downloaded(w.now, w.gen, got);
    return { ok: true, message: 'This browser cannot write to the file directly, so the plan was downloaded as ' + st_dlName(got) + '. '
      + 'The shared copy is not updated until you put the download in its place (replace “' + name + '” with it). '
      + 'Until then this page counts the work as unsaved, and asks before it is closed.' };
  }
  let h = st_handle, picked = false;
  if (!h) {
    st_say('Save: in the window that opened, pick this file — “' + name + '”, the one this page was opened from. Picking it changes '
      + 'nothing until it has been checked.');
    let hs;
    try { hs = await window.showOpenFilePicker({ multiple: false, types: ST_TYPES(name) }); }
    catch (e) {
      if (st_abortish(e)) return { ok: false, message: 'Not saved: no file was picked. Save again and pick “' + name + '”, the file this page was opened from.' };
      const why = 'the file window could not open (' + st_err(e) + ')';
      return fallback(why) || { ok: false, message: 'Not saved: ' + why + '. Nothing was written.' };
    }

    if (!h) return { ok: false, message: 'Not saved: no file was picked. Save again and pick “' + name + '”.' };

  }

  const other = picked && !!own && !st_sameName(fname, own);
  const cantRead = e => {
    // a file that cannot be read cannot be checked, so it is never written over; a remembered one that has gone is forgotten
    if (!picked && e && e.name === 'NotFoundError') st_handle = null;
    return { ok: false, message: 'Not saved: “' + fname + '” could not be read (' + st_err(e) + '), so it was not written over. '
      + (e && e.name === 'NotFoundError' ? 'Save again and pick where the file is now.' : 'If it is syncing, try again in a moment, or use Save a copy….') };
  };

  try { txt = await st_readText(h); } catch (e) { return cantRead(e); }
  // THE FILE IS CHECKED, THE PERSON MAY BE ASKED, THE BROWSER MAY ASK FOR WRITE ACCESS, and then the file is read AGAIN:
  // a colleague's save made while the question or the browser's own prompt was open was written over with no question,
  // and their page still read "Saved" (review DL-3). If it changed, the checks start again on what it holds now.
  let permitted = false, changedNote = '', blankOk = false, w = null;
  for (let round = 0; ; round++) {
    let waited = false;      // a question or the browser's own prompt was open: the file is read again before writing
    const f = st_readFile(txt);
    // the very data this page could not read on opening: written over only after the person says so, as data the page
    // refused for its shape always was (review DL-6: every Save refused it and sent the person to pick it again)
    const refusedRaw = !!f.unreadable && st_base === ST_REFUSED && st_refusedRaw !== null && f.raw === String(st_refusedRaw).trim();
    if (f.why && !refusedRaw) {
      if (!picked) st_handle = null;      // the next Save asks which file, rather than failing here again
      const ownName = st_sameName(fname, name);
      return { ok: false, message: changedNote + 'Not saved: “' + fname + '” ' + f.why + ', so it was not written over. '
        + (ownName ? 'If it is the file this page was opened from, use Save a copy… to keep this work, and put the copy in its place.'
          : 'Save again and pick “' + name + '”, the file this page was opened from, or use Save a copy….') };
    }
    const fs = refusedRaw ? null : f.state, fsAt = fs && typeof fs.savedAt === 'string' ? fs.savedAt : null;
    // the data this page refused on opening is still there (whatever its save time says, even none): never written over unasked
    const refusedHere = refusedRaw || (st_base === ST_REFUSED && !!fs && st_check(fs) !== '');
    // A FILE OTHER THAN THIS PAGE'S OWN, picked in the window that asked for this one. It is said in the question, never
    // left to a save time: an older plan of another team's read "saved … after this page was opened — by someone else, or in
    // another window", and OK wrote this page over it and remembered it for every later Save (review S1). A remembered file
    // was picked and confirmed already, and a page whose address names no file has nothing to compare it with.
    // Files this page wrote itself, and the plan it took, are not someone else's saves (review SEAM-4, SEAM-5).
    const copyName = fsAt !== null && st_copies.has(fsAt) ? st_copies.get(fsAt) : null;
    const tookIt = fsAt !== null && !!st_taken && st_taken.at === fsAt;
    const timed = !refusedHere && !!fs && fsAt !== null && fsAt !== st_base && copyName === null && !tookIt;
    // A PAGE THAT OPENED A SAVED PLAN was not opened from a file that holds none. A copy of the tool of the same name in
    // another folder (a Downloads folder, say) was written to with no question, the page read "Saved" and let the tab
    // close, and the shared file it came from never got the work (review DL-1).
    const blankElse = picked && !refusedHere && !fs && (typeof st_base === 'string' || st_base === ST_REFUSED);
    if (refusedHere || timed || other || blankElse) {
      const said = [];
      if (changedNote) said.push(changedNote.trim());
      if (other) said.push('You picked “' + fname + '”, not “' + own + '”, the file this page was opened from.');
      let after = false;
      if (refusedHere) {
        said.push('This page opened empty because the data saved in “' + fname + '” was not opened (' + (st_baseWhy || (fs ? st_check(fs) : ''))
          + ').\n\nSaving now writes over that data' + (fsAt ? ', saved ' + st_when(fsAt) : '') + ', and it is lost. Write over it?');
      } else if (timed) {

        after = !!ref && Date.parse(fsAt) > Date.parse(ref);

        const who = other ? '' : after ? ' — by someone else, or in another window' : '';
        if (mine) {
          // "an older copy put back" invited OK; a same-named copy in another folder is the likelier file (review DL-1)
          said.push('“' + fname + '” holds a plan saved ' + tf + (after ? ', after this page last opened or saved its plan (' + tr + ')' + who + '.'
            : ', before the plan this page opened or last saved (' + tr + ')' + (other ? '.' : ': it is not the file this page last saved, but an older copy '
              + 'of it, or another plan saved under this name, perhaps in another folder.')));
        } else {
          said.push('“' + fname + '” holds a plan saved ' + tf + (after ? ', after this page was opened (' + tr + ')' + who + '.'
            : (ref ? ', before this page was opened (' + tr + ')' : '') + '. This page opened with no saved plan, so that plan is not the one on screen.'));
        }
        if (st_taken) said.push('(This page took the plan in “' + st_taken.name + '”' + (st_taken.at ? ', saved ' + st_when(st_taken.at) : '') + '; this is another.)');
        said.push('\nSaving now writes this page’s plan over it, and the plan saved in it is lost. Write over it?');
      } else if (copyName !== null) {
        said.push('It holds a copy of this page’s own work, saved ' + st_when(fsAt) + ' as “' + copyName + '”. Save this page’s plan into “' + fname + '” instead? '
          + 'This page then saves to “' + fname + '” until it is closed.');
      } else if (tookIt) {
        said.push('It holds the plan this page took from “' + st_taken.name + '”. Save this page’s plan into “' + fname + '” instead? This page then saves to “'
          + fname + '” until it is closed.');
      } else if (!fs) {
        if (other) said.push('It holds no saved plan. Save this page’s plan into “' + fname + '” instead? This page then saves to “' + fname + '” until it is closed.');
        else {
          said.push('“' + fname + '” holds no saved plan, but this page opened ' + (typeof st_base === 'string' ? 'the plan saved ' + st_when(st_base) : 'saved data it could not read')
            + ', so this is not the file this page was opened from: it may be another copy of the tool with the same name, in another folder (a Downloads '
            + 'folder, say). Save this page’s plan into it instead? This page then saves to it until it is closed, and the file it was opened from does not get this work.');
        }
      } else {
        said.push('It holds the same save as this page (' + st_when(fsAt) + '). Save this page’s plan into “' + fname + '” instead? This page then saves to “'
          + fname + '” until it is closed.');
      }
      if (!window.confirm(said.join('\n'))) {
        return { ok: false, message: changedNote + (refusedHere
          ? 'Not saved: you chose not to write over the data in “' + fname + '” that this page could not open. Nothing was written. To keep this work, use Save a copy…'
          : other
            ? 'Not saved: you chose not to write to “' + fname + '”, which is not “' + own + '”, the file this page was opened from. Nothing was written. '
              + 'Save again and pick “' + own + '”, or use Save a copy….'
            : timed
              ? 'Not saved: “' + fname + '” holds a plan saved ' + st_when(fsAt) + (after ? ' by someone else' : '') + ', and you chose not to write over it. '
                + 'Nothing was written. To keep both, use Save a copy…; to see ' + (after ? 'theirs' : 'it') + ', open the file.'
              : 'Not saved: “' + fname + '” holds no saved plan, so it is not the file this page was opened from, and you chose not to write to it. '
                + 'Nothing was written. Save again and pick the file this page was opened from, or use Save a copy….') };
      }
      blankOk = blankElse;
      waited = true;
    }
    if (!permitted) {
      const pm = await st_permit(h);
      if (!pm.ok) {
        const why = 'writing to “' + fname + '” was not allowed';
        return fallback(why) || { ok: false, message: 'Not saved: ' + why + '. Nothing was written.' };
      }
      permitted = true;
      if (pm.asked) waited = true;
    }
    w = html0();
    if (!waited) break;
    let txt2;
    try { txt2 = await st_readText(h); } catch (e) { return cantRead(e); }
    if (txt2 === txt) break;
    if (round >= 2) return { ok: false, message: 'Not saved: “' + fname + '” kept changing while this page was saving it (someone else is saving it now). '
      + 'Nothing was written. Try again in a moment, or use Save a copy….' };
    txt = txt2;
    changedNote = '“' + fname + '” was saved again while you were answering. ';
  }
  try { await st_write(h, w.html); }
  catch (e) {
    const why = '“' + fname + '” could not be written (' + st_err(e) + ')';
    return fallback(why) || { ok: false, message: 'Not saved: ' + why + '. Use Save a copy… to keep the work.' };
  }
  st_saved(w.now, w.gen, h);
  return { ok: true, message: 'Saved to “' + fname + '” at ' + st_when(w.now).slice(11) + '.'
    + (own && !st_sameName(fname, own) ? ' This page saves there until it is closed; “' + own + '”, the file it was opened from, does not have this work.'
      : blankOk ? ' This page saves there until it is closed; the file it was opened from does not have this work.' : '') };
}

SP.saveCopy = async function saveCopy() {

    if (got === null) return null;

  }

  } catch (e) {

    const why = 'the file window could not open (' + st_err(e) + ')';

  let own = false;
  if (st_handle && typeof h.isSameEntry === 'function') { try { own = await h.isSameEntry(st_handle); } catch (e) { own = false; } }

  // a file of that name in another folder. It said "which does not have this work yet" of a file that had it (review
  // SEAM-5, DL-5, BP-7). It is never taken for the page's own on its name alone (marked saved, the page would let the tab
  // close while its real file lacked the work): the message says what is known, and Save no longer calls it someone else's.
  const pn = st_pageNameKnown();

  }
  return { ok: true, message: 'Saved a copy as “' + cname + '”. This page still saves to “' + st_pageName() + '”'
    + (st_dirty ? ', which does not have this work yet: use Save for that.' : '.') };
}

function ui_e(s) { return SP.esc(s); }
function ui_pad(n) { return String(n).padStart(2, '0'); }
// an ISO timestamp -> this computer's calendar day, which is the day the person imported it
function ui_day(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 10);
  return d.getFullYear() + '-' + ui_pad(d.getMonth() + 1) + '-' + ui_pad(d.getDate());
}
function ui_today() { return ui_day(new Date().toISOString()); }
// this computer's 'YYYY-MM-DD HH:MM', with the seconds when asked
function ui_when(iso, sec) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return ui_day(iso);
  return ui_day(iso) + ' ' + ui_pad(d.getHours()) + ':' + ui_pad(d.getMinutes()) + (sec ? ':' + ui_pad(d.getSeconds()) : '');
}
// two imports named so they can be told apart: by day, else by time, else to the second ("pull of 2026-11-09 → pull of
// 2026-11-09" said nothing when both came in on one day, review S11)
function ui_pullPair(a, b) {
  if (ui_day(a) !== ui_day(b)) return [ui_day(a), ui_day(b)];
  if (ui_when(a) !== ui_when(b)) return [ui_when(a), ui_when(b)];
  return [ui_when(a, true), ui_when(b, true)];
}
// Several imports named so each can be told apart: a day where no other import shares it, else the time, else the time

function ui_whens(isos) {
  const xs = [...new Set(isos.filter(x => typeof x === 'string' && x))];
  const clash = (f, x) => xs.some(y => y !== x && f(y) === f(x));
  return iso => (!iso ? '' : !clash(ui_day, iso) ? ui_day(iso) : !clash(y => ui_when(y), iso) ? ui_when(iso) : ui_when(iso, true));

// the model was built with a report (§14.5 model.bae)
function ui_rep(M) { return !!(M && M.bae && M.bae.present); }

// the model, built once per change of data, settings or switches; a view change or a row opened reuses it
function ui_model() {
  if (ui.model || ui.modelErr || !ui_hasData()) return ui.model;
  try { ui.model = SP.buildModel(ui_pulls(), ui_settings(), ui_view(), ui_bae()); }
  catch (e) { ui.modelErr = (e && e.message) || String(e); ui.model = null; }
  return ui.model;
}
function ui_invalidate() { ui.model = null; ui.modelErr = null; }

// ---------------------------------------------------------------------------------------------------------------
// THE MESSAGE LINE: every result and every error is said here, with its reason; nothing is swallowed
// ---------------------------------------------------------------------------------------------------------------
function ui_say(text, kind) {
  const el = ui.els && ui.els.msg;
  if (!el) return;
  el.textContent = text ? String(text) : '';
  el.className = 'msg' + (text ? ' msg-' + (kind || 'info') : '');
  // A message stays until the next one, inside the sticky top: a refused import naming its sheets made the top 167 px
  // of a 768 px window, on every view, with no way to put it away (review S7). Dismiss takes it off; its reason is kept
  // where it belongs (a refused import in the Import report). The button sits outside the live region, so it is not read
  // out with every message.
  if (ui.els.msgx) ui.els.msgx.hidden = !text;
  ui_layout();
}

// CELLS. Money cells carry their exact cents in data-c (a number from the model, never pull text), so a check can
// compare a figure to the dollar where the screen shows it to $0.01M.
// ---------------------------------------------------------------------------------------------------------------
function ui_vis(M) { return M.cols.filter(c => c.id !== 'nodate' || M.showNoDate); }
function ui_m(c, cls) {
  const ok = typeof c === 'number' && isFinite(c);
  return '<td class="n' + (cls ? ' ' + cls : '') + '"' + (ok ? ' data-c="' + c + '"' : '') + '>' + (ok ? ui_e(SP.fmtM(c)) : '') + '</td>';
}
function ui_p(x, cls) { return '<td class="n' + (cls ? ' ' + cls : '') + '">' + (x === null || x === undefined ? '' : ui_e(SP.fmtPct(x))) + '</td>'; }
function ui_d(x) { return '<td class="n">' + (x === null || x === undefined ? '' : ui_e(SP.fmtDelta(x))) + '</td>'; }
// a status is always its colour AND its word. A plan cell (a month after the as-of month) is a forecast of the
// status: its fill and word in italic, as the workbook and the pictures print it (CONTRACT §8: grey words on
// the red or green fill could not be read).
function ui_st(st, plan, cls) {
  if (!st) return '<td class="st' + (cls ? ' ' + cls : '') + '"></td>';
  const w = ui_e(SP.statusWord(st));
  if (plan) return '<td class="st st-' + st + ' plan' + (cls ? ' ' + cls : '') + '">' + w + '</td>';
  return '<td class="st st-' + st + (cls ? ' ' + cls : '') + '">' + w + '</td>';
}
// A MARK'S WORDS depend on the model (SP.markText): with a BAE report loaded, † is "neither entered nor in the BAE report",
// ‡ is on every entered figure (review I4-4), and § exists (§14.5). With no report they are SP.AUTH_MARK_TEXT's, word for
// word, so nothing on a page without one moves.
function ui_markText(m, M) { return typeof SP.markText === 'function' ? SP.markText(m, M) : SP.AUTH_MARK_TEXT[m] || ''; }
const UI_MARK_CLASS = { '†': 'dag', '‡': 'ddag', '§': 'sect' };
function ui_markSpan(m, M) { return '<span class="' + UI_MARK_CLASS[m] + '" title="' + ui_e(ui_markText(m, M)) + '">' + m + '</span>'; }
// mark: '†' not entered, '‡' entered while some switch is off, or with a BAE report loaded (SP.authMark), or '' / '†‡' on a
// TOTAL (SP.authMarks)
function ui_auth(cents, mark, M) {
  const m = String(mark || '');
  return '<td class="n" data-c="' + cents + '">' + ui_e(SP.fmtM(cents))
    + (m.includes('†') ? ui_markSpan('†', M) : '') + (m.includes('‡') ? ui_markSpan('‡', M) : '') + '</td>';
}
// §14.5 an APPROVED cell, marked § where the BAE report has no figure for the block and Approved is the CCaR plan. With no
// mark it is ui_m's cell exactly, so a page with no report draws the very markup it drew before.
function ui_appr(cents, mark, M) {

// the line under a table for each mark it prints (§8, §14.5), § first because Approved comes before Authorized
function ui_markNotes(am, M) {
  return (am.sect ? '<p class="note mark-note" data-mark="sect">§ ' + ui_e(ui_markText('§', M)) + '</p>' : '')

// `every`: what a view the switches do not reach covers instead. Its headline says so: under the bold "Showing only part of
// the data." the Import report and What changed said in small print that they show every row, and a reader skimming the

function ui_shown(M, extra, every) {
  if (M.shown.all) return '';

    + 'The other views show only part of the data (' + ui_e(M.shown.text) + ').</p>';

function ui_hdr(M, first) {

function ui_colsRow(M, labelHtml, cols, total, cls) {

// THE TOTALS BAND MEASURES THE CCaR PLAN BY MONTH (rule 6, CONTRACT §14.3): its Total column prints the plan and the
// plan's Obl %, goal and status (SP.plannedOf, SP.slideOf), never the BAE report's Approved beside a month row that adds
// up to the plan. With no report the two are the block's Approved and headline, exactly as before.
function ui_band(M, b) {
  const V = ui_vis(M);
  const out = [];
  const P = SP.plannedOf(b), sl = SP.slideOf(b);
  out.push(ui_colsRow(M, 'Monthly Totals', b.cols, P, 'band'));
  // Cumulative's Total cells print Approved (the plan), as v12's did (=O53) and as the workbook and the pictures print it:
  // No date is outside the running sum, never outside the total (integration ruling, so the three products agree)
  out.push('<tr class="band"><th scope="row" class="lab">Cumulative Totals</th>' + ui_m(P, 'tot')
    + V.map(c => (c.id === 'nodate' ? '<td></td>' : ui_m(b.cum[c.index], c.closed ? 'cl' : ''))).join('') + ui_m(P, 'tot') + '</tr>');
  // the label's words are SP.oblLabel's, the workbook's and the picture's too (review R7); &nbsp; keeps its two spaces
  out.push('<tr class="band"><th scope="row" class="lab">' + ui_e(SP.oblLabel(b, M)).replace(/ {2}/g, '&nbsp; ') + '</th>' + ui_p(sl.oblPct, 'tot')
    + V.map(c => { const o = b.obl[c.index] || {}; return ui_p(o.v, (c.closed ? 'cl' : '') + (o.kind === 'plan' ? ' plan' : '')); }).join('')
    + ui_p(sl.oblPct, 'tot') + '</tr>');
  out.push('<tr class="band"><th scope="row" class="lab">OSD Goal %</th>' + ui_p(sl.goal, 'tot')
    + V.map(c => ui_p(b.goalC[c.index], c.closed ? 'cl' : '')).join('') + ui_p(sl.goal, 'tot') + '</tr>');
  out.push('<tr class="band stband"><th scope="row" class="lab">OSD Status</th>' + ui_st(sl.status, false, 'tot')
    + V.map(c => { const s = b.statusC[c.index] || {}; return ui_st(s.status, s.kind === 'plan', c.closed ? 'cl' : ''); }).join('')
    + ui_st(sl.status, false, 'tot') + '</tr>');

// ---------------------------------------------------------------------------------------------------------------
// TREES (§4.4) with their open/closed state, keyed by the node's path of normKeys inside a scope
// ---------------------------------------------------------------------------------------------------------------
function ui_pk(n) { return n.path.join('\u0000'); }
function ui_isOpen(scope, n) {
  const o = ui.open.get(scope);
  const pk = ui_pk(n);
  if (o && o.has(pk)) return o.get(pk);
  return n.level < (ui.level.get(scope) || 2);
}
function ui_nodeId(scope, n) {
  const R = ui.reg, pk = ui_pk(n);
  let id = 'n' + ui_hash(scope + '\u0001' + pk), k = 1;
  while (R.nodes.has(id) && (R.nodes.get(id).scope !== scope || R.nodes.get(id).pk !== pk)) id = 'n' + ui_hash(scope + '\u0001' + pk) + '_' + (k++);
  R.nodes.set(id, { scope, pk });
  return id;
}
function ui_tree(M, scope, nodes, out) {
  for (const n of nodes) {
    const kids = n.children && n.children.length;
    const open = kids && ui_isOpen(scope, n);
    let lab;
    if (kids) {
      const id = ui_nodeId(scope, n);
      lab = '<button type="button" class="tg" data-act="tg" data-id="' + id + '" data-fkey="tg:' + id + '" aria-expanded="' + (open ? 'true' : 'false')
        + '"><span class="arr" aria-hidden="true">' + (open ? '▾' : '▸') + '</span>' + ui_e(n.label) + '</button>';
    } else lab = '<span class="leaf">' + ui_e(n.label) + '</span>';
    out.push('<tr class="lv' + n.level + '"><th scope="row" class="lab lv' + n.level + '">' + lab + '</th>' + ui_m(n.total, 'tot')
      + ui_vis(M).map(c => ui_m(n.cols[c.index], c.closed ? 'cl' : '')).join('') + ui_m(n.total, 'tot') + '</tr>');
    if (open) ui_tree(M, scope, n.children, out);
  }
}
function ui_levelPick(scope, label) {
  const R = ui.reg, i = R.scopes.length;
  R.scopes.push(scope);
  const cur = ui.level.get(scope) || 2;
  // the accessible name starts with the words on screen, then says which block: named "Expand O&M FY2025 to", a person
  // speaking "click Expand to" reached nothing (WCAG 2.5.3, review SCR2-10)
  return '<label class="lvl">Expand to <select data-act="lvl" data-s="' + i + '" data-fkey="lvl:' + i + '" aria-label="Expand to (' + ui_e(label) + ')">'
    + UI_LEVELS.map((t, k) => '<option value="' + (k + 1) + '"' + (cur === k + 1 ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></label>';
}

// a top table: one row per block, with a Total row that has no goal (§8.1, §8.3, §8.6)
function ui_topTable(rows, opts) {
  const withAp = opts.withAp;
  const head = (withAp ? '<th scope="col">Appropriation</th>' : '') + '<th scope="col">FY</th><th scope="col" class="n">Approved ($M)</th>'
    + '<th scope="col" class="n">Authorized ($M)</th><th scope="col" class="n">Obligated ($M)</th><th scope="col" class="n">Unobligated ($M)</th>'
    + '<th scope="col" class="n">Obl %</th><th scope="col" class="n">OSD Goal %</th><th scope="col" class="n">Delta (pp)</th><th scope="col">Status</th>';
  const body = [];
  let i = 0;
  while (i < rows.length) {
    let j = i;
    if (withAp && opts.mergeAp) while (j + 1 < rows.length && rows[j + 1].ap === rows[i].ap) j++;
    for (let k = i; k <= j; k++) {
      const r = rows[k];
      const apCell = !withAp ? '' : !opts.mergeAp ? '<td>' + ui_e(UI_AP_LABEL[r.ap] || r.ap) + '</td>'
        : k === i ? '<th scope="rowgroup" rowspan="' + (j - i + 1) + '" class="apg">' + ui_e(UI_AP_LABEL[r.ap] || r.ap) + '</th>' : '';

  // switches do not reach (‡, review R3), and Approved for every row where none was entered (†). It carried only ‡, so
  // with nothing entered thirteen rows read 161.64† above a bare TOTAL that the workbook printed 2,214.43†: one figure,
  // two claims about what it is (review SEAM-8).
  // With a BAE report loaded, its Approved carries § when a row's does: it adds in the CCaR plan of a block the report has
  // no figure for (§14.5), beside report figures (sect is false on every row with none).

  // each mark used is said under the table, as each workbook sheet says it (review M4): an appropriation view's † had
  // only a tooltip to explain it
  return '<div class="tw"><table class="grid top"><thead><tr class="hd">' + head + '</tr></thead><tbody>' + body.join('') + '</tbody></table></div>'
    + ui_markNotes(am, opts.model);
}

// one block's months: a bar for each month's Obligation % (an actual in a closed month, the plan after, as the slide

function ui_ovChart(c) {
  const W = 300, H = 132, L = 30, R = 6, T = 8, B = 20, pw = W - L - R, ph = H - T - B;
  const vals = c.months.flatMap(m => [m.v, m.goal]).filter(x => typeof x === 'number' && isFinite(x));
  const top = Math.max(1, ...vals), step = pw / 12, y = v => T + ph - Math.max(0, v) / top * ph;
  let g = '';
  for (const f of [0, 0.5, 1]) {
    g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(f).toFixed(1) + '" y2="' + y(f).toFixed(1) + '"/>'
      + '<text class="ax" x="' + (L - 4) + '" y="' + (y(f) + 3).toFixed(1) + '" text-anchor="end">' + (f * 100) + '%</text>';
  }
  const pts = [];
  c.months.forEach((m, i) => {
    const x = L + i * step;
    const say = m.label + ': ' + (m.v === null ? 'no figure' : SP.fmtPct(m.v) + (m.kind === 'plan' ? ' planned' : ' actual'))
      + (m.goal === null || m.goal === undefined ? '' : '; OSD goal ' + SP.fmtPct(m.goal)) + (m.status ? '; ' + SP.statusWord(m.status) : '');
    if (typeof m.v === 'number' && isFinite(m.v)) {

        + cols.map(c => cell(x, c)).join('') + '<td class="n tot" data-c="' + x.planned + '">' + ui_e(SP.fmtMText(x.planned)) + '</td></tr>';
    }
  }
  for (const r of [...shown].sort((a, b) => (a.pmo < b.pmo ? -1 : a.pmo > b.pmo ? 1 : 0))) {
    if (r.pmoKey !== lastPmo) { body += '<tr class="calg"><th scope="colgroup" colspan="' + (cols.length + 2) + '">' + ui_e(r.pmo) + '</th></tr>'; lastPmo = r.pmoKey; }
    body += '<tr data-rk="' + all.indexOf(r) + '"><th scope="row" class="lab">' + ui_reqBtn(r, all, 'cal') + '<span class="fsub">' + ui_e(r.ccar) + ' · ' + ui_e(r.apLabel) + ' FY' + r.fy + '</span></th>'
      + cols.map(c => cell(r, c)).join('') + '<td class="n tot" data-c="' + r.planned + '">' + ui_e(SP.fmtMText(r.planned)) + '</td></tr>';
  }
  return head + '<p class="findcount" id="uiCalCount" role="status">' + SP.fmtInt(list.length) + (list.length === 1 ? ' requirement' : ' requirements')
    + (rolled.length ? ', ' + SP.fmtInt(list.length - rest.length) + ' of them on ' + rolled.length + (rolled.length === 1 ? ' Special CCaR line' : ' Special CCaR lines') : '')
    + (rest.length > UI_CAL_MAX ? '. The first ' + UI_CAL_MAX + ' of the others are listed, and the totals are of all of them: pick a PMO, an appropriation or an FY.' : '') + '</p>'
    + '<div class="card calcard"><div class="tw"><table class="calt"><thead><tr><th scope="col" class="lab">Requirement ($M)</th>'
    + cols.map(c => '<th scope="col" class="' + (c.closed ? 'cl' : '') + (c.index === M.asOfIndex ? ' now' : '') + '">' + ui_e(c.label) + '</th>').join('') + '<th scope="col">Total</th></tr></thead><tbody>'
    + body + '<tr class="calt-tot"><th scope="row" class="lab">Total</th>' + tot.map((v, i) => '<td class="' + (cols[i].closed ? 'cl' : '') + '" data-c="' + v + '">' + ui_e(SP.fmtM(v)) + '</td>').join('')
    + '<td class="n tot" data-c="' + tot.reduce((s, v) => s + v, 0) + '">' + ui_e(SP.fmtMText(tot.reduce((s, v) => s + v, 0))) + '</td></tr></tbody></table></div>'
    + '<p class="ovleg"><span class="cchip c-aw">Awarded</span> <span class="cchip c-plan">Projected</span> <span class="cchip c-late">Not awarded, past its date</span> Shaded months have closed (through ' + ui_e(M.cols[M.asOfIndex].label) + '). '
    + ui_e(M.cols[0].label) + ' is before the year’s October; ' + ui_e(M.cols[13].label) + ' is after its September.</p></div>';
}

// THE CHARTS, LINED UP (Brad, 12 Nov 2026: "line them up by appropriation and year order. Right now it's hard to find
// exactly what you really want to see"). One row for each appropriation, in the order every list prints them, and one
// column for each fiscal year shown, earliest first, so a block is always found at its appropriation's row under its
// year; a year an appropriation has no block for is an empty place, never closed up. With one year picked the
// appropriations run down a single column.
function ui_ovGrid(O, M) {
  const fys = [...new Set(O.charts.map(c => c.fy))].sort((a, b) => a - b);
  const head = fys.length > 1 ? fys.map((f, i) => '<div class="ovfyh" style="grid-column:' + (i + 1) + '">FY' + f + '</div>').join('') : '';
  const rows = SP.APS.map(a => {
    const mine = O.charts.filter(c => O.rows.find(r => r.key === c.key).ap === a.id).sort((x, y) => x.fy - y.fy);
    if (!mine.length) return '';
    return '<h4 class="ovaph" data-ap="' + ui_e(a.id) + '">' + ui_e(a.label) + '</h4>' + mine.map(c => {
      const b = O.rows.find(r => r.key === c.key), sl = SP.slideOf(b);
      return '<figure class="ovc" data-bk="' + ui_e(c.key) + '" style="grid-column:' + (fys.indexOf(c.fy) + 1) + '"><figcaption><button type="button" class="ovopen" data-act="view" data-v="'
        + ui_e(b.ap) + '" data-fkey="ov:' + ui_e(c.key) + '">' + ui_e(c.apLabel) + ' FY' + c.fy + '</button>'
        + (sl && sl.status ? '<span class="stc st st-' + sl.status + '">' + ui_e(SP.statusWord(sl.status)) + '</span>' : '')
        + '<span class="ovpct">' + (sl && sl.oblPct !== null && sl.oblPct !== undefined ? ui_e(SP.fmtPct(sl.oblPct)) : '') + '</span></figcaption>' + ui_ovChart(c)
        + '<p class="ovlab">' + ui_e(c.label) + '</p></figure>';
    }).join('');
  }).join('');
  return '<div class="ovscroll"><div class="ovcharts" data-cols="' + fys.length + '" style="--n:' + Math.max(1, fys.length) + '">' + head + rows + '</div></div>';
}
function ui_vOverview(M) {

  const seg = '<div class="seg" role="group" aria-label="Fiscal year">' + O.fys.map(f => '<button type="button" data-act="ovfy" data-fy="' + f + '" data-fkey="ovfy:' + f
    + '" aria-pressed="' + (O.fy === f ? 'true' : 'false') + '">FY' + f + '</button>').join('')

  const tiles = '<div class="tiles">'
    + ui_ovTile('approved', 'Approved ($M)', t.approved, O.marks.sect ? '§' : '', O.fy === null ? 'every FY shown' : 'FY' + O.fy, M)
    + ui_ovTile('authorized', 'Authorized ($M)', t.authorized, (O.marks.dag ? '†' : '') + (O.marks.ddag ? '‡' : ''), of(t.approved !== 0 ? t.authorized / t.approved : null, 'Approved'), M)

  const staleNote = !O.stale.length ? '' : '<p class="note ovstale">Imported before the end of ' + ui_e(M.asOfLabel) + ', the data-through month: '
    + ui_e(O.stale.map(s => s.label + ' ' + s.day).join('; ')) + '. Actual obligations stop at that import, while goals and statuses are read at '
    + ui_e(M.asOfLabel) + '; each chart’s label names the import.</p>';
  const status = '<div class="ovstatus" data-tile="status"><span class="tl">Status of ' + n + (n === 1 ? ' block' : ' blocks') + '</span>'
    + O.status.map(s => '<span class="stc st st-' + s.status + '" data-st="' + s.status + '">' + s.n + ' ' + ui_e(s.word) + '</span>').join('')
    // two reasons a row has no status word, said apart (review MC-1): "no OSD goal" over a row whose Approved was zero
    // contradicted the Summary, which prints that row's goal
    + (O.noPct ? '<span class="stc stn" data-st="nopct" title="Approved is zero for what is shown, so there is no Obligation % to hold against the OSD goal">' + O.noPct + ' with no Obligation %</span>' : '')
    + (O.noGoal ? '<span class="stc stn" data-st="none">' + O.noGoal + ' with no OSD goal</span>' : '')
    + '<button type="button" data-act="view" data-v="summary" data-fkey="ov:summary">Open the Summary</button></div>';
  const charts = '<section class="card"><h3>Obligation % against the OSD goal, by month</h3>'
    // "an actual through Nov" over a pull imported on 9 November was untrue, above labels that said so (review MC-5):
    // where a pull shown is stale the sentence leaves the month to each chart's own label (SP.oblLabel, §4.6)
    + '<p class="cardnote">Each block as its slide block states it: an actual through '
    + (O.stale.length ? 'the month or import its label names' : ui_e(M.cols[M.asOfIndex].label)) + ', the plan after. Bars are Obligation %; the line is the OSD goal.</p>'
    // with a BAE report the tiles and the status counts above measure the report's Approved and these charts the CCaR
    // plan (§14.3 rule 6), so one block can read two Obligation % and two statuses on this page: said here in the words
    // the Slide blocks view and the Slide Snapshots sheet use (review MC-2)
    + (rep ? '<p class="cardnote bae-plan">' + ui_e(SP.SLIDES_PLAN_NOTE) + ' The tiles and the status counts above are the Summary’s, measured against its Approved.</p>' : '')
    + ui_ovGrid(O, M)
    + '<p class="ovleg"><span class="k ka"></span>Actual <span class="k kp"></span>Plan <span class="k kg"></span>OSD goal</p></section>';
  const aps = '<section class="card"><h3>Approved by appropriation' + (O.fy === null ? '' : ', FY' + O.fy) + '</h3><div class="ovap">' + ui_ovDonut(O.byAp)
    + '<table class="ovaps"><tbody>' + O.byAp.map(a => '<tr data-ap="' + ui_e(a.ap) + '"><th scope="row"><span class="k" style="background:'
      + UI_OV_AP[SP.APS.findIndex(x => x.id === a.ap) % UI_OV_AP.length] + '"></span>' + ui_e(a.label) + '</th><td class="n" data-c="' + a.approved + '">' + ui_e(SP.fmtMText(a.approved)) + (a.sect ? ui_markSpan('§', M) : '')
      + '</td><td class="n">' + (a.share === null ? '' : ui_e(SP.fmtPct(a.share))) + '</td></tr>').join('') + '</tbody></table></div></section>';
  return head + tiles + status + '<div class="ovnotes">' + ui_markNotes(O.marks, M) + staleNote + '</div><div class="ovtwo' + (new Set(O.charts.map(c => c.fy)).size > 2 ? ' ovwide' : '') + '">' + charts + aps + '</div>';
}

function ui_quarter(M) { return Math.ceil(M.asOfIndex / 3); }
function ui_vSummary(M) {
  const legend = '<table class="legend"><caption>Status</caption><tbody>' + SP.STATUS_LEGEND.map(l =>
    '<tr><td class="st st-' + l.status + '">' + ui_e(l.word) + '</td><td>' + ui_e(l.colour) + ' — ' + ui_e(l.meaning) + '</td></tr>').join('')
    + '</tbody></table>';
  const notes = M.summary.notes.length
    ? '<h3 class="sub">Notes</h3><ul class="notes">' + M.summary.notes.map(n => '<li>' + ui_e(n) + '</li>').join('') + '</ul>' : '';
  // Line 2 with a BAE report loaded is SP.summaryLine2's, the workbook's words (§14.5), with the screen's own quotation
  // marks; with none it is §8.1's as this view has always drawn it
  const l2 = ui_rep(M) ? ui_e(SP.summaryLine2(M).replace('"Actual Execution"', '“Actual Execution”'))
    : 'Data through ' + ui_e(M.asOfLabel) + ' | Approved = total planned ($M from the CCaR pull) | Authorized = entered, else Approved'
      + ' | Obligated = CCaR status “Actual Execution” | Unobligated = Approved - Obligated | Delta = Obl% - OSD%';
  return '<h2 class="title">F-35 Sustainment Financial Execution - Top-Line Snapshot (FY' + ui_pad(M.E % 100) + 'Q' + ui_quarter(M) + ')</h2>'
    + '<p class="l2">' + l2 + '</p>'
    + '<p class="l3' + (M.shown.all ? '' : ' filtered') + '">' + ui_e(M.shown.text) + '</p>'
    + (M.blocks.length ? ui_topTable(M.summary.rows, { model: M, withAp: true, mergeAp: true, total: M.summary.total, totalLabel: 'TOTAL - Sustainment' })
      : '<p class="none">No appropriation and FY has rows to show.</p>')
    + legend + notes;
}

function ui_pictureName(b) { return b.apLabel + ' FY' + b.fy + '.png'; }

    // rule 6 (§14.3): with a BAE report loaded the Summary's Approved is the report's, and a block here still adds up the
