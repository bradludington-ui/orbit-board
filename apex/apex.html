<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="sfcb-spend-plan" content="program">
<title>APEX</title>
<style>
/* APEX (until November 2026 the SFCB Spend Plan) dashboard: the page look (CONTRACT §9, §18). The frame is APEX's dark
   shell; every table is on a light sheet in v12's colours: navy 1F3A68 bars, gold FFE699 header rows with
   a 404040 box, thin 808080 grid, PMO-tab bars 305496 with BDD7EE strips, closed months F2F2F2, and a status that is
   always its colour AND its word. Nothing here is loaded from anywhere: the CSP allows no font or stylesheet but this. */
:root{
  --navy:#1F3A68; --navy2:#305496; --strip:#BDD7EE; --gold:#FFE699; --box:#404040; --grid:#808080; --closed:#F2F2F2;
  --green:#00B050; --yellow:#FFD700; --red:#C00000; --plan:#595959; --focus:#E46C0A; --line:#c8d0dc; --soft:#eef2f8;
  --cuiH:20px;
  /* the APEX shell (§18) */
  --sbg:#040a16; --sbg2:#081426; --spanel:#0c1b31; --spanel2:#10233f; --sline:#1c3557; --sedge:#4f6f9c; --sink:#eaf2fc; --smut:#a9bdd8;
  --steal:#2fd6c8; --sblue:#3f9bff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;
  /* the keyboard's place is never under the sticky top or the bottom CUI line (WCAG 2.2 2.4.11, review S5): --topH and
     --theadH are what they cover, measured by the screens (90-ui.js ui_layout) as the top grows and shrinks */
  scroll-padding-top:calc(var(--topH, 140px) + var(--theadH, 0px) + 8px);scroll-padding-bottom:calc(var(--cuiH) + 8px)}
/* a column at least the window's height, so on a short view the bottom CUI line sits at the bottom, not mid-screen */
body{margin:0;background:var(--sbg);color:#111;font:13px/1.35 Calibri,Carlito,"Segoe UI",Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column}
#app{flex:1 0 auto;min-width:0}

/* the CUI marking stays on screen at the top and the bottom whatever is scrolled (§6 item 14) */
.cui{position:sticky;z-index:40;height:var(--cuiH);line-height:var(--cuiH);text-align:center;font-weight:700;font-size:12px;
  letter-spacing:.04em;background:#fff;color:#000;border-color:#000;border-style:solid;border-width:0}
.cui-top{top:0;border-bottom-width:1px}
.cui-bottom{bottom:0;border-top-width:1px}
.boot-note{padding:16px;color:#d3e0f2}

/* the top bar: sticky under the CUI line, so Save, the save state and the views never scroll away */
header.top{position:sticky;top:var(--cuiH);z-index:30;background:var(--sbg2);color:var(--sink);border-bottom:1px solid var(--sline);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.bar1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 14px;background:linear-gradient(180deg,#0b1a31,var(--sbg2));color:var(--sink)}
.brand{margin:0;font-size:20px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;letter-spacing:.03em}
.brand .logo{height:26px;width:auto;flex:none;color:var(--sink);--apex-accent:var(--gold)}
/* the name as text, beside the drawn one: read aloud and found by a search, not shown twice */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.brand .bs{font-size:13px;font-weight:400;letter-spacing:0;color:var(--smut);padding-left:9px;border-left:1px solid var(--sedge)}
.brand .ey{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid var(--steal);background:#0c3a3a;color:#d6fbf6;font-size:12px;font-weight:700;letter-spacing:0}
.brand .ey:empty{display:none}
.bar1 .fld{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.bar1 input{font:inherit;font-weight:400;padding:2px 4px;border:1px solid var(--sedge);border-radius:4px;color:#111;background:#fff}
.bar1 input[type=number]{width:5.2em}
.bar1 input:disabled{background:#c9d1de;color:#555}
.bar1 .grow{flex:1 1 0;min-width:0}
.bar1 button{font:inherit;font-weight:600;padding:3px 10px;border:1px solid var(--sedge);border-radius:6px;background:#0e2140;color:var(--sink);cursor:pointer;white-space:nowrap}
.bar1 button:hover{background:var(--gold);color:#000}
.bar1 button[aria-pressed=true]{background:var(--gold);color:#000}
.savest{font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:3px}
.savest.clean{color:#fff;border:1px solid rgba(255,255,255,.6)}
.savest.dirty{color:#000;background:var(--gold)}
.pulls{padding:2px 14px;font-size:12px;color:var(--smut);background:#071223;border-top:1px solid var(--sline);overflow-wrap:anywhere}
.pulls .d{font-variant-numeric:tabular-nums}
.msgrow{display:flex;align-items:flex-start}
.msg{flex:1 1 auto;min-width:0;padding:0 12px;font-size:13px;overflow-wrap:anywhere}
.msgx{flex:0 0 auto;margin:3px 12px 3px 6px;font:inherit;font-size:12px;font-weight:600;padding:1px 8px;border:1px solid var(--navy);border-radius:3px;/* on a message's light fill */
  background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.msgx:hover{background:var(--gold);color:#000}
.msg-info,.msg-ok,.msg-warn,.msg-err{padding:4px 12px;border-left:5px solid}
.msg-info{background:var(--soft);border-color:var(--navy2);color:#111}
.msg-ok{color:#111}
.msg-ok{background:#e9f6ec;border-color:var(--green)}
.msg-err{background:#fde9e7;border-color:var(--red);color:#7a0000;font-weight:600}
.msg-warn{background:#fff6d6;border-color:#b07d00;color:#4a3600;font-weight:600}
/* the shell: the views in a menu down the left, the view beside it (§18). The menu stays on screen under the sticky top;
   in a narrow window it is a row above the view. */
.shell{display:flex;align-items:flex-start;min-width:0}
.content{flex:1 1 0;min-width:0}
/* 144px beside the sheet. At 1400 px and narrower the menu and the sheet's margins are tighter (the rule is at the end
   of the screen rules): at 1366 px with a 15 px scrollbar, 144px left a tree 1177 px, and trees opened to CCaR run to
   1195 px, so three of the fixture's lost their right-hand column to a box of their own (review UX-1) */
nav.views{flex:0 0 144px;display:flex;flex-direction:column;gap:2px;padding:10px 6px;position:sticky;top:var(--topH, 96px);
  max-height:calc(100vh - var(--topH, 96px) - var(--cuiH));overflow-y:auto}
nav.views[hidden]{display:none}
nav.views button{font:inherit;text-align:left;padding:6px 10px;border:1px solid transparent;border-radius:7px;background:none;color:#d3e0f2;cursor:pointer}
nav.views button:hover{background:var(--spanel2);color:#fff}
nav.views button[aria-pressed=true]{background:#12305a;border-color:var(--sline);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--steal)}
@media (max-width:900px){
  .shell{display:block}
  nav.views{position:static;flex-direction:row;flex-wrap:wrap;max-height:none;padding:6px 10px}
}

/* the switches */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:8px 8px 0 0;padding:6px 12px;background:var(--spanel);color:var(--sink);border:1px solid var(--sline);border-radius:8px}
.filters .fl{font-weight:700;color:#9fd0ff}
.chk{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.chk input{width:16px;height:16px;margin:0}
.shownline{flex-basis:100%;font-size:12px;color:var(--smut)}
.l3.filtered{color:#8a3a00;font-weight:700}
.shownline.filtered,.ovshown.filtered{color:#ffc27a;font-weight:700}

/* every view */
main{display:block;padding:6px 16px 28px;max-width:100%}
/* every view but the Overview is on a light sheet, in v12's colours, as the workbook and the pictures print it */
main.sheet{margin:8px 8px 12px 0;padding:6px 10px 28px;background:#fff;color:#111;border-radius:8px;border:1px solid var(--sline)}
main:focus{outline:none}
h2.title{margin:10px 0 4px;padding:5px 10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;overflow-wrap:anywhere}
h3.sub,h4.sub{margin:14px 0 4px;color:var(--navy);font-size:14px}
h4.sub{font-size:13px}
.l2,.l3,.note{margin:3px 0;color:#333;overflow-wrap:anywhere}
.l3{font-style:italic}
.shown{margin:6px 0;padding:4px 8px;background:#fff4ce;border-left:5px solid var(--focus)}
.none{color:#555;font-style:italic}
.err{color:#7a0000;font-weight:600}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0}
main button,main select,main input{font:inherit}
main button{padding:3px 10px;border:1px solid var(--navy);border-radius:3px;background:#fff;color:var(--navy);cursor:pointer}
main button:hover{background:var(--gold);color:#000}
main button:disabled{border-color:#aaa;color:#777;background:#f3f3f3;cursor:default}
main select{padding:2px 4px;border:1px solid var(--grid);border-radius:2px;background:#fff;max-width:100%}
main input[type=text]{padding:2px 4px;border:1px solid var(--grid);border-radius:2px}
main label{display:inline-flex;align-items:center;gap:6px}
.count{margin:4px 0;font-weight:700}

/* the keyboard's place is always visible, on the navy bars and on white alike (orange clears 3:1 on both) */
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
/* the month box's calendar button is a Tab stop inside the box itself, where the box no longer matches :focus */
input[type=month]:focus-within{outline:3px solid var(--focus);outline-offset:1px}
.tg:focus-visible{outline-offset:0}

/* tables: a wide one scrolls inside its own box; the page itself never scrolls sideways */
.tw{max-width:100%;overflow-x:auto;margin:2px 0 8px}
/* a tree's column headings stay on screen as it scrolls (review S6). A box that scrolls sideways is the scroll container
   its headings would stick to, so a tree that fits its box gets no such box and sticks under the sticky top; one wider
   than the window scrolls inside a box of its own, as tall as the window leaves, with the headings at that box's top. */
.tw.treew.fit{overflow:visible}
.tw.treew.fit table.tree thead th{position:sticky;top:var(--topH, 140px);z-index:5}
.tw.treew.box{max-height:calc(100vh - var(--topH, 140px) - var(--cuiH) - 12px);overflow:auto;scroll-padding-top:3em}
.tw.treew.box table.tree thead th{position:sticky;top:0;z-index:5}
table.grid{border-collapse:collapse;font-size:12px;background:#fff}
.grid th,.grid td{border:1px solid var(--grid);padding:2px 6px;vertical-align:top}
.grid thead tr.hd th,.grid tr.hd th{background:var(--gold);border:1px solid var(--box);border-top-width:2px;border-bottom-width:2px;font-weight:700;text-align:center;white-space:nowrap}
.grid tr.hd th:first-child{border-left-width:2px}
.grid tr.hd th:last-child{border-right-width:2px}
.grid tr.hd th.lab{text-align:left}
.grid tbody th{text-align:left;font-weight:600}
.grid .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid td.cl{background:var(--closed)}
.grid .plan{font-style:italic;color:var(--plan)}
.grid .tot{font-weight:700}
.grid .wrap{max-width:30em;overflow-wrap:anywhere}
.grid th.lab{min-width:16em;max-width:30em;font-weight:400;white-space:normal;overflow-wrap:anywhere}
.grid tr.total th,.grid tr.total td{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}
.grid th.apg{vertical-align:middle;font-weight:700}
.dag,.ddag,.sect{margin-left:2px;font-weight:700;color:#7a5a00}
/* on a TOTAL row's navy the dark gold read 1.77:1 and could not be seen: the mark that says the total mixes in an entered,
   every-service Authorized was a smudge (review SCR2-3). The gold of the header rows is about 9.8:1 on the navy. */
.grid tr.total .dag,.grid tr.total .ddag,.grid tr.total .sect{color:var(--gold)}
/* the BAE report (CONTRACT §14): a block it has no figure for, in the Settings table */
.grid td.nofig{color:#555;font-style:italic}

/* the block tables: v12's outline styles (PMO 11 pt bold navy; Title 10 pt bold; Plan Event 10 pt; CCaR 9 pt) */
table.blk{font-size:12px}
.blk tr.pmo th.lab,.blk th.lab.lv1{font-size:14px;font-weight:700;color:var(--navy)}
.blk th.lab.lv2{font-weight:700;padding-left:22px}
.blk th.lab.lv3{padding-left:40px}
.blk th.lab.lv4{font-size:11px;padding-left:58px}
.tg{display:inline;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
main .tg{border:0;background:none;padding:0;color:inherit}
main .tg:hover{background:none;text-decoration:underline;color:inherit}
.tg .arr{display:inline-block;width:1.1em;color:var(--navy2)}
.leaf{padding-left:1.1em}
.blk tr.band th.lab{color:var(--navy);font-weight:700}
.blk tr.band td{font-weight:600}
.blk tr.band:first-of-type th,.blk tr.band:first-of-type td{border-top:2px solid var(--box)}
.blk tr.spacer td{border:0;height:8px;padding:0}
.blk tr.strip td{background:var(--strip);font-weight:700;color:#000}
/* a mark in a PMO block's strip (§14.5, review M4-5) takes the strip's black: the dark gold read about 4.3:1 on its blue */
.blk tr.strip td .dag,.blk tr.strip td .ddag,.blk tr.strip td .sect{color:inherit}
.bar{margin:14px 0 0;padding:4px 8px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.bar.bar2{background:var(--navy2)}
h3.bar{margin-top:16px}
.blkctl{display:flex;justify-content:flex-start;gap:10px;padding:4px 0}
.nabar{margin:6px 0 2px;padding:3px 8px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
h3.nabar{font-size:13px}
table.nalines{border-collapse:collapse;font-size:12px;width:100%}
.nalines th{vertical-align:top;text-align:left;white-space:nowrap;padding:2px 8px;color:var(--navy);border-bottom:1px solid #ddd}
.nalines td{padding:2px 8px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}

/* status: the word on its colour. Black on green and yellow, white on red: each clears 4.5:1 on screen. */
.st{text-align:center;font-weight:700;white-space:nowrap}
.st-green{background:var(--green);color:#000}
.st-yellow{background:var(--yellow);color:#000}
.st-red{background:var(--red);color:#fff}
/* a status fill wins over the closed-month grey: otherwise an actual "Behind" in Oct is white words on grey */
.grid td.st.st-green{background:var(--green)}
.grid td.st.st-yellow{background:var(--yellow)}
.grid td.st.st-red{background:var(--red)}
.grid td.st-green,.grid td.st-yellow,.grid td.st-red{border-color:var(--grid)}
/* a plan status keeps its fill and its readable ink, in italic: grey words on the fill could not be read */
.grid td.st.plan{font-weight:400;font-style:italic}
.grid td.st.plan.st-green,.grid td.st.plan.st-yellow{color:#000}
.grid td.st.plan.st-red{color:#fff}
table.legend{border-collapse:collapse;margin:10px 0 4px}
.legend caption{text-align:left;font-weight:700;color:var(--navy);padding-bottom:2px}
.legend td{padding:2px 8px;border:1px solid var(--grid)}
.legend td.st{width:7em}
ul.notes{margin:4px 0;padding-left:20px}
ul.notes li{margin:2px 0;overflow-wrap:anywhere}

/* slide blocks */
section.slide{margin:12px 0 18px;padding:8px;border:1px solid var(--line);border-radius:4px}
.slidebtns{display:flex;justify-content:flex-end;gap:6px}

/* settings */
input.pct{width:4.4em;text-align:right}
input.amt{width:11em;text-align:right}
.goals th[scope=row]{white-space:normal;min-width:12em;max-width:18em}
.goals td{padding:1px 2px}
.speclist{margin:4px 0;padding-left:20px}
.speclist li{margin:3px 0}
.flag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:2px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.budgets tr.unknown td{background:#fff4ce}
.budgets select{max-width:16em}

/* the import report and the rest */
.report{font-size:12px;padding:6px 8px;background:#fafbfd;border:1px solid var(--line);overflow-wrap:anywhere}
.report .rl{white-space:pre-wrap;margin:1px 0}
.refused{margin:6px 0;padding:6px 10px;background:#fde9e7;border-left:5px solid var(--red)}
.help{max-width:80em}
.help li{margin:3px 0}
.nodata{max-width:60em}
section.chg{margin-bottom:18px}

/* THE OVERVIEW (§18), on the dark shell. Its buttons and status counts restate main's own rules on dark. */
main.ov{color:var(--sink);padding:10px 8px 28px 0}
main.ov .ovhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
main.ov .grow{flex:1 1 0}
.ovtitle{margin:0;font-size:20px;font-weight:700}
.ovsub,.ovshown,.cardnote,.ovlab{color:var(--smut)}
.ovshown{margin:4px 0 0;font-size:12px}
main.ov button{border:1px solid var(--sedge);border-radius:6px;background:#0e2140;color:var(--sink)}
main.ov button:hover{background:var(--gold);color:#000}
.seg{display:inline-flex;gap:4px}
main.ov .seg button{min-height:28px;padding:3px 14px}
main.ov .seg button[aria-pressed=true]{background:#17376a;border-color:var(--steal);color:#fff;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}
.tile,.card,.ovstatus{background:linear-gradient(180deg,var(--spanel2),var(--spanel));border:1px solid var(--sline);border-radius:10px;padding:12px 14px}
.tile{display:flex;flex-direction:column;min-width:0}
.tl{color:var(--smut);font-size:12px}
.tv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ts{color:#c3d3ea;font-size:12px;min-height:1.35em}
main.ov .dag,main.ov .ddag,main.ov .sect{color:var(--gold);font-size:15px}
.ovstatus{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ovstatus .tl{font-size:13px;color:var(--sink);font-weight:700}
.stc{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px}
.stn{border:1px solid var(--sedge);color:var(--sink)}
.ovstatus button{margin-left:auto}
.ovnotes .note{color:var(--smut);margin:6px 0 0}
.ovtwo{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.card h3{margin:0 0 4px;font-size:14px}
.cardnote{margin:0 0 8px;font-size:12px}
/* the charts lined up: a row for each appropriation, a column for each fiscal year (§18.3). With three years or more the
   charts take the page's whole width and Approved by appropriation goes beneath; a window too narrow for the columns
   scrolls the charts sideways inside their card, never the page. */
.ovtwo.ovwide{grid-template-columns:minmax(0,1fr)}
.ovscroll{overflow-x:auto}
.ovcharts{display:grid;grid-template-columns:repeat(var(--n,1),minmax(190px,1fr));gap:8px 10px;align-items:start}
.ovcharts[data-cols="1"]{grid-template-columns:minmax(0,560px)}
.ovfyh{font-weight:700;font-size:13px;text-align:center;color:var(--sink);padding:2px 0;border-bottom:1px solid var(--sline)}
.ovaph{grid-column:1/-1;margin:6px 0 0;font-size:13px;font-weight:700;color:#9fd0ff}
.ovc{margin:0;padding:8px;border:1px solid var(--sline);border-radius:8px;background:#081426;min-width:0}
.ovc figcaption{display:flex;align-items:center;gap:8px;margin-bottom:2px}
main.ov .ovopen{border:0;background:none;padding:2px 0;font-weight:700;color:#9fd0ff;text-decoration:underline}
main.ov .ovopen:hover{background:none;color:#fff}
.ovpct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.ovsvg{display:block;width:100%;height:auto}
.ovsvg .gl{stroke:var(--sline);stroke-width:1}
.ovsvg .ax{fill:var(--smut);font-size:9px}
.ovsvg .ba{fill:var(--steal)}
.ovsvg .bp{fill:rgba(63,155,255,.32);stroke:var(--sblue);stroke-width:1;stroke-dasharray:3 2}
.ovsvg .gline{fill:none;stroke:#fff;stroke-width:1.5}
.ovsvg .gdot{fill:#fff}
.ovsvg .ovnone{fill:var(--sink);font-size:11px}
.ovlab{margin:2px 0 0;font-size:11px;overflow-wrap:anywhere}
.ovleg{margin:8px 0 0;font-size:12px;color:var(--smut)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 5px 0 12px;vertical-align:-1px}
.ovleg .k:first-child,.ovaps .k{margin-left:0}
.ka{background:var(--steal)}
.kp{background:rgba(63,155,255,.32);border:1px dashed var(--sblue)}
.kg{background:#fff;height:2px;vertical-align:3px}
.ovap{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.donut{width:120px;height:120px;flex:none}
.ovaps{border-collapse:collapse;font-size:13px;flex:1 1 150px}
.ovaps th{text-align:left;font-weight:400;padding:4px 8px 4px 0}
.ovaps td{text-align:right;padding:4px 0 4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ovaps tr+tr th,.ovaps tr+tr td{border-top:1px solid var(--sline)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ovtwo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}
/* THE FRAME IN A NARROWER WINDOW (§18.2). Up to 1400 px the menu is 118px and the sheet's margins are tighter, so a tree
   opened to CCaR keeps its full width beside the menu at 1366 px, a 15 px scrollbar included (review UX-1). */
@media (max-width:1400px){
  nav.views{flex-basis:118px;padding:10px 4px}
  nav.views button{padding:6px 7px}

// ===== 10-util.js =====

SP.CAL_MONTHS = ut_freeze(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']);

// §15, §17 FY2025 O&M OBBBA FUNDING IS LEFT OUT (Brad, 11 Nov 2026: "Just leave FY25 OBBBA funding out. Although it's
// active technically, it's not a reporting year.", then, shown that the BAE report marks most of it in its Budget Flex 02
// column: "Yes, leave out OBBBA funding for O&M but leave it in for Spares."). A row is FY2025 O&M OBBBA funding when its
// appropriation is O&M, its FY is 2025 exactly and it is MARKED: the WORD OBBBA, in any case, in its budget name (a pull
// row's Budget, a BAE report row's Budget Name), or `mark` holds: a report row's Budget Flex 02 text holds the word, or,
// for a pull row (which has no such column), the loaded report marks its budget so (SP.baeObbbaKeys). A fixed rule, not a
// setting. THE ONE PREDICATE: every reader asks it, and no other line spells the rule, so the pull, the report, the
// workbook and the screens cannot come to disagree about which rows it takes. An OBBBA budget of any other FY is an
// ordinary row, so is one of any other appropriation (Initial Spares by Brad's answer; Full Fund and OPN by the lead's

SP.OBBBA_FY = 2025;
const UT_OBBBA = /\bOBBBA\b/i;
// whether a text holds the word: a budget name, or a Budget Flex 02 cell (the mark §17.1 reads, and no other column)
SP.obbbaWord = function obbbaWord(text) {
  return UT_OBBBA.test(String(text ?? ''));
};

// loaded report marks its budget (true or false); absent, the name alone decides
function ut_obbbaMarked(name, mark) {

}
SP.isObbba25 = function isObbba25(name, fy, ap, mark) {
  return fy === SP.OBBBA_FY && ap === 'om' && ut_obbbaMarked(name, mark);
};
// §17.2 OBBBA money that COUNTS, said so in the Import report (model.obbbaElsewhere, information only): FY2025, marked as the
// predicate reads a mark, of an identified appropriation other than O&M. The same words as the rule, so the two lists can
// never overlap or leave a marked FY2025 row of an identified appropriation in neither.
SP.isObbbaElsewhere = function isObbbaElsewhere(name, fy, ap, mark) {
  return fy === SP.OBBBA_FY && typeof ap === 'string' && ap !== '' && ap !== 'om' && ut_obbbaMarked(name, mark);
};
// §17.1 A BAE REPORT ROW'S BUDGET FLEX 02 CELL. The column is found by its header, as §14.1 finds the four it reads (its
// normKey, a trailing unit in parentheses taken off: SP.baeHeaderKey): the first of the stored report's headers that is
// 'budget flex 02'; where two columns are headed so, the import keeps the second as "Budget Flex 02 (2)", after the first.
// null when the report has headers and none is that column; undefined when it records no headers at all (a report saved by
// hand or another version), and each row is then read by its own columns, which are the report's headers in the file's

const UT_FLEX02 = 'budget flex 02';
function ut_flexKey(h) { return typeof SP.baeHeaderKey === 'function' ? SP.baeHeaderKey(h) : SP.normKey(h); }

  for (const h of bae.headers) if (ut_flexKey(h) === UT_FLEX02) return String(h);
  return null;
};

// among the row's own columns)
SP.baeFlex02 = function baeFlex02(row, col) {
  const x = row && row.x && typeof row.x === 'object' ? row.x : null;
  if (!x) return '';
  if (col === undefined) col = Object.keys(x).find(k => ut_flexKey(k) === UT_FLEX02);

// its rows whose FY is 2025, whose name places it in O&M (SP.apOfBudget, as §14.2 places a report row) and whose Budget Flex
// 02 holds the word, read or not. A pull row of such a budget is marked by it (the predicate's `mark`), so the plan and the
// report leave out the same money. An empty set with no report, so a pull with none is judged by its own names alone.
SP.baeObbbaKeys = function baeObbbaKeys(bae) {

  if (!rows.length) return out;
  const col = SP.baeFlex02Col(bae);
  if (col === null) return out;
  for (const row of rows) {
    const c = row && Array.isArray(row.c) ? row.c : null;
    if (!c) continue;
    const name = String(c[0] ?? '').trim();
    if (name === '') continue;
    // the name is left out of the question: the mark alone, as the pull row's own name is asked by the predicate itself
    if (SP.isObbba25('', c[1], SP.apOfBudget(name), SP.baeFlex02(row, col))) out.add(SP.normKey(name));

// ---------------------------------------------------------------------------------------------------------------
// TEXT
// ---------------------------------------------------------------------------------------------------------------
// The single quote matters as much as the double: a value drawn into a single-quoted attribute would otherwise end it.
SP.esc = function esc(s) {

};

// "Air Vehicle\u00a0(AV)" and "Air Vehicle (AV)" are one node, not two that each look complete.
SP.normKey = function normKey(s) {
  return String(s ?? '').replace(/\s+/g, ' ').trim().toLowerCase();

// 1875 -> '1,875' (counts in messages and the import report)
SP.fmtInt = function fmtInt(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '';

};
function ut_commas(digits) { return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

// ---------------------------------------------------------------------------------------------------------------
// MONEY. Every figure inside the tool is whole cents. Amounts are read from their DECIMAL TEXT, never by multiplying a
// float by 100: 1234.56 * 100 is 123455.99999999999, and rounding that is only right by luck; a half cent read through
// a float rounds whichever way the binary happens to fall.
// ---------------------------------------------------------------------------------------------------------------
// digits before and after the point (strings, no sign) -> {cents, rounded} or null when it cannot be held exactly
function ut_decToCents(intDigits, fracDigits) {
  const i = intDigits.replace(/^0+(?=\d)/, '') || '0';
  const f = (fracDigits || '');

  const rest = f.slice(2);

  if (rounded && rest.charCodeAt(0) >= 53) cents += 1;   // '5'..'9'

// a finite number -> its 15-significant-digit decimal text (what Excel shows), expanded out of exponent form

  if (ex > 0) { fp = fp + '0'.repeat(Math.max(0, ex - fp.length)); ip = ip + fp.slice(0, ex); fp = fp.slice(ex); }
  else if (ex < 0) { ip = '0'.repeat(Math.max(0, -ex - ip.length + 1)) + ip; const k = ip.length + ex; fp = ip.slice(k) + fp; ip = ip.slice(0, k); }
  return { ip, fp };
}

SP.parseAmount = function parseAmount(v) {

  let t = v.trim();

SP.deriveRow = function deriveRow(row, settings) {
  const c = row.c;
  const st = SP.allocStatus(c[IMP_ALLOC]);
  const ov = imp_override(settings, c[IMP_BUDGET]);
  return {
    ap: SP.apOfRow(row, row.src ? row.src[1] : ''),
    fy: c[IMP_FY], ccar: c[IMP_CCAR], title: c[IMP_TITLE], budget: c[IMP_BUDGET], pe: c[IMP_PE],
    date: c[IMP_DATE] || '', month: c[IMP_MONTH] || '', cents: c[IMP_AMT], alloc: c[IMP_ALLOC], pmo: c[IMP_PMO],
    status: st.status, statusLabel: st.label,
    svc: ov && ov.svc ? ov.svc : SP.svcRule(c[IMP_BUDGET]),
    lane: ov && ov.lane ? ov.lane : SP.laneRule(c[IMP_BUDGET]),
    k: { pmo: SP.normKey(c[IMP_PMO]), title: SP.normKey(c[IMP_TITLE]), pe: SP.normKey(c[IMP_PE]), ccar: SP.normKey(c[IMP_CCAR]) },
    bad: row.bad && row.bad.length ? row.bad : null,
    src: row.src,
  };
};

// Every distinct budget name (by normKey) in the pulls: its rows, its dollars (readable rows), the service and lane the
// rules give, any override, and what applies. Sorted by name. A name whose service is unknown is flagged.
SP.budgetTable = function budgetTable(pulls, settings) {
  const by = new Map();
  const order = IMP_AP_IDS.concat(['unidentified']);
  for (const ap of order) {
    const p = pulls && pulls[ap];
    if (!p || !Array.isArray(p.rows)) continue;
    for (const row of p.rows) {
      const name = row.c[IMP_BUDGET] ?? '';
      const key = SP.normKey(name);
      let e = by.get(key);
      if (!e) { e = { key, spell: new Map(), rows: 0, cents: 0, aps: [] }; by.set(key, e); }
      e.rows++;
      e.spell.set(name, (e.spell.get(name) || 0) + 1);
      if (!(row.bad && row.bad.length) && typeof row.c[IMP_AMT] === 'number') e.cents += row.c[IMP_AMT];
      if (!e.aps.includes(ap)) e.aps.push(ap);
    }
  }
  const out = [];
  for (const e of by.values()) {
    let name = '', best = -1;
    for (const [s, n] of e.spell) if (n > best) { best = n; name = s; }   // most rows; ties to the first met
    const svcR = SP.svcRule(name), laneR = SP.laneRule(name), ov = imp_override(settings, name);
    const svc = ov && ov.svc ? ov.svc : svcR;
    out.push({ key: e.key, name, names: [...e.spell.keys()], rows: e.rows, cents: e.cents, aps: e.aps,
      svcRule: svcR, laneRule: laneR, override: ov, svc, lane: ov && ov.lane ? ov.lane : laneR, unknown: svc === SP.SVC_UNKNOWN });
  }
  out.sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
  return out;
};

// ---------------------------------------------------------------------------------------------------------------
// READING A SHEET
// ---------------------------------------------------------------------------------------------------------------
// the header row: the first row numbered 1–15 holding every required header (by normKey); or, when none does, the row
// that comes closest, so the report can say which header a renamed column lost
function imp_findHeader(rows, rowNo) {
  let best = null;
  for (let i = 0; i < rows.length && rowNo[i] <= IMP_HDR_ROWS; i++) {
    const have = new Set((rows[i] || []).map(v => SP.normKey(imp_text(v))));
    const missing = SP.REQUIRED.filter(h => !have.has(SP.normKey(h)));
    if (!missing.length) return { i };
    if (!best || missing.length < best.missing.length) best = { rowNo: rowNo[i], missing };
  }
  return { i: -1, best };
}
// A CSV SEPARATED BY SOMETHING OTHER THAN COMMAS. Read as comma-separated, its whole header row is one cell, so the file
// was refused for lacking the column headers it has, and the closest-row hint (four headers or fewer missing) never came
// (review F2). The row's cells are joined back with the commas the reader split them at and tried against each separator.
// Such a file is refused, never read: a file separated by semicolons may write 1.234,56 for 1,234.56, and a separator
// guessed wrong would put money in the wrong cell. {rowNo, sep} or null.
const IMP_SEPS = [['\t', 'tabs'], [';', 'semicolons'], ['|', 'vertical bars']];
function imp_sepHeader(rows, rowNo) {
  const unq = s => SP.normKey(s.replace(/^\s*"([\s\S]*)"\s*$/, '$1'));
  for (let i = 0; i < rows.length && rowNo[i] <= IMP_HDR_ROWS; i++) {
    const line = (rows[i] || []).map(imp_text).join(',');
    for (const [sep, words] of IMP_SEPS) {
      if (line.indexOf(sep) < 0) continue;
      const have = new Set(line.split(sep).map(unq));
      const haveB = new Set(line.split(sep).map(x => imp_baeKey(x.replace(/^\s*"([\s\S]*)"\s*$/, '$1'))));
      if (SP.REQUIRED.every(h => have.has(SP.normKey(h)))) return { rowNo: rowNo[i], sep: words };
      // a BAE report's CSV separated so is the same mistake, and gets the same advice
      if (IMP_BAE_COLS.every(h => h.keys.some(k => haveB.has(k)))) return { rowNo: rowNo[i], sep: words };
    }
  }
  return null;
}

// One sheet -> {info, rows:[stored rows with their appropriation]}. acc collects the report's counts across the import.
function imp_sheet(fileIdx, fileName, kind, sh, date1904, acc) {
  const info = { name: sh.name, state: sh.state || 'visible', used: false, why: null, headerRow: null, rows: 0, blank: 0,
    byAp: {}, extras: [], ignoredCols: [], ownCols: [], missingCols: [], disagree: null, extraOnly: [],
    noResult: Array.isArray(sh.noResult) ? sh.noResult.slice() : [] };
  const out = [];
  if (sh.problem) { info.why = sh.problem; return { info, out }; }
  const rows = sh.rows, rowNo = sh.rowNo;
  const hdr = imp_findHeader(rows, rowNo);
  if (hdr.i < 0) {
    const sep = kind === 'csv' ? imp_sepHeader(rows, rowNo) : null;
    if (sep) {
      info.sep = sep.sep;
      info.why = 'its column headers are on row ' + sep.rowNo + ', but separated by ' + sep.sep + ', not commas. This tool reads CSV '
        + 'separated by commas only, and never guesses a separator (one separated by semicolons may write 1.234,56 for 1,234.56). '
        + 'Save it from Excel as “CSV (Comma delimited)” or as an Excel Workbook (.xlsx), and import that';
      return { info, out };
    }
    info.why = 'no row in the first ' + IMP_HDR_ROWS + ' holds all ' + SP.REQUIRED.length + ' required column headers ('
      + SP.REQUIRED.join(', ') + ')';
    if (hdr.best && hdr.best.missing.length <= 4)
      info.why += '; row ' + hdr.best.rowNo + ' comes closest but has no ' + hdr.best.missing.map(imp_q).join(' or ');
    return { info, out };
  }
  info.headerRow = rowNo[hdr.i];
  // columns BY HEADER NAME, never by position
  const head = rows[hdr.i];
  const col = new Array(IMP_N).fill(-1), named = new Set(), dup = [], extras = [], seenExtra = new Map();
  const ignored = new Set();   // columns read as nothing: v12's formula columns, this tool's own derived ones
  // THE TOOL'S OWN FOUR are the LAST column of each of those names, when all four are there in the order the export writes
  // them, after every extra (CONTRACT §8.7). The FIRST of each name was taken: a pull's own column named Status sits before
  // the tool's, so it was ignored as the tool's, and the tool's derived words came back under its name (review F7, XP2-2).
  const lastAt = new Map();
  head.forEach((h, j) => { const nk = SP.normKey(imp_text(h)); if (IMP_OWN_COLS.includes(nk)) lastAt.set(nk, j); });
  const ownJ = IMP_OWN_COLS.map(k => lastAt.get(k));
  const ownExport = ownJ.every((j, i) => j !== undefined && (i === 0 || j > ownJ[i - 1]));
  const ownCols = new Set(ownExport ? ownJ : []);
  head.forEach((h, j) => {
    const text = imp_text(h);
    if (text === '') return;
    const nk = SP.normKey(text);
    if (IMP_COL.has(nk)) {
      const k = IMP_COL.get(nk);
      if (col[k] >= 0) dup.push({ name: SP.RAW_HEADERS[k], a: col[k], b: j });
      else { col[k] = j; named.add(j); }
    } else if (IMP_FORMULA_COLS.has(nk)) { info.ignoredCols.push(text); named.add(j); ignored.add(j); }
    else if (ownCols.has(j)) { info.ownCols.push(text); named.add(j); ignored.add(j); }
    else {
      // two columns with one unknown header keep both, the second as "Name (2)", so neither overwrites the other
      const n = (seenExtra.get(nk) || 0) + 1;
      seenExtra.set(nk, n);
      extras.push({ name: n === 1 ? text : text + ' (' + n + ')', j });
      named.add(j);
    }
  });
  if (dup.length) {
    // which of two Amount columns is the real one is not something to guess with money
    info.why = dup.map(d => 'two columns are headed ' + imp_q(d.name) + ' (' + SP.colLetter(d.a) + ' and ' + SP.colLetter(d.b) + ')')
      .join('; ') + ', so the tool cannot tell which to read';
    return { info, out };
  }
  info.missingCols = SP.RAW_HEADERS.filter((h, k) => col[k] < 0);
  const isBlankRow = r => { for (let k = 0; k < IMP_N; k++) if (col[k] >= 0 && !imp_isBlank(r[col[k]])) return false; return true; };
  // A row with nothing in the 32 CCaR columns is skipped (CONTRACT §3), but one with something in another column is not
  // blank: it was counted as a blank row and its text was found nowhere (review IMP-13). It is still skipped, and it is
  // listed by row with what it held.
  const known = new Set(col.filter(j => j >= 0));
  const extraName = new Map();
  // A value in a column with no header is still data: it is kept as an extra column named by its letter, never dropped.
  const unnamed = new Set();
  for (let i = hdr.i + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isBlankRow(r)) continue;
    for (let j = 0; j < r.length; j++) if (!named.has(j) && !unnamed.has(j) && !imp_isBlank(r[j])) unnamed.add(j);
  }
  for (const j of unnamed) extras.push({ name: 'Column ' + SP.colLetter(j), j });
  extras.sort((a, b) => a.j - b.j);
  info.extras = extras.map(e => e.name);
  for (const e of extras) extraName.set(e.j, e.name);
  const othersOf = r => {
    const o = [];
    for (let j = 0; j < r.length; j++) {
      if (known.has(j) || ignored.has(j) || imp_isBlank(r[j])) continue;
      o.push([extraName.get(j) || 'Column ' + SP.colLetter(j), imp_raw(r[j])]);
    }
    return o;
  };
  const sheetAp = imp_apOfSheet(sh.name);
  const csv = kind === 'csv';
  let disN = 0, disC = 0;
  const disBy = {};
  for (let i = hdr.i + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isBlankRow(r)) {
      const o = othersOf(r);
      if (o.length) { info.extraOnly.push({ row: rowNo[i], values: o }); acc.extraOnly.push({ file: fileName, sheet: sh.name, row: rowNo[i], values: o }); }
      else info.blank++;
      continue;
    }
    const rn = rowNo[i];
    const c = new Array(IMP_N);
    const bad = [], raw = {};
    for (let k = 0; k < IMP_N; k++) {
      const j = col[k];
      const v = j >= 0 && r[j] !== undefined ? r[j] : '';
      if (typeof v === 'string' && v !== v.trim()) { acc.conv.trimmed++; acc.trimmedBy[SP.RAW_HEADERS[k]] = (acc.trimmedBy[SP.RAW_HEADERS[k]] || 0) + 1; }
      if (k === IMP_FY) {
        const y = SP.readFY(v);
        if (y === null) { bad.push(imp_isBlank(v) ? 'FY is blank' : 'FY ' + imp_q(imp_raw(v)) + ' is not a year'); raw.FY = imp_raw(v); }
        c[k] = y;
      } else if (k === IMP_MONTH || k === IMP_DATE) {
        const d = SP.readDate(v, date1904);
        if (d === null) {
          raw[SP.RAW_HEADERS[k]] = imp_raw(v);
          acc.dateBad.push({ file: fileName, sheet: sh.name, row: rn, column: SP.RAW_HEADERS[k], raw: imp_raw(v) });
        }
        c[k] = d || '';
      } else if (k === IMP_AMT) {
        const a = SP.parseAmount(v);
        if (a.cents === null) { bad.push('Amount ' + imp_q(imp_raw(v)) + ' is not an amount'); raw.Amount = imp_raw(v); c[k] = null; }
        else {
          // a CSV has no number type: a plain number in one is how a CSV writes a number, not a conversion
          const how = csv && a.how === 'text' && /^\s*-?\d+(\.\d+)?\s*$/.test(v) ? 'number' : a.how;
          acc.conv[how] = (acc.conv[how] || 0) + 1;
          if (how === 'subcent') acc.subcent.push({ file: fileName, sheet: sh.name, row: rn, raw: imp_raw(v), cents: a.cents });
          c[k] = a.cents;
        }
      } else c[k] = imp_text(v);
    }
    const x = Object.create(null);   // keyed by headers out of the file: a column headed __proto__ is a column
    for (const e of extras) {
      const v = r[e.j];
      if (imp_isBlank(v)) continue;
      x[e.name] = imp_text(v);
      if (typeof v === 'string' && v !== v.trim()) { acc.conv.trimmed++; acc.trimmedBy[e.name] = (acc.trimmedBy[e.name] || 0) + 1; }
    }
    const stored = { c, x, src: [fileIdx, sh.name, rn] };
    if (bad.length) stored.bad = bad;
    if (Object.keys(raw).length) stored.raw = raw;
    const byBudget = imp_apOfBudget(c[IMP_BUDGET]);
    const ap = byBudget || sheetAp || 'unidentified';
    if (byBudget && sheetAp && byBudget !== sheetAp) {
      disN++;
      if (!bad.length) disC += c[IMP_AMT];
      disBy[byBudget] = (disBy[byBudget] || 0) + 1;
    }
    if (bad.length) acc.unreadable.push({ file: fileName, sheet: sh.name, row: rn, ap, reasons: bad.slice(), raw,
      cents: typeof c[IMP_AMT] === 'number' ? c[IMP_AMT] : null });
    const at = acc.alloc.get(c[IMP_ALLOC]) || { text: c[IMP_ALLOC], rows: 0, cents: 0 };
    at.rows++;
    if (!bad.length) at.cents += c[IMP_AMT];
    acc.alloc.set(c[IMP_ALLOC], at);
    info.byAp[ap] = (info.byAp[ap] || 0) + 1;
    info.rows++;
    out.push({ ap, row: stored });
  }
  if (disN) info.disagree = { rows: disN, cents: disC, sheetAp, byBudget: disBy };
  if (!info.rows) { info.why = 'it has the column headers (row ' + info.headerRow + ') but no data rows below them'; return { info, out: [] }; }
  info.used = true;
  return { info, out };
}

// ---------------------------------------------------------------------------------------------------------------
// THE BAE REPORT OF BUDGETS (CONTRACT §14.1): each budget's Approved and Authorized amount by FY, beside the pull. It is
// read here and kept whole; what a row means (its appropriation, scope, service, lane, PMO) is worked out again on every
// load by the engine (§14.2), so a rule fix reaches an old report as it reaches an old pull.
// ---------------------------------------------------------------------------------------------------------------
// The four columns the tool reads, in the order a stored row's c holds them. The FY may be headed either way; where a
// sheet has both, Budget FY Numeric is read (it is the number) and Budget FY is kept as written, like any other column.
const IMP_BAE_COLS = [
  { keys: ['budget name'], label: 'Budget Name' },
  { keys: ['budget fy numeric', 'budget fy'], label: 'Budget FY Numeric (or Budget FY)' },
  { keys: ['budget approved amount'], label: 'Budget Approved Amount' },
  { keys: ['budget authorized amount'], label: 'Budget Authorized Amount' } ];
const IMP_BAE_NAME = 0, IMP_BAE_FY = 1, IMP_BAE_APP = 2, IMP_BAE_AUTH = 3;
// The five columns this tool's own BAE Report sheet appends (CONTRACT §14.6, 60-export.js EX_BAE_TAIL): what it made of each
// row, worked out again on every load. Kept as the report's own columns they came back on the next export beside the fresh
// five, one copy frozen at the switches of the export it came from, so a row read Counted "Yes" in one column and "Switch
// off" in the next, and grew by five every round; the Import report said every one was kept (review I4-1). As for a raw
// data sheet's four (IMP_OWN_COLS), only all five together are the tool's: one alone may be a real column of a report.
const IMP_BAE_OWN = ['appropriation', 'service', 'lane', 'pmo', 'counted'];
// what a file refused for holding no usable sheet is told it might have held instead
const IMP_BAE_NONE = ', nor a BAE report of budgets (Budget Name, Budget FY Numeric, Budget Approved Amount, Budget Authorized Amount)';
// $100,000 in cents. Every non-zero amount under it means the figures were exported in $M (the report's own display),
// and read as the dollars they then claim to be, every block would be understated a millionfold.
const IMP_BAE_SMALL = 10000000;
// A header as the report's are compared: a trailing unit in parentheses taken off, then normKey. The report heads its
// amounts "Budget Approved Amount ($M)" though the cells hold dollars (the $M is the number format's), so the unit says
// nothing about the value and is not part of the name.
function imp_baeKey(v) { return SP.normKey(imp_text(v).replace(/\s*\([^()]*\)$/, '')); }
// the same comparison for every header of a stored report: §17.1 finds its Budget Flex 02 column (SP.baeFlex02Col) as §14.1
// finds the four it reads
SP.baeHeaderKey = imp_baeKey;
// the header row: the first row numbered 1–15 holding all four; or the row closest to it (two or more of the four), so a
// sheet that is nearly a report says which header it lacks
function imp_baeHeader(rows, rowNo) {
  let best = null;
  for (let i = 0; i < rows.length && rowNo[i] <= IMP_HDR_ROWS; i++) {
    const have = new Set((rows[i] || []).map(imp_baeKey));
    const missing = IMP_BAE_COLS.filter(h => !h.keys.some(k => have.has(k))).map(h => h.label);
    if (!missing.length) return { i };
    if (missing.length <= 2 && (!best || missing.length < best.missing.length)) best = { rowNo: rowNo[i], missing };
  }
  return { i: -1, best };
}
// A report's amount -> {cents, how}. A number cell holds dollars (the report SHOWS them as $M through its number format),
// read to the cent as CONTRACT §14.1 says, Math.round(v*100); a fraction of a cent is rounded and reported. Text is a
// figure whose unit cannot be known, since the $M display is the only text the report would carry, so it is read only
// when it is zero ("$0.000", the report's own zero, counted as a conversion); any other text makes the row unreadable.
// A CSV has no number type: there a plain number is how the file writes a number, as for a pull (§3), not text.
//   how: 'number' | 'subcent' | 'zero' (text read as zero) | 'blank' | 'text' (not zero: unreadable) | 'bad'
function imp_baeAmt(v, csv) {
  if (imp_isBlank(v)) return { cents: 0, how: 'blank' };
  let n = null;
  if (typeof v === 'number') n = v;
  else if (typeof v === 'string' && csv && /^\s*-?\d+(\.\d+)?\s*$/.test(v)) n = Number(v);
  if (n !== null) {
    if (!isFinite(n)) return { cents: null, how: 'bad' };
    const c = Math.round(n * 100);
    if (!Number.isSafeInteger(c)) return { cents: null, how: 'bad' };
    // a fraction of a cent, judged on the 15 significant digits Excel shows (n*100 itself carries binary noise)
    return { cents: c === 0 ? 0 : c, how: SP.parseAmount(n).how === 'subcent' ? 'subcent' : 'number' };
  }
  if (typeof v !== 'string') return { cents: null, how: 'bad' };
  const a = SP.parseAmount(v);
  if (a.cents === 0) return { cents: 0, how: 'zero' };
  return { cents: null, how: a.cents === null ? 'bad' : 'text' };
}
// the report's date from its file name: "…_2026-01-31_120000.xlsx" -> '2026-01-31 12:00', else null
SP.baeStampOf = function baeStampOf(fileName) {
  const base = String(fileName ?? '').replace(/^.*[\\/]/, '').replace(/\.[^.]*$/, '');
  const m = /_(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})(\d{2})$/.exec(base);
  if (!m || !SP.isoDate(m[1], m[2], m[3]) || Number(m[4]) > 23 || Number(m[5]) > 59 || Number(m[6]) > 59) return null;
  return m[1] + '-' + m[2] + '-' + m[3] + ' ' + m[4] + ':' + m[5];
};

// The four columns a stored report was read from, by the names its headers give them: its own `cols` when it holds four;
// else each found among its headers as §14.1 finds it (imp_baeKey, Budget FY Numeric before Budget FY); else §14.1's name for
// it. A report this tool reads always records `cols`, but §14.1's shape of a stored report does not require it, so one saved
// by hand or by another version opened without it, and the BAE Report sheet then wrote every row's Budget Name, FY,
// Approved and Authorized blank beside "Counted: Yes" (review I4-7): what the products read must be found the way the
// import found it.
SP.baeCols = function baeCols(bae) {
  const b = bae && typeof bae === 'object' ? bae : {};
  if (Array.isArray(b.cols) && b.cols.length === 4 && b.cols.every(h => typeof h === 'string')) return b.cols.slice();
  const heads = Array.isArray(b.headers) ? b.headers.map(h => String(h ?? '')) : [];
  const keyed = heads.map(imp_baeKey);
  const dflt = ['Budget Name', 'Budget FY Numeric', 'Budget Approved Amount', 'Budget Authorized Amount'];
  return IMP_BAE_COLS.map((d, n) => {
    for (const k of d.keys) { const j = keyed.indexOf(k); if (j >= 0) return heads[j]; }
    return dflt[n];
  });
};

// One report sheet -> {info, bae, part}: info for the file's sheet list, bae the stored report (CONTRACT §14.1), part the
// import report's BAE section. hi is the header row's index (imp_baeHeader). info.why is set when the sheet cannot be read
// as a report at all; the import is then refused, naming it (a report the person meant to bring is never left out quietly).
function imp_baeSheet(fileIdx, fileName, kind, sh, hi) {
  const rows = sh.rows, rowNo = sh.rowNo, csv = kind === 'csv';
  const info = { name: sh.name, state: sh.state || 'visible', used: false, bae: true, why: null, headerRow: rowNo[hi], rows: 0, blank: 0,
    byAp: {}, extras: [], ignoredCols: [], ownCols: [], missingCols: [], disagree: null, extraOnly: [],
    noResult: Array.isArray(sh.noResult) ? sh.noResult.slice() : [] };
  const head = rows[hi] || [];
  // THE TOOL'S OWN FIVE are the LAST column of each of those names, when all five are there in the order the export
  // writes them (IMP_BAE_OWN), as §3 reads a raw data sheet's four: read as nothing, and noted
  const lastAt = new Map();
  head.forEach((h, j) => { const nk = SP.normKey(imp_text(h)); if (IMP_BAE_OWN.includes(nk)) lastAt.set(nk, j); });
  const ownJ = IMP_BAE_OWN.map(k => lastAt.get(k));
  const own = new Set(ownJ.every((j, i) => j !== undefined && (i === 0 || j > ownJ[i - 1])) ? ownJ : []);
  info.ownCols = ownJ.filter(j => own.has(j)).map(j => imp_text(head[j]));
  // COLUMNS BY HEADER NAME. Two columns that both answer to one of the four (an Approved in dollars beside one in $M, say)
  // cannot be told apart, and which one holds the money is not something to guess.
  const at = new Map();   // header key -> the columns headed so
  head.forEach((h, j) => { const k = imp_baeKey(h); if (k && !own.has(j)) { if (!at.has(k)) at.set(k, []); at.get(k).push(j); } });
  const col = [-1, -1, -1, -1], dup = [];
  IMP_BAE_COLS.forEach((d, n) => {
    // the first of its keys the sheet has: Budget FY Numeric before Budget FY, which is then kept as a column like any other
    const k = d.keys.find(x => at.has(x));
    const js = at.get(k);
    if (js.length > 1) dup.push({ label: n === IMP_BAE_FY ? (k === 'budget fy' ? 'Budget FY' : 'Budget FY Numeric') : d.label, a: js[0], b: js[1] });
    col[n] = js[0];
  });
  const fyBoth = at.has('budget fy numeric') && at.has('budget fy');
  if (dup.length) {
    info.why = dup.map(d => {
      const ta = imp_text(head[d.a]), tb = imp_text(head[d.b]), la = SP.colLetter(d.a), lb = SP.colLetter(d.b);
      return ta === tb ? 'two columns are headed ' + imp_q(ta) + ' (' + la + ' and ' + lb + ')'
        : 'two columns, ' + imp_q(ta) + ' (' + la + ') and ' + imp_q(tb) + ' (' + lb + '), are both the ' + d.label;
    }).join('; ') + ', so the tool cannot tell which to read';
    return { info, bae: null, part: null };
  }
  const isFour = r => col.every(j => imp_isBlank(r[j]));
  // EVERY COLUMN IS KEPT, in the file's order, under the file's own header (CONTRACT §14.1): the BAE Report sheet writes
  // them back. A column with no header that holds something is kept by its letter, and a second column of one header
  // name as "Name (2)", as the pull keeps its extras, so no value overwrites another.
  let width = head.length;
  for (let i = hi + 1; i < rows.length; i++) width = Math.max(width, (rows[i] || []).length);
  const used = new Set();
  for (let i = hi + 1; i < rows.length; i++) { const r = rows[i] || []; for (let j = 0; j < r.length; j++) if (!own.has(j) && !imp_isBlank(r[j])) used.add(j); }
  const headers = [], nameAt = new Map(), seen = new Map();
  for (let j = 0; j < width; j++) {
    if (own.has(j)) continue;
    let text = imp_text(head[j]);
    if (text === '' && !used.has(j)) continue;
    if (text === '') text = 'Column ' + SP.colLetter(j);
    const nk = SP.normKey(text), n = (seen.get(nk) || 0) + 1;
    seen.set(nk, n);
    const name = n === 1 ? text : text + ' (' + n + ')';
    headers.push(name);
    nameAt.set(j, name);
  }
  const cols = col.map(j => nameAt.get(j));
  const four = new Set(col);
  // §17.1 its Budget Flex 02 column, by the headers kept, as every reader of the stored report finds it (SP.baeFlex02Col)
  const flexCol = SP.baeFlex02Col({ headers });
  const extrasOf = r => {
    const x = Object.create(null);   // keyed by headers out of the file: a column headed __proto__ is a column
    for (let j = 0; j < r.length; j++) if (!four.has(j) && nameAt.has(j) && !imp_isBlank(r[j])) x[nameAt.get(j)] = imp_text(r[j]);
    return x;
  };
  const part = { file: fileName, sheet: sh.name, state: info.state, headerRow: info.headerRow, columns: headers.length, cols: cols.slice(),
    ownCols: info.ownCols.slice(),
    fyBoth, stamp: SP.baeStampOf(fileName), rowsRead: 0, readable: 0, blank: 0, cents: { approved: 0, authorized: 0 },
    conversions: { zero: 0, blank: 0, subcent: 0, trimmed: 0 }, subcent: [], unreadable: [], extraOnly: [], total: null,
    largest: 0, nonZero: 0 };
  const out = [];
  let total = null;
  // THE REPORT'S OWN TOTAL ROW: no Budget Name, no FY, amounts, after the last budget row. It is a sum of the rows and is
  // never counted; it is checked against them below.
  let lastNamed = -1;
  for (let i = hi + 1; i < rows.length; i++) if (!imp_isBlank((rows[i] || [])[col[IMP_BAE_NAME]])) lastNamed = i;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || [], rn = rowNo[i];
    if (isFour(r)) {
      // blank in all four is skipped and counted; one holding something elsewhere is skipped too, and listed with what it held
      const o = [];
      for (let j = 0; j < r.length; j++) if (!four.has(j) && !own.has(j) && !imp_isBlank(r[j])) o.push([nameAt.get(j) || 'Column ' + SP.colLetter(j), imp_raw(r[j])]);
      if (o.length) { info.extraOnly.push({ row: rn, values: o }); part.extraOnly.push({ row: rn, values: o }); }
      else { info.blank++; part.blank++; }
      continue;
    }
    const v = col.map(j => r[j]);
    if (!total && i > lastNamed && imp_isBlank(v[IMP_BAE_NAME]) && imp_isBlank(v[IMP_BAE_FY])
      && !(imp_isBlank(v[IMP_BAE_APP]) && imp_isBlank(v[IMP_BAE_AUTH]))) {
      const a = imp_baeAmt(v[IMP_BAE_APP], csv), u = imp_baeAmt(v[IMP_BAE_AUTH], csv);
      total = { approved: a.cents, authorized: u.cents, rowNo: rn };
      const raw = {};
      if (a.cents === null) raw[cols[IMP_BAE_APP]] = imp_raw(v[IMP_BAE_APP]);
      if (u.cents === null) raw[cols[IMP_BAE_AUTH]] = imp_raw(v[IMP_BAE_AUTH]);
      if (Object.keys(raw).length) total.raw = raw;
      const x = extrasOf(r);
      if (Object.keys(x).length) total.x = x;
      continue;
    }
    const c = new Array(4), bad = [], raw = {};
    for (let n = 0; n < 4; n++) if (typeof v[n] === 'string' && v[n] !== v[n].trim()) part.conversions.trimmed++;
    c[IMP_BAE_NAME] = imp_text(v[IMP_BAE_NAME]);
    if (c[IMP_BAE_NAME] === '') bad.push(cols[IMP_BAE_NAME] + ' is blank');
    const fy = SP.readFY(v[IMP_BAE_FY]);
    if (fy === null) {
      bad.push(imp_isBlank(v[IMP_BAE_FY]) ? cols[IMP_BAE_FY] + ' is blank' : cols[IMP_BAE_FY] + ' ' + imp_q(imp_raw(v[IMP_BAE_FY])) + ' is not a year');
      if (!imp_isBlank(v[IMP_BAE_FY])) raw[cols[IMP_BAE_FY]] = imp_raw(v[IMP_BAE_FY]);
    }
    c[IMP_BAE_FY] = fy;
    for (const n of [IMP_BAE_APP, IMP_BAE_AUTH]) {
      const a = imp_baeAmt(v[n], csv);
      c[n] = a.cents;
      if (a.cents === null) {
        raw[cols[n]] = imp_raw(v[n]);
        bad.push(cols[n] + ' ' + imp_q(imp_raw(v[n])) + (a.how === 'text'
          ? ' is text, not a number: its unit cannot be known (the report’s amounts are dollars, shown as $M by their format)'
          : ' is not an amount'));
        continue;
      }
      if (a.how === 'zero') part.conversions.zero++;
      else if (a.how === 'blank') part.conversions.blank++;
      else if (a.how === 'subcent') { part.conversions.subcent++; part.subcent.push({ row: rn, column: cols[n], raw: imp_raw(v[n]), cents: a.cents }); }

    }
    for (let j = 0; j < r.length; j++) if (!four.has(j) && !own.has(j) && typeof r[j] === 'string' && r[j] !== r[j].trim() && r[j].trim() !== '') part.conversions.trimmed++;
    const stored = { c, x: extrasOf(r), src: [fileIdx, sh.name, rn] };
    if (bad.length) { stored.bad = bad; stored.raw = raw; }
    out.push(stored);
    part.rowsRead++;
    info.rows++;
    if (bad.length) {
      part.unreadable.push({ row: rn, reasons: bad.slice(), name: c[IMP_BAE_NAME], fy, approved: c[IMP_BAE_APP], authorized: c[IMP_BAE_AUTH], raw });
    } else {
      part.readable++;
      part.cents.approved += c[IMP_BAE_APP];
      part.cents.authorized += c[IMP_BAE_AUTH];
      if (imp_baeObbba(stored, flexCol)) part.obbba = (part.obbba || 0) + 1;     // §15.3, there only when some is (review P5-6)
    }
  }
  // THE TOTAL ROW, CHECKED. It is a sum of floating-point dollars, so each figure agrees when it is within $1 of the
  // readable rows' sum; a figure that could not be read cannot agree.
  if (total) {
    const dA = total.approved === null ? null : total.approved - part.cents.approved;
    const dU = total.authorized === null ? null : total.authorized - part.cents.authorized;
    part.total = { rowNo: total.rowNo, approved: total.approved, authorized: total.authorized, sumApproved: part.cents.approved,
      sumAuthorized: part.cents.authorized, diffApproved: dA, diffAuthorized: dU,
      ok: dA !== null && dU !== null && Math.abs(dA) <= 100 && Math.abs(dU) <= 100 };
    if (total.raw) part.total.raw = total.raw;
  }
  info.used = true;
  const bae = { headers, cols, rows: out, file: fileName, sheet: sh.name, stamp: part.stamp, total };
  return { info, bae, part };
}

// THE IMPORT
// ---------------------------------------------------------------------------------------------------------------
function imp_bytes(data) {
  if (typeof data === 'string') return new TextEncoder().encode(data);
  if (Object.prototype.toString.call(data) === '[object ArrayBuffer]') return new Uint8Array(data);
  if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
  return null;
}
function imp_sameBytes(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
// how many well-formed UTF-8 multi-byte sequences a file holds, and how many bytes are not part of one
function imp_utf8Count(u) {
  let valid = 0, invalid = 0;
  for (let i = 0; i < u.length;) {
    const b = u[i];
    if (b < 0x80) { i++; continue; }
    const n = b >= 0xC2 && b <= 0xDF ? 1 : b >= 0xE0 && b <= 0xEF ? 2 : b >= 0xF0 && b <= 0xF4 ? 3 : 0;
    let ok = n > 0 && i + n < u.length;
    for (let k = 1; ok && k <= n; k++) if ((u[i + k] & 0xC0) !== 0x80) ok = false;
    if (ok) { valid++; i += n + 1; } else { invalid++; i++; }
  }
  return { valid, invalid };
}
function imp_hash(u) { let h = 0x811c9dc5; for (let i = 0; i < u.length; i++) { h ^= u[i]; h = Math.imul(h, 0x01000193); } return h >>> 0; }
// a refusal: nothing was imported, and the message says why in words a person can act on
function imp_refuse(msg, report) { const e = new Error(msg); e.refused = true; e.report = report || null; return e; }
function imp_where(s) { return imp_q(s.file) + ' › ' + imp_q(s.sheet); }
// An import's time in this computer's own time, 'YYYY-MM-DD HH:MM'. Printed as stored (UTC) it read
// '2026-11-09T19:07:23.967Z': a reader in Virginia after 7 pm saw tomorrow's date beside sheet titles dated today
// (review XP-9). Text that is not a time is printed as it is.
function imp_localWhen(iso) {
  const t = typeof iso === 'string' ? Date.parse(iso) : NaN;
  if (isNaN(t)) return String(iso ?? '');
  const d = new Date(t), p2 = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

// files: [{name, data: ArrayBuffer | typed array | string}] -> {pulls, bae, report}. A name ending .csv is read as CSV, any
// other as .xlsx. bae is the BAE report of budgets the import holds (CONTRACT §14.1), or null. Throws an Error with
// .refused = true (and .report) when the import as a whole is refused: nothing to change.
SP.parseFiles = async function parseFiles(files, opts) {
  opts = opts || {};

  const importedAt = opts.now || new Date().toISOString();

  // figure built on them would be double. Same bytes is the test, whatever the names say.

      + (p.rowsRead ? imp_plural(p.rowsRead, 'row is', 'rows are') + ' under its column headers (row ' + p.headerRow + '), and none has a '

    const es = [...m.values()], most = Math.max(...es.map(e => e.n));
    // a source holding a tenth of the largest's rows, or fewer, is "a few rows" beside it
    if (es.some(e => e.n * 10 <= most)) fewRows = true;
    if (es.filter(e => e.n * 10 > most).length >= 2) wholePulls = true;
    for (const e of es) { if (e.state !== 'visible') hidden = true; if (e.state === 'veryHidden') veryHidden = true; }
    clash.push(imp_apLabel(ap) + ' rows come from ' + m.size + ' sheets: '
      + es.map(e => imp_where(e) + (e.state === 'visible' ? '' : e.state === 'veryHidden' ? ' (a very hidden sheet)' : ' (a hidden sheet)')
        + ' holds ' + imp_plural(e.n, imp_apLabel(ap) + ' row')).join('; '));
  }
  if (clash.length) {
    const adv = [];
    if (wholePulls) adv.push('Where two of these each hold a whole pull, or most of one (two exports of one appropriation, a combined '
      + 'export picked with a one-appropriation export, one pull as .xlsx and as .csv, or an old copy kept on another sheet), leave '
      + 'all but the newest out of the import (pick only the newer file, or delete the old copy’s sheet): moving rows from one into '
      + 'the other would count them twice.');
    if (fewRows) adv.push('Where one holds only a few rows beside the others, each of them is most likely misfiled: rows are placed by '
      + 'their Budget name, so move it to the sheet of its own appropriation, or correct its Budget, and import again.');
    if (hidden) adv.push('Excel does not show a hidden sheet: right-click a sheet tab and choose Unhide to see it, and delete it if it '
      + 'is an old copy' + (veryHidden ? ' (a very hidden sheet is not offered there: it is shown from the Visual Basic editor, '
      + 'Alt+F11, by setting its Visible property)' : '') + '.');
    throw imp_refuse('Nothing was imported. Each appropriation’s rows must come from one sheet in one import, and '
      + clash.join('. ') + '. ' + adv.join(' '), report);
  }
  // AN APPROPRIATION ALL OF WHOSE ROWS SIT ON A SHEET NAMED FOR ANOTHER. The budget still wins (CONTRACT §3), but such rows
  // are the very shape of a misfiled row, and imported they become the WHOLE of their appropriation's pull: one Full Fund
  // row on the O&M tab, imported in an O&M-only file, replaced a 40-row Full Fund pull with itself (review IMP-1). They are
  // recorded here, so the store can ask before they replace a pull and say so after.
  for (const ap of IMP_AP_IDS) {
    const m = srcBy.get(ap);
    if (!m || m.size !== 1) continue;
    const e = [...m.values()][0], named = imp_apsNamedBy(e.sheet);
    if (named.length && !named.includes(ap)) {
      report.strays.push({ ap, label: imp_apLabel(ap), file: e.file, sheet: e.sheet, sheetAp: named[0], sheetAps: named, rows: e.n, cents: e.cents });
    }
  }
  // THE PULLS, in the order given: files, then sheets in workbook order, then rows top to bottom
  const pulls = {};
  for (const g of got) {
    let p = pulls[g.ap];
    if (!p) {
      p = pulls[g.ap] = { rows: [], headers: null, files: [], importedAt, extras: [] };
      if (g.ap === 'unidentified') delete p.importedAt;
    }
    p.rows.push(g.row);
    let fe = p.files.find(x => x.idx === g.fileIdx);
    if (!fe) { fe = { idx: g.fileIdx, name: g.file, sheets: [] }; p.files.push(fe); }
    if (!fe.sheets.includes(g.sheet)) {
      fe.sheets.push(g.sheet);
      const si = report.files[g.fileIdx].sheets.find(s => s.name === g.sheet && s.used);
      for (const x of (si ? si.extras : [])) if (!p.extras.includes(x)) p.extras.push(x);
    }
  }
  for (const ap of Object.keys(pulls)) {
    const p = pulls[ap];
    p.headers = SP.RAW_HEADERS.concat(p.extras);   // the 32, then the extra columns, in the order the sheet had them
    delete p.extras;
    p.files = p.files.map(f => ({ name: f.name, sheets: f.sheets }));
    let cents = 0, bad = 0, badCents = 0;
    for (const r of p.rows) { if (r.bad) { bad++; if (typeof r.c[IMP_AMT] === 'number') badCents += r.c[IMP_AMT]; } else cents += r.c[IMP_AMT]; }
    report.byAp[ap] = { label: imp_apLabel(ap), rows: p.rows.length, cents, unreadable: bad, unreadableCents: badCents,
      files: p.files };
  }
  // the order a reader expects: O&M, Full Fund, Initial Spares, OPN, then rows no appropriation could claim
  const ordered = {};
  for (const ap of IMP_AP_IDS.concat(['unidentified'])) if (pulls[ap]) ordered[ap] = pulls[ap];
  const byAp = {};
  for (const ap of Object.keys(ordered)) byAp[ap] = report.byAp[ap];
  report.byAp = byAp;
  report.ignoredSheets = [];
  for (const fr of report.files) for (const s of fr.sheets) if (!s.used) report.ignoredSheets.push({ file: fr.name, sheet: s.name, why: s.why });
  report.refusedFiles = report.files.filter(fr => fr.refused).map(fr => ({ file: fr.name, why: fr.refused }));
  return { pulls: ordered, bae: baeOne ? baeOne.bae : null, report };
};
// the Budget rule of CONTRACT §3, the one the pull places its rows by: the report's rows are placed by the same function
// (§14.2), never a copy of it, so a budget's pull rows and its report row can never be told apart by appropriation
SP.apOfBudget = imp_apOfBudget;

// DATES AND MONTHS THAT COULD NOT BE READ, under two headings. A row is placed by its Date (CONTRACT §4.2), never its
// Month: an unreadable Date puts the row in No date, an unreadable Month moves nothing. Listed together under "the row is
// placed in No date", a row whose Month read "Nov-25" and whose Date read 2026-01-10 was said to sit in No date while its
// money sat in Jan (review F11). The message line kept the two apart; the report now does too.

function imp_dateLines(L, pad, dates, months) {
  if (dates.length) {
    L.push(pad + 'Dates that could not be read (the row is kept and placed in No date): ' + SP.fmtInt(dates.length) + '.');
    for (const d of dates) L.push(pad + '  ' + d);
  }
  if (months.length) {
    L.push(pad + 'Month values that could not be read (the row is kept; a row is placed by its Date, never its Month, so this '
      + 'moves no money): ' + SP.fmtInt(months.length) + '.');

}

// a BAE report sheet in the file list: where its header is and what was read below it (the BAE section says the rest)
function imp_baeNote(s) {

  if (s.blank) bits.push(imp_plural(s.blank, 'blank row') + ' skipped');

    + 'makes its row unreadable; open the file in Excel and save it, so the results are saved, and import it again');

// the pull's part of the report (CONTRACT §3)
function imp_pullLines(L, report) {
  L.push('Rows read: ' + SP.fmtInt(report.rowsRead) + '. Blank rows skipped: ' + SP.fmtInt(report.rowsBlank) + '.');
  const xo = Array.isArray(report.extraOnly) ? report.extraOnly : [];
  if (xo.length) {
    L.push('Rows skipped because none of the 32 CCaR columns holds anything, though another column does (their text is here, '
      + 'and nowhere else): ' + SP.fmtInt(xo.length) + '.');
    for (const x of xo) L.push('  ' + imp_where(x) + ' row ' + x.row + ': ' + x.values.map(([h, v]) => h + ' ' + imp_q(v)).join(', ') + '.');
  }
  for (const ap of Object.keys(report.byAp || {})) {

      + (b.unreadable ? ' (plus ' + imp_plural(b.unreadable, 'unreadable row') + ', counted in no figure)' : '')

  }

  if (cv.paren) conv.push(imp_plural(cv.paren, 'amount') + ' in parentheses, read as negative');
  if (cv.subcent) conv.push(imp_plural(cv.subcent, 'amount') + ' with fractions of a cent, rounded to the cent (half away from zero)');
  if (cv.blank) conv.push(imp_plural(cv.blank, 'blank amount') + ' read as $0');
  if (cv.trimmed) conv.push(imp_plural(cv.trimmed, 'value') + ' with spaces trimmed from the ends');
  L.push('Conversions: ' + (conv.length ? conv.join('; ') + '.' : 'none.'));
  const tb = Object.keys(report.trimmedBy || {});
  if (tb.length) L.push('  Spaces trimmed, by column: ' + tb.map(h => h + ' ' + SP.fmtInt(report.trimmedBy[h])).join(', ') + '.');
  for (const s of report.subcent || []) L.push('  Rounded: ' + imp_where(s) + ' row ' + s.row + ': ' + imp_q(s.raw) + ' read as ' + SP.fmtUsd(s.cents) + '.');

    db.filter(d => d && d.column === 'Month').map(d => imp_where(d) + ' row ' + d.row + ': Month ' + imp_q(d.raw) + '.'));
  const dis = report.disagreements || [];
  L.push('Budget and sheet name disagree: ' + (dis.length ? '' : 'none.'));
  for (const d of dis) L.push('  ' + imp_where(d) + ' (by its name, ' + imp_apLabel(d.sheetAp) + '): ' + imp_plural(d.rows, 'row')
    + ', ' + SP.fmtUsd(d.cents) + ', placed by Budget as ' + Object.keys(d.byBudget).map(a => imp_apLabel(a) + ' ' + SP.fmtInt(d.byBudget[a])).join(', ') + '.');
  for (const x of Array.isArray(report.strays) ? report.strays : []) {
    // The advice used to be "move it to the Full Fund sheet": an O&M file has none, so the person made one, and the row
    // on its own tab became the whole Full Fund pull with no question at all (review SEAM-2). A lone row of another
    // appropriation is put right by its Budget, or by leaving it out of this file: it belongs in its own pull, whole.
    L.push('Every ' + x.label + ' row in this import sits on a sheet named for ' + SP.sheetNamedFor(x) + ': ' + imp_where(x) + ' holds '
      + imp_plural(x.rows, 'row') + ', ' + SP.fmtUsd(x.cents) + ', placed by Budget as ' + x.label + ', and ' + (x.rows === 1 ? 'it is' : 'they are')
      + ' the whole ' + x.label + ' pull this import brings. If ' + (x.rows === 1 ? 'it is' : 'they are') + ' misfiled, correct the Budget, or take '
      + (x.rows === 1 ? 'it' : 'them') + ' out of this file (the ' + x.label + ' pull is imported whole, from its own file or sheet), and import again.');
  }
  L.push('Alloc values:');
  for (const a of report.alloc || []) L.push('  ' + (a.text === '' ? '(blank)' : imp_q(a.text)) + ': ' + imp_plural(a.rows, 'row') + ', ' + SP.fmtUsd(a.cents) + '.');
}

// THE BAE REPORT'S PART OF THE IMPORT REPORT (CONTRACT §14.1): the file and sheet, rows read and skipped, every conversion,
// the unreadable rows in full and the check against the report's own total row. Read from a saved file too, so every value
// is taken as it may be (a report saved by another version draws, never throws).
//   b  report.bae (parseFiles' part), or null;  kept  the import time of a report kept from an earlier import (baeKeptLines),
//   whose blank rows and conversions were not kept and are not said
// §15.3, §17.1 whether a stored report row is readable FY2025 O&M OBBBA funding, scope 'obbba': read by the model's own
// judgement of a row (SP.baeDerive, after Flyaway and naming no appropriation) wherever the page has it, so the import's
// words and the figures never count different rows; the predicate alone where only the import's modules are loaded.

function imp_baeObbba(stored, flexCol) {
  if (!stored || !Array.isArray(stored.c)) return false;
  if (typeof SP.baeDerive === 'function') { try { const d = SP.baeDerive(stored, null, undefined, flexCol); return d.readable && d.scope === 'obbba'; } catch (e) { return false; } }
  const name = imp_text(stored.c[0]), ap = name !== '' ? SP.apOfBudget(name) : null;
  return !(Array.isArray(stored.bad) && stored.bad.length) && !/\bflyaway\b/i.test(name) && SP.isObbba25(name, stored.c[1], ap, SP.baeFlex02(stored, flexCol));
}
// how many of a stored report's readable rows (no reason it could not be read, both amounts whole cents) are FY2025 O&M

// report (SP.state.bae.current); 0 for anything that is not one.
function imp_baeObbbaCount(b) {

  const okNum = v => typeof v === 'number' && Number.isSafeInteger(v), flexCol = SP.baeFlex02Col(b);
  let n = 0;

    if (imp_baeObbba(r, flexCol)) n++;

}
// §17 (reviews M6-3, P6-3) the import's BAE part as this page reads it: the count of FY2025 O&M OBBBA rows its file part

    if (cv.blank) conv.push(imp_plural(cv.blank, 'blank amount') + ' read as $0');
    if (cv.subcent) conv.push(imp_plural(cv.subcent, 'amount') + ' with fractions of a cent, rounded to the cent');
    if (cv.trimmed) conv.push(imp_plural(cv.trimmed, 'value') + ' with spaces trimmed from the ends');
    L.push('  Conversions: ' + (conv.length ? conv.join('; ') + '.' : 'none.'));
    for (const x of arr(b.subcent)) if (x && typeof x === 'object') {
