<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="sfcb-spend-plan" content="program">
<title>CUI - APEX</title>
<style>
:root{
  --navy:#25394d; --navy2:#3b4553; --strip:#c3d4e6; --gold:#cbd9e8; --box:#25394d; --grid:#8b95a4; --closed:#ced5de;
  --green:#00B050; --yellow:#FFD700; --red:#C00000; --plan:#46505e; --focus:#25394d; --line:#aeb7c3; --soft:#d3e1ef;
  --cuiH:20px;
  --sbg:#c4ccd6; --sbg2:#d9dfe7; --spanel:#d9dfe7; --spanel2:#c9d0da; --sline:#aeb7c3; --sedge:#627185; --sink:#182029; --smut:#3b4553;
  --steal:#055795; --sblue:#055795;
  --sbtn:#ced5de; --ssel:#c3d4e6; --slink:#0b4f8a; --sdeep:#c2ccd9; --cell:#eef1f5; --ochre:#7a4a08; --wine:#8c1d3f; --acc:#25394d; --onAcc:#eaf0f6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;
  scroll-padding-top:calc(var(--topH, 140px) + var(--theadH, 0px) + 8px);scroll-padding-bottom:calc(var(--cuiH) + 8px)}
body{margin:0;background:var(--sbg);color:#111;font:13px/1.35 Calibri,Carlito,"Segoe UI",Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column}
#app{flex:1 0 auto;min-width:0}
.cui{position:sticky;z-index:40;height:var(--cuiH);line-height:var(--cuiH);text-align:center;font-weight:700;font-size:12px;
  letter-spacing:.04em;background:#fff;color:#000;border-color:#000;border-style:solid;border-width:0}
.cui-top{top:0;border-bottom-width:1px}
.cui-bottom{bottom:0;border-top-width:1px}
.boot-note{padding:16px;color:var(--sink)}
.skip{position:absolute;left:8px;top:-60px;z-index:60;padding:8px 14px;background:var(--acc);color:var(--onAcc);font-weight:700;border-radius:0 0 6px 6px;text-decoration:underline}
.skip:focus,.skip:focus-visible{top:var(--cuiH);outline:3px solid var(--onAcc);outline-offset:-4px}
@media print{.skip{display:none}}
header.top{position:sticky;top:var(--cuiH);z-index:30;background:var(--sbg2);color:var(--sink);border-bottom:1px solid var(--sline);box-shadow:0 1px 3px rgba(24,32,41,.25)}
.bar1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 14px;background:var(--sbg2);color:var(--sink)}
.brand{margin:0;font-size:20px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;letter-spacing:.03em}
.brand .logo{height:26px;width:auto;flex:none;color:var(--sink);--apex-accent:var(--steal)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.brand .bs{font-size:13px;font-weight:400;letter-spacing:0;color:var(--smut);padding-left:9px;border-left:1px solid var(--sedge)}
.brand .ey{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid var(--steal);background:var(--ssel);color:var(--slink);font-size:12px;font-weight:700;letter-spacing:0}
.brand .ey:empty{display:none}
.upd{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--sedge);background:var(--cell);color:var(--sink);font-size:13px;font-weight:700;white-space:nowrap}
.upd[hidden]{display:none}
.upd-aging{background:#f3e6cf;border-color:var(--ochre);color:#5c3706}
.upd-old{background:var(--wine);border-color:var(--wine);color:#fff}
.bar1 .fld{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.bar1 input{font:inherit;font-weight:400;padding:2px 4px;border:1px solid var(--sedge);border-radius:4px;color:#111;background:#fff}
.bar1 input[type=number]{width:5.2em}
.bar1 input:disabled{background:var(--spanel2);color:var(--smut)}
.bar1 .grow{flex:1 1 0;min-width:0}
.bar1 button{font:inherit;font-weight:600;padding:3px 10px;border:1px solid var(--sedge);border-radius:6px;background:var(--sbtn);color:var(--sink);cursor:pointer;white-space:nowrap}
.bar1 button:hover{background:var(--gold);color:#000}
.bar1 button[aria-pressed=true]{background:var(--acc);color:var(--onAcc);border-color:var(--acc)}
.savest{font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:3px}
.savest.clean{color:var(--sink);border:1px solid var(--sedge)}
.savest.dirty{color:#fff;background:var(--ochre)}
.pulls{padding:2px 14px;font-size:12px;color:var(--smut);background:var(--sdeep);border-top:1px solid var(--sline);overflow-wrap:anywhere}
.pulls .d{font-variant-numeric:tabular-nums}
.msgrow{display:flex;align-items:flex-start}
.msg{flex:1 1 auto;min-width:0;padding:0 12px;font-size:13px;overflow-wrap:anywhere}
.msgx{flex:0 0 auto;margin:3px 12px 3px 6px;font:inherit;font-size:12px;font-weight:600;padding:1px 8px;border:1px solid var(--navy);border-radius:3px;
  background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.msgx:hover{background:var(--gold);color:#000}
.msg-info,.msg-ok,.msg-warn,.msg-err{padding:4px 12px;border-left:5px solid}
.msg-info{background:var(--soft);border-color:var(--navy2);color:#111}
.msg-ok{color:#111}
.msg-ok{background:#e9f6ec;border-color:var(--green)}
.msg-err{background:#fde9e7;border-color:var(--red);color:#7a0000;font-weight:600}
.msg-warn{background:#fff6d6;border-color:#b07d00;color:#4a3600;font-weight:600}
.shell{display:flex;align-items:flex-start;min-width:0}
.content{flex:1 1 0;min-width:0}
nav.views{flex:0 0 144px;display:flex;flex-direction:column;gap:2px;padding:10px 6px;position:sticky;top:var(--topH, 96px);
  max-height:calc(100vh - var(--topH, 96px) - var(--cuiH));overflow-y:auto;
  background:var(--acc);color:var(--onAcc);border-radius:0 8px 8px 0;margin:8px 8px 12px 0;align-self:flex-start}
nav.views[hidden]{display:none}
nav.views button{font:inherit;text-align:left;padding:6px 10px;border:1px solid transparent;border-radius:7px;background:none;color:var(--onAcc);cursor:pointer}
nav.views button:hover{background:#3a536c;color:#fff}
nav.views button[aria-pressed=true]{background:var(--onAcc);border-color:var(--onAcc);color:var(--acc);font-weight:700;box-shadow:inset 3px 0 0 var(--steal)}
@media (max-width:900px){
  .shell{display:block}
  nav.views{position:static;flex-direction:row;flex-wrap:wrap;max-height:none;padding:6px 10px}
}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:8px 8px 0 0;padding:6px 12px;background:var(--spanel);color:var(--sink);border:1px solid var(--sline);border-radius:8px}
.filters .fl{font-weight:700;color:var(--slink)}
.chk{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.chk input{width:16px;height:16px;margin:0}
.shownline{flex-basis:100%;font-size:12px;color:var(--smut)}
.l3.filtered{color:#8a3a00;font-weight:700}
.shownline.filtered,.ovshown.filtered{color:var(--ochre);font-weight:700}
main{display:block;padding:6px 16px 28px;max-width:100%}
main.sheet{margin:8px 8px 12px 0;padding:6px 10px 28px;background:var(--spanel);color:#111;border-radius:8px;border:1px solid var(--sline)}
main:focus{outline:none}
h2.title{margin:10px 0 4px;padding:5px 10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;overflow-wrap:anywhere}
h3.sub,h4.sub{margin:14px 0 4px;color:var(--navy);font-size:14px}
h4.sub{font-size:13px}
.l2,.l3,.note{margin:3px 0;color:#333;overflow-wrap:anywhere}
.l3{font-style:italic}
.shown{margin:6px 0;padding:4px 8px;background:#fff4ce;border-left:5px solid var(--focus)}
.none{color:#555;font-style:italic}
.err{color:#7a0000;font-weight:600}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0}
main button,main select,main input{font:inherit}
main button{padding:3px 10px;border:1px solid var(--navy);border-radius:3px;background:#fff;color:var(--navy);cursor:pointer}
main button:hover{background:var(--gold);color:#000}
main button:disabled{border-color:#aaa;color:#777;background:#f3f3f3;cursor:default}
main select{padding:2px 4px;border:1px solid var(--sedge);border-radius:2px;background:#fff;max-width:100%}
main input[type=text]{padding:2px 4px;border:1px solid var(--sedge);border-radius:2px}
main label{display:inline-flex;align-items:center;gap:6px}
.count{margin:4px 0;font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
nav.views :focus-visible{outline-color:var(--onAcc)}
.navbtn:focus-visible{outline:3px solid var(--onAcc);outline-offset:-4px}
input[type=month]:focus-within{outline:3px solid var(--focus);outline-offset:1px}
.tg:focus-visible{outline-offset:0}
.tw{max-width:100%;overflow-x:auto;margin:2px 0 8px}
.tw.treew.fit{overflow:visible}
.tw.treew.fit table.tree thead th{position:sticky;top:var(--topH, 140px);z-index:5}
.tw.treew.box{max-height:calc(100vh - var(--topH, 140px) - var(--cuiH) - 12px);overflow:auto;scroll-padding-top:3em}
.tw.treew.box table.tree thead th{position:sticky;top:0;z-index:5}
@media (min-width:641px){
  .fsheet.tw.fit{overflow:visible}
  .fsheet.tw.fit table.findt thead th{position:sticky;top:var(--topH, 140px);z-index:5}
}
table.grid{border-collapse:collapse;font-size:12px;background:var(--cell)}
.grid th,.grid td{border:1px solid var(--grid);padding:2px 6px;vertical-align:top}
.grid thead tr.hd th,.grid tr.hd th{background:var(--gold);border:1px solid var(--box);border-top-width:2px;border-bottom-width:2px;font-weight:700;text-align:center;white-space:nowrap}
.grid tr.hd th:first-child{border-left-width:2px}
.grid tr.hd th:last-child{border-right-width:2px}
.grid tr.hd th.lab{text-align:left}
.grid tbody th{text-align:left;font-weight:600}
.grid .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid td.cl{background:var(--closed)}
.grid .plan{font-style:italic;color:var(--plan)}
.grid .tot{font-weight:700}
.grid .wrap{max-width:30em;overflow-wrap:anywhere}
.grid th.lab{min-width:16em;max-width:30em;font-weight:400;white-space:normal;overflow-wrap:anywhere}
.grid tr.total th,.grid tr.total td{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}
.grid th.apg{vertical-align:middle;font-weight:700}
.dag,.ddag,.sect{margin-left:2px;font-weight:700;color:#7a5a00}
.grid tr.total .dag,.grid tr.total .ddag,.grid tr.total .sect{color:var(--gold)}
.grid td.nofig{color:#555;font-style:italic}
table.blk{font-size:12px}
.blk tr.pmo th.lab,.blk th.lab.lv1{font-size:14px;font-weight:700;color:var(--navy)}
.blk th.lab.lv2{font-weight:700;padding-left:22px}
.blk th.lab.lv3{padding-left:40px}
.blk th.lab.lv4{font-size:11px;padding-left:58px}
.tg{display:inline;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
main .tg{border:0;background:none;padding:0;color:inherit}
main .tg:hover{background:none;text-decoration:underline;color:inherit}
.tg .arr{display:inline-block;width:1.1em;color:var(--navy2)}
.leaf{padding-left:1.1em}
.blk tr.band th.lab{color:var(--navy);font-weight:700}
.blk tr.band td{font-weight:600}
.blk tr.band:first-of-type th,.blk tr.band:first-of-type td{border-top:2px solid var(--box)}
.blk tr.spacer td{border:0;height:8px;padding:0}
.blk tr:not(.band):not(.spacer) + tr.band th,.blk tr:not(.band):not(.spacer) + tr.band td{border-top:10px solid var(--spanel);box-shadow:inset 0 2px 0 var(--box)}
.blk tr.strip td{background:var(--strip);font-weight:700;color:#000}
.blk tr.strip td .dag,.blk tr.strip td .ddag,.blk tr.strip td .sect{color:inherit}
.bar{margin:14px 0 0;padding:4px 8px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.bar.bar2{background:var(--navy2)}
h3.bar{margin-top:16px}
.blkctl{display:flex;justify-content:flex-start;gap:10px;padding:4px 0}
.nabar{margin:6px 0 2px;padding:3px 8px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
h3.nabar{font-size:13px}
details.nafold>summary{display:block;list-style:none;cursor:pointer}
details.nafold>summary::-webkit-details-marker{display:none}
details.nafold>summary h3.nabar::before{content:"\25B8\00A0"}
details.nafold[open]>summary h3.nabar::before{content:"\25BE\00A0"}
details.nafold>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.nacount,.natie{display:block;padding:1px 8px 3px;font-size:12px;color:var(--smut)}
.natie{font-style:italic}
.boot-late{display:block;margin-top:8px;visibility:hidden;animation:apexBootLate 0s linear 4s forwards}
@keyframes apexBootLate{to{visibility:visible}}
table.nalines{border-collapse:collapse;font-size:12px;width:100%}
.nalines th{width:6.5em;vertical-align:top;text-align:left;white-space:nowrap;padding:2px 8px;color:var(--navy);border-bottom:1px solid #ddd}
.nalines td{width:auto;padding:2px 8px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.st{text-align:center;font-weight:700;white-space:nowrap}
.st-green{background:var(--green);color:#000}
.st-yellow{background:var(--yellow);color:#000}
.st-red{background:var(--red);color:#fff}
.grid td.st.st-green{background:var(--green)}
.grid td.st.st-yellow{background:var(--yellow)}
.grid td.st.st-red{background:var(--red)}
.grid td.st-green,.grid td.st-yellow,.grid td.st-red{border-color:var(--grid)}
.grid td.st.plan{font-weight:400;font-style:italic}
.grid td.st.plan.st-green,.grid td.st.plan.st-yellow{color:#000}
.grid td.st.plan.st-red{color:#fff}
table.legend{border-collapse:collapse;margin:10px 0 4px}
.legend caption{text-align:left;font-weight:700;color:var(--navy);padding-bottom:2px}
.legend td{padding:2px 8px;border:1px solid var(--grid)}
.legend td.st{width:7em}
ul.notes{margin:4px 0;padding-left:20px}
ul.notes li{margin:2px 0;overflow-wrap:anywhere}
section.slide{margin:12px 0 18px;padding:8px;border:1px solid var(--line);border-radius:4px}
.slidebtns{display:flex;justify-content:flex-end;gap:6px}
input.pct{width:4.4em;text-align:right}
input.amt{width:11em;text-align:right}
.goals th[scope=row]{white-space:normal;min-width:12em;max-width:18em}
.goals td{padding:1px 2px}
.speclist{margin:4px 0;padding-left:20px}
.speclist li{margin:3px 0}
.flag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:2px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.budgets tr.unknown td{background:#fff4ce}
.budgets select{max-width:16em}
.report{font-size:12px;padding:6px 8px;background:#fafbfd;border:1px solid var(--line);overflow-wrap:anywhere}
.report .rl{white-space:pre-wrap;margin:1px 0}
.refused{margin:6px 0;padding:6px 10px;background:#fde9e7;border-left:5px solid var(--red)}
.help{max-width:80em}
.helptoc ol{margin:2px 0 10px;padding-left:22px;columns:2 18em}
.helptoc li{margin:2px 0}
.helptoc a{color:var(--slink)}
.help h3.sub:focus{outline:none}
.help h3.sub:focus-visible{outline:3px solid var(--focus)}
.help li{margin:3px 0}
.nodata{max-width:60em}
section.chg{margin-bottom:18px}
main.ov{color:var(--sink);padding:10px 8px 28px 0}
main.ov .ovhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
main.ov .grow{flex:1 1 0}
.ovtitle{margin:0;font-size:20px;font-weight:700}
.ovsub,.ovshown,.cardnote,.ovlab{color:var(--smut)}
.ovshown{margin:4px 0 0;font-size:12px}
main.ov button{border:1px solid var(--sedge);border-radius:6px;background:var(--sbtn);color:var(--sink)}
main.ov button:hover{background:var(--gold);color:#000}
.seg{display:inline-flex;gap:4px}
main.ov .seg button{min-height:28px;padding:3px 14px}
main.ov .seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}
.tile,.card,.ovstatus{background:linear-gradient(180deg,var(--spanel2),var(--spanel));border:1px solid var(--sline);border-radius:10px;padding:12px 14px}
.tile{display:flex;flex-direction:column;min-width:0}
.tl{color:var(--smut);font-size:12px}
.tv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ts{color:var(--smut);font-size:12px;min-height:1.35em}
main.ov .dag,main.ov .ddag,main.ov .sect{color:var(--ochre);font-size:15px}
.ovstatus{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ovstatus .tl{font-size:13px;color:var(--sink);font-weight:700}
.stc{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px}
.stn{border:1px solid var(--sedge);color:var(--sink)}
.ovstatus button{margin-left:auto}
.ovnotes .note{color:var(--smut);margin:6px 0 0}
.ovtwo{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.card h3{margin:0 0 4px;font-size:14px}
.cardnote{margin:0 0 8px;font-size:12px}
.ovtwo.ovwide{grid-template-columns:minmax(0,1fr)}
.ovscroll{overflow-x:auto}
.ovcharts{display:grid;grid-template-columns:repeat(var(--n,1),minmax(190px,1fr));gap:8px 10px;align-items:start}
.ovcharts[data-cols="1"]{grid-template-columns:minmax(0,560px)}
.ovfyh{font-weight:700;font-size:13px;text-align:center;color:var(--sink);padding:2px 0;border-bottom:1px solid var(--sline)}
.ovaph{grid-column:1/-1;margin:6px 0 0;font-size:13px;font-weight:700;color:var(--slink)}
.ovc{margin:0;padding:8px;border:1px solid var(--sline);border-radius:8px;background:var(--cell);min-width:0}
.ovc figcaption{display:flex;align-items:center;gap:8px;margin-bottom:2px}
main.ov .ovopen{border:0;background:none;padding:2px 0;font-weight:700;color:var(--slink);text-decoration:underline}
main.ov .ovopen:hover{background:none;color:var(--sink)}
.ovpct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.ovsvg{display:block;width:100%;height:auto}
.ovsvg .gl{stroke:var(--sline);stroke-width:1}
.ovsvg .ax{fill:var(--smut);font-size:9px}
.ovsvg .ba{fill:var(--steal)}
.ovsvg .bp{fill:rgba(5,87,149,.16);stroke:var(--sblue);stroke-width:1;stroke-dasharray:3 2}
.ovsvg .gline{fill:none;stroke:var(--sink);stroke-width:1.5}
.ovsvg .gdot{fill:var(--sink)}
.ovsvg .ovnone{fill:var(--sink);font-size:11px}
.ovlab{margin:2px 0 0;font-size:11px;overflow-wrap:anywhere}
.ovleg{margin:8px 0 0;font-size:12px;color:var(--smut)}
.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 5px 0 12px;vertical-align:-1px}
.ovleg .k:first-child,.ovaps .k{margin-left:0}
.ka{background:var(--steal)}
.kp{background:rgba(5,87,149,.16);border:1px dashed var(--sblue)}
.kg{background:var(--sink);height:2px;vertical-align:3px}
.ovap{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.donut{width:120px;height:120px;flex:none}
.ovaps{border-collapse:collapse;font-size:13px;flex:1 1 150px}
.ovaps th{text-align:left;font-weight:400;padding:4px 8px 4px 0}
.ovaps td{text-align:right;padding:4px 0 4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ovaps tr+tr th,.ovaps tr+tr td{border-top:1px solid var(--sline)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ovtwo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1400px){
  nav.views{flex-basis:128px;padding:10px 4px}
  nav.views button{padding:6px 5px}
  main.sheet{margin-right:4px;padding-left:6px;padding-right:6px}
}
@media (max-width:900px){
  nav.views{flex-basis:auto;padding:6px 10px}
  nav.views button{padding:6px 10px}
  .filters,main.sheet{margin-left:8px;margin-right:8px}
  main.ov{padding-left:8px}
}
.asof{color:var(--smut);font-size:13px;white-space:nowrap}
@media (max-width:640px){.asof{white-space:normal}}
.savest[hidden]{display:none}
.manage[hidden]{display:none}

SP.srrbView = function srrbView(M, pulls, view, F) {

        months: [...q.months].sort(), nodate: q.nodate, cents: q.cents, byPmo: q.byPmo, other: other.get(k) || 0, rows: q.rows });
    }

  const uniq = (list, key, label) => { const m = new Map(); for (const x of list) { const k = key(x); if (!m.has(k)) m.set(k, label(x)); } return [...m]; };
  const picks = {
    pmos: uniq(all.flatMap(l => l.pmos), p => p.key, p => p.label).sort((a, b) => (pmoAt.has(a[0]) ? pmoAt.get(a[0]) : 1e9) - (pmoAt.has(b[0]) ? pmoAt.get(b[0]) : 1e9) || pb_cmp(a[1], b[1])),
    aps: SP.APS.filter(a => all.some(l => l.ap === a.id)).map(a => [a.id, a.label]),
    fys: uniq(all, l => String(l.fy), l => 'FY' + l.fy).sort((a, b) => Number(a[0]) - Number(b[0])),

    .sort((a, b) => b.sum - a.sum || pb_cmp(a.label, b.label));

    byPmo, bySvc: svcIdx.map((i, k) => ({ label: PB_UFR_SVC[i], sum: lines.reduce((n, l) => n + l.amt[k], 0) })) };

        cents: q.cents, total: q.cents.reduce((a, c) => a + c, 0), status: 'Mandatory', exec: '', sfcb: '', mand: true, record: pb_major(q.rec, ''), obligated: q.obligated });

SP.ufrMandKey = function ufrMandKey(l) { return l.ap + '|' + l.fy + '|' + SP.normKey(l.ccar) + '\u0001' + SP.normKey(l.title); };

SP.ufrRanked = function ufrRanked(ufr, ranks) {

        if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) cells[k] = { v: { date: v }, s: k === 1 ? EXS.rMonth : EXS.rDate };
        else if (ex_own(raw, h)) cells[k] = { v: String(raw[h]), s: EXS.rBad };
        else cells[k] = { s: EXS.rText };
      } else if (k === 9) {
        cells[k] = typeof v === 'number' ? { v: v / 100, s: EXS.rAmt } : ex_own(raw, 'Amount') ? { v: String(raw.Amount), s: EXS.rBad } : { s: EXS.rText };
      } else cells[k] = v === null || v === undefined || v === '' ? { s: EXS.rText } : { v: String(v), s: EXS.rText };
    }
    for (let j = 0; j < nx; j++) {
      const v = row.x && ex_own(row.x, extras[j]) ? row.x[extras[j]] : '';
      cells[32 + j] = v === '' || v === null || v === undefined ? { s: EXS.rText } : { v: String(v), s: EXS.rText };
    }
    const d = SP.deriveRow(row, settings);
    cells[32 + nx] = { v: d.svc, s: EXS.rText };
    cells[33 + nx] = { v: SP.LANE_WORDS[d.lane] || d.lane, s: EXS.rText };
    cells[34 + nx] = { v: d.statusLabel || d.status, s: EXS.rText };
    cells[35 + nx] = { v: ex_counted(d, M, svcOn, laneOn, a.id, marks), s: EXS.rText };

}

const EX_BAE_TAIL = ['Appropriation', 'Service', 'Lane', 'PMO', 'Counted'];
const EX_BAE_TOTAL_WHY = 'No: the report’s own total row, never counted (the Import Report checks it against the rows)';
function ex_baeSheet(M, bae) {
  if (!bae || !Array.isArray(bae.rows)) {
    throw new Error('its figures were worked out from a BAE report, but the report itself was not given to the workbook, so its sheet cannot be written.');
  }
  const rows = bae.rows;
  const der = M.bae && Array.isArray(M.bae.derived) ? M.bae.derived : [];
  if (der.length !== rows.length) {
    throw new Error('the BAE report given to the workbook (' + SP.fmtInt(rows.length) + ' rows) is not the one its figures were worked out from ('
      + SP.fmtInt(der.length) + ' rows).');
  }
  const cols = (typeof SP.baeCols === 'function' ? SP.baeCols(bae) : Array.isArray(bae.cols) ? bae.cols : []).map(h => String(h ?? ''));
  const heads = Array.isArray(bae.headers) ? bae.headers.map(h => String(h ?? '')) : [];
  const seen = new Set(heads);
  const add = h => { if (!seen.has(h)) { seen.add(h); heads.push(h); } };
  for (const h of cols) add(h);
  const tr = bae.total && typeof bae.total === 'object' ? bae.total : null;
  for (const r of rows.concat(tr ? [tr] : [])) if (r && r.x && typeof r.x === 'object') for (const h of Object.keys(r.x)) add(h);
  const nh = heads.length;
  const widths = heads.map(h => { const k = cols.indexOf(h); return k === 0 ? 48 : k === 1 ? 9.95 : k >= 2 ? 18.02 : 14.93; })
    .concat([16.01, 18.02, 13.99, 32, 30]);
  const K = ex_sheet('BAE Report', widths, { freeze: 'A2', page: EX_PAGE_DATA });
  delete K.sh.grid;
  ex_push(K, heads.concat(EX_BAE_TAIL).map(t => ({ v: t, s: EXS.rHead })), { ht: 21.75 });
  const fileCells = (c, raw, x) => heads.map(h => {
    const k = cols.indexOf(h);
    const rawText = raw && typeof raw === 'object' && ex_own(raw, h) ? { v: String(raw[h]), s: EXS.rBad } : null;
    if (k === 0) { const v = c[0]; return typeof v === 'string' && v !== '' ? { v, s: EXS.rText } : rawText || { s: EXS.rText }; }
    if (k === 1) return Number.isInteger(c[1]) ? { v: c[1], s: EXS.rNum } : rawText || { s: EXS.rText };
    if (k === 2 || k === 3) return Number.isSafeInteger(c[k]) ? { v: c[k] / 100, s: EXS.rAmt } : rawText || { s: EXS.rText };
    const v = x && typeof x === 'object' && ex_own(x, h) ? x[h] : '';
    return v === '' || v === null || v === undefined ? { s: EXS.rText } : { v: String(v), s: EXS.rText };
  });
  const txt = v => (v === '' || v === null || v === undefined ? { s: EXS.rText } : { v: String(v), s: EXS.rText });
  const tot = () => {
    const c = ['', null, Number.isSafeInteger(tr.approved) ? tr.approved : null, Number.isSafeInteger(tr.authorized) ? tr.authorized : null];
    const cells = fileCells(c, tr.raw, tr.x);
    cells.push(txt(''), txt(''), txt(''), txt(''), txt(EX_BAE_TOTAL_WHY));
    ex_push(K, cells);
  };
  let totDone = !tr;
  rows.forEach((row, i) => {
    const d = der[i], rn = d && Number.isInteger(d.rowNo) ? d.rowNo : null;
    if (!totDone && rn !== null && Number.isInteger(tr.rowNo) && rn > tr.rowNo) { tot(); totDone = true; }
    const c = row && Array.isArray(row.c) ? row.c : [];
    const cells = fileCells(c, row && row.raw, row && row.x);
    cells.push(txt(d.apLabel), txt(d.svc), txt(SP.LANE_WORDS[d.lane] || d.lane), txt(d.goes), txt(d.why));
    ex_push(K, cells);
  });
  if (!totDone) tot();
  if (!nh) ex_span(K, 'The BAE report holds no columns.', EXS.text, 0, K.W - 1);
  return K.sh;
}

function ex_reportSheet(M, pulls, meta) {

function ex_noSwitchLine(M, pulls, settings) {
  const allSvc = new Set(SP.SERVICES.concat([SP.SVC_UNKNOWN])), allLane = new Set(['disc', 'mand']);
  let before = 0, unread = 0, unid = 0, obbba = 0;
  const marks = ex_obMarks(M);
  const each = (rows, f) => { for (const row of Array.isArray(rows) ? rows : []) if (row && Array.isArray(row.c)) f(SP.deriveRow(row, settings)); };
  for (const a of SP.APS) {
    each(pulls && pulls[a.id] && pulls[a.id].rows, d => {
      if (d.svc !== SP.SVC_UNKNOWN) return;
      const why = ex_counted(d, M, allSvc, allLane, a.id, marks);
      if (/^No: could not be read/.test(why)) unread++;
      else if (why === 'No: ' + SP.OBBBA_WHY || why === 'No: ' + SP.OBBBA_WHY_REPORT) obbba++;
      else if (why !== 'Yes') before++;
    });
  }
  each(pulls && pulls.unidentified && pulls.unidentified.rows, d => { if (d.svc === SP.SVC_UNKNOWN) unid++; });
  const baeRows = ex_hasBae(M) && Array.isArray(M.bae.derived) ? M.bae.derived.filter(d => d.svc === SP.SVC_UNKNOWN).length : 0;
  const n = before + unread + unid + baeRows + obbba;
  if (!n) return 'No such rows (no switch)';
  const rw = k => SP.fmtInt(k) + (k === 1 ? ' row' : ' rows');
  const parts = [];
  if (before) parts.push(rw(before) + ' before the first FY shown (FY' + M.firstFY + ')');
  if (obbba) parts.push(rw(obbba) + ' of ' + SP.OBBBA_WHY);
  if (unread) parts.push(rw(unread) + ' that could not be read');
  if (unid) parts.push(rw(unid) + ' whose appropriation was not identified (see the Import Report)');
  if (baeRows) parts.push(rw(baeRows) + ' of the BAE report (each with its reason in the Counted column of the BAE Report sheet)');
  return 'No switch: no row that counts has no service. ' + (n === 1 ? 'The 1 row' : 'The ' + SP.fmtInt(n) + ' rows') + ' with no service '
    + (n === 1 ? 'counts' : 'count') + ' nowhere: ' + parts.join('; ') + '.';
}

const PIC_W = 2000, PIC_H = 675;
const PIC = Object.freeze({
  navy: '#1F3A68', gold: '#FFE699', box: '#404040', grid: '#808080', ink: '#1A1A1A', closed: '#F2F2F2', plan: '#808080',
  white: '#FFFFFF', filtered: '#8A3A00',
  status: Object.freeze({ green: '#00B050', yellow: '#FFD700', red: '#C00000' }),
  statusInk: Object.freeze({ green: '#FFFFFF', yellow: '#000000', red: '#FFFFFF' }),

const PIC_FONT = 'Calibri, Carlito, "Segoe UI", Arial, sans-serif';
const PIC_CUI_BAND = 30, PIC_CUI_PX = 18, PIC_MARGIN = 16, PIC_SHOWN_H = 26;
const PIC_T = Object.freeze({
  titleH: 34, headH: 30, rowH: 22, spacerH: 10, padX: 7, minNumW: 64,
  labelMax: 520,
  fTitle: 19, fHead: 14, fPmo: 14.5, fBand: 13.3,
  lPmo: 17, lBand: 16,

function pic_font(px, bold, italic) { return (italic ? 'italic ' : '') + (bold ? 'bold ' : '') + px + 'px ' + PIC_FONT; }

function pic_cols(model) { return model.cols.filter(c => c.id !== 'nodate' || model.showNoDate); }
function pic_money(c) { return typeof c === 'number' && isFinite(c) ? SP.fmtM(c) : ''; }
function pic_pct(x) { return typeof x === 'number' && isFinite(x) ? SP.fmtPct(x) : ''; }
function pic_wrap(ctx, text, maxW) {
  const words = String(text).split(/\s+/).filter(w => w !== '');
  const lines = [];
  let cur = '';
  const push = w => {
    if (ctx.measureText(w).width <= maxW) return w;
    let piece = '';
    for (const ch of w) {
      if (piece && ctx.measureText(piece + ch).width > maxW) { lines.push(piece); piece = ch; } else piece += ch;
    }
    return piece;
  };
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (!cur || ctx.measureText(t).width <= maxW) { cur = cur ? t : push(w); continue; }
    lines.push(cur);
    cur = push(w);
  }
  if (cur || !lines.length) lines.push(cur);
  return lines;
}

function pic_rowsOf(block, opt) {
  if (!(opt && opt.pmo)) return block.pmoRows || [];
  const out = [];
  for (const n of block.tree || []) { if (n && n.kind === 'pmo') for (const c of n.children || []) out.push(c); else if (n) out.push(n); }
  return out;

SP.pictureName = function pictureName(block, opt) {
  const base = (block && block.apLabel ? block.apLabel : '') + ' FY' + (block ? block.fy : '');
  return opt && opt.pmo ? 'PMO ' + (opt.pmo.code || opt.pmo.label || '') + ' - ' + base : base;
};
function pic_layout(ctx, block, model, opt) {
  const isPmo = !!(opt && opt.pmo);
  const T = PIC_T;
  const V = pic_cols(model);
  const nNum = V.length + 2;
  const fPmoB = pic_font(T.fPmo, true), fBandB = pic_font(T.fBand, true), fPlan = pic_font(T.fBand, true, true);
  const cell = (t, align, font, ink, fill) => ({ t, align, font, ink, fill: fill || null });
  const closedFill = c => (c.closed ? PIC.closed : null);
  const rows = [];
  rows.push({ kind: 'head', cells: [cell(isPmo ? 'Requirement Title' : 'PMO', 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold), cell('Total', 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold)]
    .concat(V.map(c => cell(c.label, 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold)), [cell('Total', 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold)]) });
  for (const p of pic_rowsOf(block, opt)) {
    rows.push({ kind: 'pmo', cells: [cell(p.label, 'l', fPmoB, PIC.navy), cell(pic_money(p.total), 'r', fPmoB, PIC.navy)]
      .concat(V.map(c => cell(pic_money(p.cols[c.index]), 'r', fPmoB, PIC.navy, closedFill(c))), [cell(pic_money(p.total), 'r', fPmoB, PIC.navy)]) });
  }
  rows.push({ kind: 'spacer', cells: [] });
  const band = (label, tot, each) => ({ kind: 'band', cells: [cell(label, 'r', fBandB, PIC.navy), tot].concat(V.map(each), [tot]) });
  const plan = SP.plannedOf(block), sl = SP.slideOf(block);
  rows.push(band('Monthly Totals', cell(pic_money(plan), 'r', fBandB, PIC.navy),
    c => cell(pic_money(block.cols[c.index]), 'r', fBandB, PIC.navy, closedFill(c))));
  rows.push(band('Cumulative Totals', cell(pic_money(plan), 'r', fBandB, PIC.navy),
    c => cell(c.id === 'nodate' ? '' : pic_money(block.cum[c.index]), 'r', fBandB, PIC.navy, closedFill(c))));
  rows.push(band(SP.oblLabel(block, model),
    cell(pic_pct(sl.oblPct), 'c', fBandB, PIC.navy),
    c => {
      const o = block.obl[c.index] || {};
      return o.kind === 'plan' ? cell(pic_pct(o.v), 'c', fPlan, PIC.plan, closedFill(c)) : cell(pic_pct(o.v), 'c', fBandB, PIC.navy, closedFill(c));
    }));
  rows.push(band('OSD Goal %', cell(pic_pct(sl.goal), 'c', fBandB, PIC.navy), c => cell(pic_pct(block.goalC[c.index]), 'c', fBandB, PIC.navy, closedFill(c))));
  const st = (status, plan, c) => {
    if (!status || !PIC.status[status]) return cell('', 'c', fBandB, PIC.ink, c ? closedFill(c) : null);
    const word = SP.statusWord(status);
    if (plan) return cell(word, 'c', fPlan, PIC.statusInk[status], PIC.status[status]);

  rows.push(band('OSD Status', st(sl.status, false, null), c => { const s = block.statusC[c.index] || {}; return st(s.status, s.kind === 'plan', c); }));

  const widths = new Array(nNum + 1).fill(0);

    r.cells.forEach((c, j) => {
      if (!c.t) return;
      ctx.font = c.font;
      let w = ctx.measureText(c.t).width + 2 * T.padX + (c.swatch ? 14 : 0);
      if (j === 0) w = Math.min(w, T.labelMax);
      widths[j] = Math.max(widths[j], w);
    });
  }
  for (let j = 1; j <= nNum; j++) widths[j] = Math.max(widths[j], T.minNumW);
  widths[0] = Math.max(widths[0], 160);
  for (const r of rows) {
    if (r.kind === 'head') { r.h = T.headH; continue; }
    if (r.kind === 'spacer') { r.h = T.spacerH; continue; }
    const lab = r.cells[0];
    ctx.font = lab.font;
    lab.lines = pic_wrap(ctx, lab.t, widths[0] - 2 * T.padX);
    const lh = r.kind === 'pmo' ? T.lPmo : T.lBand;
    r.h = Math.max(T.rowH, lab.lines.length * lh + 6);

  }
  const title = isPmo ? 'PMO: ' + (opt.pmo.label || '') + ' - ' + (block.apLabel || '') + ' FY' + block.fy + ' - Spend Plan (slide-ready)'
    : (block.apLabel || '') + ' FY' + block.fy + ' - Spend Plan (PMO Summary, slide-ready)';
  ctx.font = pic_font(T.fTitle, true);
  const tableW = widths.reduce((a, b) => a + b, 0);
  const natW = Math.max(tableW, ctx.measureText(title).width + 2 * T.padX + 8);
  if (natW > tableW) widths[0] += natW - tableW;
  const natH = T.titleH + rows.reduce((a, r) => a + r.h, 0);

  const shown = SP.PIC_CUI === true && model.shown && !model.shown.all ? String(model.shown.text || '') : '';
  const top = PIC_CUI_BAND + (shown ? PIC_SHOWN_H : 0) + 4;
  const region = { x: PIC_MARGIN, y: top, w: PIC_W - 2 * PIC_MARGIN, h: PIC_H - PIC_CUI_BAND - 4 - top };
  let scale = region.w / natW, picH = PIC_H;
  if (natH * scale > region.h) {
    if (isPmo) { region.h = Math.ceil(natH * scale); picH = top + region.h + 4 + PIC_CUI_BAND; }
    else scale = region.h / natH;
  }
  const ox = region.x + (region.w - natW * scale) / 2, oy = region.y + (region.h - natH * scale) / 2;
  return { title, rows, widths, natW, natH, scale, ox, oy, region, shown, nCols: nNum + 1, picH,
    box: { x: ox, y: oy, w: natW * scale, h: natH * scale },
    edge: { top: { y: 0, h: PIC_CUI_BAND }, bottom: { y: picH - PIC_CUI_BAND, h: PIC_CUI_BAND } } };
}

function pic_text(ctx, c, x, y, w, h, lines, lh) {
  if (!c.t) return;
  ctx.font = c.font;
  ctx.fillStyle = c.ink;
  ctx.textBaseline = 'middle';
  const T = PIC_T;
  const ls = lines || [c.t];
  const first = y + h / 2 - ((ls.length - 1) * (lh || 0)) / 2;
  ls.forEach((t, i) => {
    const yy = first + i * (lh || 0);
    if (c.swatch) {
      const tw = ctx.measureText(t).width, sw = 10, all = sw + 4 + tw;
      const sx = x + (w - all) / 2;
      ctx.fillStyle = c.swatch;
      ctx.fillRect(sx, yy - sw / 2, sw, sw);
      ctx.strokeStyle = PIC.grid; ctx.lineWidth = 0.75;
      ctx.strokeRect(sx, yy - sw / 2, sw, sw);
      ctx.fillStyle = c.ink;
      ctx.textAlign = 'left';
      ctx.fillText(t, sx + sw + 4, yy);
      return;
    }
    if (c.align === 'l') { ctx.textAlign = 'left'; ctx.fillText(t, x + T.padX, yy); }
    else if (c.align === 'r') { ctx.textAlign = 'right'; ctx.fillText(t, x + w - T.padX, yy); }
    else { ctx.textAlign = 'center'; ctx.fillText(t, x + w / 2, yy); }

SP.takePlan = function takePlan(text, name) {

      + 'Taking the plan in “' + fname + '” (' + holds(aps, incBae) + saved + ') replaces it on this page: its pulls, earlier pulls' + andBae + ', import '
      + 'history, settings and last import report. This page’s own file is not changed until you Save.\n\nTake it?';

SP.takeSettings = function takeSettings(text, name) {

async function st_saveFile() {

  const fallback = (reason) => {

      + 'The shared copy is not updated until you put the download in its place (replace “' + name + '” with it). '
      + 'Until then this page counts the work as unsaved, and asks before it is closed.' };
  }

    catch (e) {

      const why = 'the file window could not open (' + st_err(e) + ')';

  const own = st_pageNameKnown();
  const other = picked && !!own && !st_sameName(fname, own);
  const cantRead = e => {
    if (!picked && e && e.name === 'NotFoundError') st_handle = null;

  };

    }

        } else {

                + 'Nothing was written. To keep both, use Save a copy…; to see ' + (after ? 'theirs' : 'it') + ', open the file.'
              : 'Not saved: “' + fname + '” holds no saved plan, so it is not the file this page was opened from, and you chose not to write to it. '

SP.saveCopy = async function saveCopy() {

async function st_saveCopy() {
  const suggested = st_copyName();
  const now = new Date().toISOString(), gen = st_gen;
  const html = st_htmlFor(Object.assign({}, SP.state, { savedAt: now }));
  const dl = reason => {
    const got = st_offerDownload('No copy was saved', reason, html, suggested, '');
    if (got === null) return null;
    st_copies.set(now, got);
    return { ok: true, message: 'The copy could not be written to a file: ' + reason + '. It was downloaded instead, as ' + st_dlName(got) + '. This page still saves to “'
      + st_pageName() + '”.' };
  };
  if (typeof window.showSaveFilePicker !== 'function') {
    const got = SP.download(suggested, html, 'text/html');
    st_copies.set(now, got);
    return { ok: true, message: 'A copy was downloaded as ' + st_dlName(got) + '. This page still saves to “' + st_pageName() + '”.' };
  }
  let h;
  try {
    h = await window.showSaveFilePicker({ suggestedName: suggested,
      types: [{ description: 'APEX (a new file)', accept: { 'text/html': ['.html', '.htm'] } }] });
  } catch (e) {
    if (st_abortish(e)) return { ok: false, message: 'No copy was saved: no file name was given.' };
    const why = 'the file window could not open (' + st_err(e) + ')';
    return dl(why) || { ok: false, message: 'No copy was saved: ' + why + '.' };
  }
  const cname = h.name || suggested;

    return dl(why) || { ok: false, message: 'No copy was saved: ' + why + '.' };
  }
  st_copies.set(now, cname);
  let own = false;
  if (st_handle && typeof h.isSameEntry === 'function') { try { own = await h.isSameEntry(st_handle); } catch (e) { own = false; } }
  if (own) { st_saved(now, gen, st_handle); return { ok: true, message: 'Saved to “' + cname + '” (this page’s own file).' }; }
  const pn = st_pageNameKnown();
  if (!st_handle && pn && st_sameName(cname, pn)) {
    return { ok: true, message: 'Saved a copy as “' + cname + '”, the name of this page’s own file. If it IS that file, it now has this work; '
      + 'this page cannot tell, so it still counts the work as unsaved. Save, and pick “' + pn + '”, to make sure: it will not ask about this copy.' };

    + (st_dirty ? ', which does not have this work yet: use Save for that.' : '.') };
}

  }).filter(Boolean).join('; ');

  };
  const kinds = [['changed', D.budgetsChanged, 'changed budget', 'changed budgets'], ['new', D.budgetsNew, 'budget new in this report', 'budgets new in this report'],
    ['gone', D.budgetsGone, 'budget gone from this report', 'budgets gone from this report'],

        + '</tbody></table></div>');
    }
  }
  out.push('</section>');
  return out.join('');
}

function ui_mText(c) {
  if (typeof c !== 'number' || !isFinite(c)) return '';
  const a = Math.abs(c), w = Math.floor(a / 1e8);
  let f = String(a % 1e8).padStart(8, '0').replace(/0+$/, '');
  if (f.length < 2) f = f.padEnd(2, '0');
  return (c < 0 ? '-' : '') + String(w).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + f;
}
function ui_readM(text) {
  const p = SP.parseAmount(text);
  if (p.how === 'blank') return { blank: true };
  if (p.cents === null) return { err: '“' + String(text).trim() + '” is not an amount in $M.' };
  const digits = String(text).replace(/[\s$,()+−-]/g, '');
  const n = Number(digits);
  if (!isFinite(n)) return { err: '“' + String(text).trim() + '” is not an amount in $M.' };
  const neg = /[-−(]/.test(String(text));
  const raw = n * 1e8;
  const cents = Math.round(raw);
  if (!Number.isSafeInteger(cents)) return { err: '“' + String(text).trim() + '” is too large.' };
  return { cents: neg && cents ? -cents : cents, rounded: Math.abs(raw - cents) > 1e-6 };
}
function ui_pctText(x) { return typeof x === 'number' && isFinite(x) ? String(Number((x * 100).toPrecision(12))) : ''; }

function ui_layout() {
  const E = ui.els;
  if (!E || !E.top || !E.main) return;
  try {
    const cui = document.querySelector('.cui-top');
    const pinned = ui_topPinned();
    const topH = Math.ceil((cui ? cui.offsetHeight : 0) + (pinned ? E.top.offsetHeight : (E.navBtn && !E.navBtn.hidden ? E.navBtn.offsetHeight : 0)));
    let headH = 0;
    for (const tw of E.main.querySelectorAll('.tw.treew')) {
      const t = tw.querySelector('table');
      if (!t) continue;
      const fit = t.offsetWidth <= tw.clientWidth + 1;
      tw.classList.toggle('fit', fit);
      tw.classList.toggle('box', !fit);
      if (fit && !headH) { const h = t.querySelector('thead'); headH = h ? Math.ceil(h.offsetHeight) : 0; }
    }
    for (const tw of E.main.querySelectorAll('.fsheet.tw')) {
      const t = tw.querySelector('table');
      if (!t) continue;
      const fit = pinned && t.offsetWidth <= tw.clientWidth + 1;
      tw.classList.toggle('fit', fit);
      if (fit && !headH) { const h = t.querySelector('thead'); headH = h ? Math.ceil(h.offsetHeight) : 0; }
    }
    const root = document.documentElement.style;
    root.setProperty('--topH', topH + 'px');
    root.setProperty('--theadH', headH + 'px');
    const prev = ui.topH;
    ui.topH = topH;
    if (prev && topH > prev) {
      ui_unhide(prev);
      const later = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : f => setTimeout(f, 16);
      later(() => ui_unhide(prev));
    }
  } catch (e) {   }
}
function ui_unhide(prev) {
  try {
    const E = ui.els, a = document.activeElement;
    if (!E || !a || a === document.body || a === document.documentElement || a === E.main || E.top.contains(a)) return;
    if (a.closest && a.closest('.cui')) return;
    const r = a.getBoundingClientRect();
    if (!r.width && !r.height) return;
    if (r.bottom > prev && r.top < ui.topH && r.top < (window.innerHeight || 0)) a.scrollIntoView({ block: 'nearest' });
  } catch (e) {   }
}
function ui_topPinned() {
  try { const E = ui.els; return !E || !E.top || getComputedStyle(E.top).position === 'sticky'; } catch (e) { return true; }
}
function ui_toTop() {
  try {
    const E = ui.els;
    if (!ui_topPinned() && E.shell) {
      const cui = document.querySelector('.cui-top'), ch = cui ? cui.offsetHeight : 0;
      const go = () => { try { window.scrollTo(0, Math.max(0, Math.round(E.shell.getBoundingClientRect().top + window.scrollY - ch))); } catch (e) {} };
      if (ui.pastTop) { go(); (typeof requestAnimationFrame === 'function' ? requestAnimationFrame : f => setTimeout(f, 16))(go); }
      else window.scrollTo(0, 0);
      return;
    }
    window.scrollTo(0, 0);
  } catch (e) {   }
}

async function ui_import(fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;
  await ui_busy('the import', async () => {
    ui_say('Reading ' + files.map(f => '“' + f.name + '”').join(', ') + '…', 'info');
    const plans = files.filter(f => /\.html?$/i.test(String(f.name)));
    if (plans.length) {
      if (files.length > 1) {
        ui_say('Nothing was imported: a saved plan (' + plans.map(f => '“' + f.name + '”').join(', ') + ') is taken on its own, never with pulls '
          + 'or another plan. Import it by itself.', 'err');
        return;
      }
      if (!ui_need('takePlan', 'Taking a saved plan')) return;
      const text = new TextDecoder('utf-8').decode(await files[0].arrayBuffer());
      const r = SP.takePlan(text, files[0].name);
      if (r && r.ok) {
        ui.refused = null;
        ui_invalidate();
        if (ui.view === 'help' || !UI_VIEWS.some(([id]) => id === ui.view)) ui.view = UI_HOME;
      }
      ui_say((r && r.message) || 'The plan was not taken.', r && r.ok ? 'ok' : 'err');
      ui_render();
      return;
    }
    if (!ui_need('parseFiles', 'Import')) return;
    const items = [];
    for (const f of files) items.push({ name: f.name, data: await f.arrayBuffer() });
    let parsed;
    try { parsed = await SP.parseFiles(items); }
    catch (e) {
      ui.refused = { message: (e && e.message) || String(e), report: (e && e.report) || null, at: new Date().toISOString() };
      ui_say((e && e.message) || String(e), 'err');
      ui_render();
      return;
    }
    if (!ui_need('applyImport', 'Import')) return;
    const r = await SP.applyImport(parsed);
    if (r && r.ok === false) {
      ui.refused = { message: r.message, report: parsed.report || null, at: new Date().toISOString() };
      ui_say(r.message, 'err');
      ui_render();
      return;
    }
    ui.refused = null;
    ui_invalidate();
    if (ui.view === 'help' || !UI_VIEWS.some(([id]) => id === ui.view)) ui.view = UI_HOME;
    ui_say((r && r.message) || 'Imported.', r && r.warn ? 'warn' : 'ok');
    ui_render();
  });

}

    const s = el.value === '' ? null : UI_SVC[Number(el.value)];
    if (s) cur.svc = s; else delete cur.svc;
  } else {
    const l = el.value === 'disc' || el.value === 'mand' ? el.value : null;
    if (l) cur.lane = l; else delete cur.lane;
  }
  if (cur.svc || cur.lane) all[b.key] = cur; else delete all[b.key];
  ui_setSettings({ budgets: all }, 'Budget “' + (b.name || '(blank)') + '”: ' + (what === 'svc' ? 'service ' + (cur.svc || 'by rule') : 'lane ' + (cur.lane ? SP.LANE_WORDS[cur.lane] : 'by rule')) + '.');
}

async function ui_picture(kind, i, pi) {
  const M = ui_model(), pb = pi === null || pi === undefined ? null : ui.reg.pblocks[pi];
  const b = pb ? pb.block : ui.reg.blocks[i], opt = pb ? { pmo: pb.pmo } : undefined;
  if (!M || !b) return;
  const what = pb ? SP.pictureName(b, opt) : b.apLabel + ' FY' + b.fy;
  if (kind === 'copy') {
    if (!ui_need('copyBlockPicture', 'Copy picture')) return;
    await ui_busy('copying the picture', async () => {
      ui_say('Drawing ' + what + '…', 'info');
      ui_result(await SP.copyBlockPicture(b, M, opt), 'The picture of ' + what + ' is on the clipboard.');
    });
  } else {
    if (!ui_need('blockPng', 'Save picture')) return;
    await ui_busy('saving the picture', async () => {
      const blob = await SP.blockPng(b, M, opt);
      const name = SP.download(pb ? what + '.png' : ui_pictureName(b), blob, 'image/png');
      ui_say('Saved “' + name + '” as a download: ' + SP.DOWNLOAD_WHERE, 'ok');
    });
  }
}
async function ui_zip() {
  const M = ui_model();
  if (!M) return;
  if (!ui_need('allPicturesZip', 'Save all pictures')) return;
  await ui_busy('saving the pictures', async () => {
    const nPic = M.blocks.length + (M.pmos || []).reduce((n, p) => n + p.blocks.length, 0);
    ui_say('Drawing ' + nPic + ' pictures…', 'info');
    const blob = await SP.allPicturesZip(M);
    const name = SP.download('APEX pictures FY' + M.E + ' - data through ' + M.asOfLabel + ' - ' + ui_today()
      + (M.shown.all ? '' : ' [filtered]') + '.zip', blob, 'application/zip');
    ui_say('Saved “' + name + '” (' + nPic + ' pictures) as a download: ' + SP.DOWNLOAD_WHERE, 'ok');
  });
}

function ui_onClick(ev) {
  const t = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t || !ui.els.app.contains(t) || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  const act = t.getAttribute('data-act');
  switch (act) {
    case 'view': {
      const v = t.getAttribute('data-v'), moved = v !== ui.view;
      ui.view = v;
      ui.navOpen = false;
      ui_render();
      if (moved) ui_toTop();
      break;
    }
    case 'navtoggle':
      ui.navOpen = !ui.navOpen;
      ui_renderBars();
      break;
    case 'helpgo': {
      ev.preventDefault();
      const h = document.getElementById('uiHelpS' + Number(t.getAttribute('data-s')));
      if (h) { try { h.focus({ preventScroll: true }); h.scrollIntoView({ block: 'start' }); } catch (e) {   } }
      break;
    }
    case 'skip':
      ev.preventDefault();
      try { ui.els.main.focus({ preventScroll: true }); ui.els.main.scrollIntoView({ block: 'start' }); } catch (e) {   }
      break;
    case 'manage':
      ui.manage = !ui.manage;
      ui_renderBars();
      break;
    case 'filt':
      ui.filtOpen = t.getAttribute('aria-expanded') !== 'true';
      ui_renderBars();
      break;
    case 'showall':
      ui_setView(SP.defaultView());
      ui_invalidate();
      ui.focusTo = 'filt';
      ui_render();
      ui_say('Every service and both lanes are counted again.', 'ok');
      break;
    case 'findsel':
      {
        const r = (ui.reqs || [])[Number(t.getAttribute('data-i'))];
        if (r) ui.find.sel = ui.find.sel === r.key ? '' : r.key;
      }
      ui_render();
      ui_findShow(false);
      break;
    case 'reqopen': {
      const r = (ui.reqs || [])[Number(t.getAttribute('data-i'))];
      if (r) { ui.find = ui_findNew({ sel: r.key }); ui_findJump(); }
      break;
    }
    case 'pmogo': {
      ui_pmoRemember(t.getAttribute('data-k') || ''); ui.pmo.fy = null;
      ui.view = 'mypmo'; ui_render(); ui_toTop();
      break;
    }
    case 'reqfind': {
      const ap = t.getAttribute('data-ap'), fy = t.getAttribute('data-fy');
      ui.find = ui_findNew({ q: t.getAttribute('data-q') || '', ap: ap || null, fy: fy || null });
      const M = ui_hasData() ? ui_model() : null, hit = M ? ui_findList(M) : [];
      if (hit.length === 1) ui.find.sel = hit[0].key;
      ui_findJump();
      break;
    }
    case 'listdl':
      ui_listDownload(t.getAttribute('data-l'));
      break;
    case 'findclear':
      ui.find = ui_findNew();
      ui.focusTo = 'findq';
      ui_render();
      break;
    case 'ovfy': {
      const f = t.getAttribute('data-fy');
      ui.ovFy = f === 'all' ? 'all' : Number(f);
      ui_render();
      break;
    }
    case 'help':
      if (ui.view === 'help') ui.view = ui.back || 'find';
      else { ui.back = ui.view; ui.view = 'help'; }
      ui_render();
      ui_toTop();
      break;
    case 'msgx': {
      ui_say('');
      const at = ui.els.nav.querySelector('[aria-pressed="true"]') || (ui.view === 'help' ? ui.els.help : null);
      (at || ui.els.main).focus({ preventScroll: true });
      break;
    }
    case 'import':
      if (!ui_fn('applyImport')) { ui_need('applyImport', 'Import'); break; }
      ui.els.file.click();
      break;
    case 'save': if (ui_need('saveFile', 'Save')) ui_busy('saving', async () => { ui_say('Saving…', 'info'); ui_result(await SP.saveFile(), 'Saved.'); ui_render(); }); break;
    case 'savecopy': if (ui_need('saveCopy', 'Save a copy')) ui_busy('saving a copy', async () => { ui_say('Saving a copy…', 'info'); ui_result(await SP.saveCopy(), 'Saved a copy.'); ui_render(); }); break;
    case 'export':
      if (!ui_hasData()) { ui_say('Import a CCaR pull first: there is nothing to export yet.', 'err'); break; }
      if (ui_need('exportExcel', 'Export Excel')) ui_busy('the export', async () => { ui_say('Writing the workbook…', 'info'); ui_result(await SP.exportExcel(), 'The workbook was written.'); });
      break;
    case 'ordreset': ui_ordReset(t.getAttribute('data-b')); ui_say('That table is back in the standard order: PMOs as listed, titles largest first.', 'ok'); ui_render(); break;
    case 'fullscreen': ui_fullscreen(); break;
    case 'tg': {
      const n = ui.reg.nodes.get(t.getAttribute('data-id'));
      if (!n) break;
      if (!ui.open.has(n.scope)) ui.open.set(n.scope, new Map());
      ui.open.get(n.scope).set(n.pk, t.getAttribute('aria-expanded') !== 'true');
      ui_render();
      break;
    }
    case 'copypic': ui_picture('copy', Number(t.getAttribute('data-b')), t.hasAttribute('data-p') ? Number(t.getAttribute('data-p')) : null); break;
    case 'savepic': ui_picture('save', Number(t.getAttribute('data-b')), t.hasAttribute('data-p') ? Number(t.getAttribute('data-p')) : null); break;
    case 'zip': ui_zip(); break;
    case 'pubdoc': ui_pubDownload(t.getAttribute('data-k'), t.getAttribute('data-m')); break;
    case 'pubzip': ui_pubZip(t.getAttribute('data-m')); break;
    case 'viewcopy': ui_viewCopy(); break;
    case 'ufropen': { const k = t.getAttribute('data-k'); ui.ufr.open = ui.ufr.open === k ? '' : k; ui_render(); break; }
    case 'ufrclear': ui.ufr = { pmo: null, ap: null, fy: null, status: null, kind: null, q: '', open: '' }; ui_render(); break;
    case 'ufrkind': { const v = t.getAttribute('data-v') || ''; ui.ufr.kind = v === '' ? null : v; ui_render(); break; }
    case 'srrbclear': ui.srrb = { pmo: null, ap: null, fy: null, q: '' }; ui_render(); break;
    case 'ufrap': { const v = t.getAttribute('data-v') || ''; ui.ufr.ap = v === '' ? null : v; ui_render(); break; }
    case 'ufrreset': {
      const gk = t.getAttribute('data-g');
      if (ui_fn('setUfrRank') && SP.setUfrRank(gk, null)) ui_say('That list is back in the tracker’s ranks; your ranking of it was taken off.', 'ok');
      ui_render(); break;
    }
    case 'ufrforget': {
      const st = ui_state() || {}, X = SP.ufrRanked(ui_pubState().lists, st.ufrRank);
      let n = 0;
      for (const gk of Object.keys(st.ufrRank || {})) {
        const g = X.groups[gk], have = new Set(g ? g.order : []), keep = (st.ufrRank[gk] || []).filter(e => have.has(e.k));
        n += (st.ufrRank[gk] || []).length - keep.length;
        SP.setUfrRank(gk, keep.length ? keep : null);
      }
      ui_say(SP.fmtInt(n) + ' line' + (n === 1 ? '' : 's') + ' no longer on the tracker ' + (n === 1 ? 'was' : 'were') + ' taken out of your ranking.', 'ok');
      ui_render(); break;
    }
    case 'lastpick': { const f = document.getElementById('uiLastFile'); if (f) f.click(); break; }
    case 'ufrpick': { const f = document.getElementById('uiUfrFile'); if (f) f.click(); break; }
    case 'descpick': { const f = document.getElementById('uiDescFile'); if (f) f.click(); break; }
    case 'embpick': { const f = document.getElementById('uiEmbFile'); if (f) f.click(); break; }
    case 'embdel': if (ui_need('setPublish', 'Emblem')) { SP.setPublish({ emblem: null }); ui_say('The built-in emblem is printed again.', 'ok'); ui_render(); } break;
    case 'ufrdel': {
      const fy = t.getAttribute('data-fy');
      if (ui_need('removeUfr', 'Remove') && SP.removeUfr(fy)) { ui_say('The FY' + fy + ' unfunded list was removed. Required on FY' + fy + ' lines is Approved again.', 'ok'); ui_render(); }
      break;
    }
    case 'naclear': ui.naF = { ap: '', fy: '', pmo: '', pmoLabel: '' }; ui_render(); break;
    case 'diff': {
      const k = ui.reg.diff[Number(t.getAttribute('data-i'))];
      if (k) { if (ui.diffOpen.has(k)) ui.diffOpen.delete(k); else ui.diffOpen.add(k); ui_render(); }
      break;
    }
    case 'goalreset': ui_setSettings({ goals: SP.goalsDefault() }, 'Goals reset to v12’s curves.'); break;
    case 'specadd': ui_specAdd(); break;
    case 'specdel': {
      const s = ui.reg.special[Number(t.getAttribute('data-i'))];
      if (s === undefined) break;
      const cur = (Array.isArray(ui_settings().special) ? ui_settings().special : []).filter(x => x !== s);
      const i = Number(t.getAttribute('data-i'));
      ui.focusTo = cur.length ? 'specdel:' + Math.min(i, cur.length - 1) : 'specnew';
      ui_setSettings({ special: cur }, '“' + s + '” is no longer a special CCaR.');
      break;
    }
    case 'specreset': ui_setSettings({ special: SP.SPECIAL_CCARS_DEFAULT.slice() }, 'Special CCaRs reset to ' + SP.SPECIAL_CCARS_DEFAULT.join(', ') + '.'); break;
  }
}
function ui_onChange(ev) {
  const t = ev.target;
  if (!t || !ui.els) return;
  if (t === ui.els.file) { ui_import(t.files); return; }
  if (t === ui.els.asOf) { ui_asOfChanged(); return; }
  if (t === ui.els.first) { ui_firstChanged(); return; }
  const act = t.getAttribute && t.getAttribute('data-act');
  switch (act) {
    case 'lastfile': ui_lastImport(t.files); return;
    case 'ufrfile': ui_ufrImport(t.files); return;
    case 'descfile': ui_descImport(t.files); return;
    case 'embfile': ui_embImport(t.files); return;
    case 'pubfy': {
      const R = ui_pubReady(), all = R ? R.D.allFys : [], y = Number(t.getAttribute('data-fy'));
      const cur = new Set(ui.pub.fys === null ? all : ui.pub.fys);
      if (t.checked) cur.add(y); else cur.delete(y);
      ui.pub.fys = all.every(x => cur.has(x)) ? null : all.filter(x => cur.has(x));
      ui_render(); return;
    }
    case 'pubmiss': ui.pub.miss = !!t.checked; ui_render(); return;
    case 'pubnoemb': if (ui_need('setPublish', 'Emblem')) { SP.setPublish({ noEmblem: !!t.checked }); ui_render(); } return;
    case 'pubdesc': if (ui_need('setPublish', 'Descriptions')) { SP.setPublish({ desc: { [t.getAttribute('data-k')]: t.value } }); ui_render(); } return;
    case 'pubfm': if (ui_need('setPublish', 'Publish')) { SP.setPublish({ fm: { [t.getAttribute('data-ap')]: t.value } }); ui_render(); } return;
    case 'pubhead': if (ui_need('setPublish', 'Publish')) { SP.setPublish({ [t.getAttribute('data-f')]: t.value }); ui_render(); } return;
    case 'calf': case 'chf': {
      const f = t.getAttribute('data-f');
      if (f === 'pmo' || f === 'ap' || f === 'fy' || (f === 'ipt' && act === 'chf')) { ui[act === 'chf' ? 'ch' : 'cal'][f] = t.value === UI_FIND_ALL ? null : t.value.slice(1); ui_render(); }
      return;
    }
    case 'ufrrank': { const e = ui.reg.ufr && ui.reg.ufr[Number(t.getAttribute('data-i'))]; if (e) ui_ufrRank(e, t.value); return; }
    case 'ufrmx': case 'ufrms': {
      const e = ui.reg.ufrMand && ui.reg.ufrMand[Number(t.getAttribute('data-i'))], f = act === 'ufrmx' ? 'exec' : 'sfcb';
      if (e && ui_fn('setUfrMandStatus') && SP.setUfrMandStatus(e.key, f, t.value)) ui_say((f === 'exec' ? 'Exec ready?' : 'SFCB action') + ' for “' + e.title + '” is ' + (String(t.value).trim() ? '“' + String(t.value).trim() + '”' : 'blank') + '. Save to keep it in this page’s file.', 'ok');
      ui_render(); return;
    }
    case 'ufrmand': {
      if (ui_fn('setUfrMandatory') && SP.setUfrMandatory(t.checked === true))
        ui_say(t.checked ? 'Mandatory plan events are listed as unfunded on this page. The spend plan pages and the PDFs are not changed.' : 'Mandatory plan events are no longer listed as unfunded: the list is the UFR tracker alone.', 'ok');
      ui_render();
      return;
    }
    case 'srrbf': {
      const f = t.getAttribute('data-f');
      if (['pmo', 'ap', 'fy'].includes(f)) { ui.srrb[f] = t.value === UI_FIND_ALL ? null : t.value.slice(1); ui_render(); }
      return;
    }
    case 'ufrf': {
      const f = t.getAttribute('data-f');
      if (['pmo', 'ap', 'fy', 'status'].includes(f)) { ui.ufr[f] = t.value === UI_FIND_ALL ? null : t.value.slice(1); ui_render(); }
      return;
    }
    case 'pmof': {
      const f = t.getAttribute('data-f');
      if (f === 'fy') ui.pmo.fy = t.value === UI_FIND_ALL ? null : t.value.slice(1);
      else if (f === 'pmo') ui_pmoRemember(t.value.slice(1));
      else if (f === 'win') ui.pmo.win = Number(t.value.slice(1)) || 3;
      else return;
      ui_render();
      return;
    }
    case 'findf': {
      const f = t.getAttribute('data-f');
      if (f === 'pmo' || f === 'ap' || f === 'fy' || f === 'st') { ui.find[f] = t.value === UI_FIND_ALL ? null : t.value.slice(1); ui_render(); }
      else if (f === 'ord') { const v = t.value.slice(1); ui.find.ord = UI_FIND_ORD.some(o => o[0] === v) ? v : ''; ui_render(); }
      return;
    }
    case 'svc': case 'lane': {
      const v = ui_copy(ui_view()) || {};
      if (act === 'svc') { const s = UI_SVC[Number(t.getAttribute('data-i'))]; if (!s) return; (v.svc = v.svc || {})[s] = !!t.checked; }
      else { const l = t.getAttribute('data-l'); if (l !== 'disc' && l !== 'mand') return; (v.lane = v.lane || {})[l] = !!t.checked; }
      ui_setView(v);
      ui_invalidate();
      ui_render();
      break;
    }
    case 'lvl': {
      const scope = ui.reg.scopes[Number(t.getAttribute('data-s'))];
      const n = Number(t.value);
      if (!scope || !(n >= 1 && n <= 4)) return;
      ui.level.set(scope, n);
      ui.open.delete(scope);
      ui_render();
      break;
    }
    case 'pmo': { const k = ui.reg.pmos[Number(t.value)]; if (k !== undefined) { if (SP.PMO_LINKS === false) ui.pmoKey = k; else ui_pmoRemember(k); ui_render(); } break; }
    case 'ipt': { const k = t.value === '' ? null : ui.reg.ipts && ui.reg.ipts[Number(t.value)]; ui.ipt = k === undefined ? null : k; ui.iptPmo = ui.pmoKey; ui_render(); break; }
    case 'naf': {
      const f = t.getAttribute('data-f');
      if (f === 'ap') ui.naF.ap = t.value;
      else if (f === 'fy') ui.naF.fy = t.value;
      else if (f === 'pmo') {
        ui.naF.pmo = t.value === '' ? '' : (ui.reg.naPmos[Number(t.value)] ?? '');
        ui.naF.pmoLabel = t.value === '' ? '' : (ui.reg.naPmoLabels[Number(t.value)] ?? '');
      }
      ui_render();
      break;
    }
    case 'goal': ui_goalChanged(t); break;
    case 'auth': ui_authChanged(t); break;
    case 'bsvc': ui_budgetChanged(t, 'svc'); break;
    case 'blane': ui_budgetChanged(t, 'lane'); break;
  }
}
function ui_fsSync() {
  const b = ui.els && ui.els.fs;
  if (!b) return;
  const can = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen), on = !!document.fullscreenElement;
  b.hidden = !can;
  b.textContent = on ? 'Exit full screen' : 'Full screen';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.title = on ? 'Leave full screen (Esc also leaves it)' : 'Fill the screen with APEX; Esc leaves full screen';
}
function ui_fullscreen() {
  try {
    if (document.fullscreenElement) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
    else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => ui_say('This browser did not allow full screen here.', 'err')); }
  } catch (e) { ui_say('This browser did not allow full screen here.', 'err'); }
}
function ui_onKey(ev) {
  if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
    const r = ui_ordRowOf(ev.target);
    if (r && r.e && r.e.kind === 'ufr') {
      ev.preventDefault();
      const up = ev.key === 'ArrowUp', isLine = x => x.hasAttribute('data-o') && ui.reg.ord[Number(x.getAttribute('data-o'))] && ui.reg.ord[Number(x.getAttribute('data-o'))].slot === r.e.slot;
      let x = r.tr;
      do x = up ? x.previousElementSibling : x.nextElementSibling; while (x && !isLine(x) && !x.classList.contains('ugrp') && !x.classList.contains('usub'));
      const t = x && isLine(x) ? ui.reg.ord[Number(x.getAttribute('data-o'))] : null;
      if (t) ui_ordDrop(r.e, t, !up);
      return;
    }
    if (r && r.e) { ev.preventDefault(); ui_ordMove(r.e, r.e.keys.indexOf(r.e.key) + 1 + (ev.key === 'ArrowUp' ? -1 : 1)); return; }
  }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'uiSpecNew') { ev.preventDefault(); ui_specAdd(); }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'uiFindQ' && ui_hasData()) {
    const M = ui_model(), first = M ? ui_findList(M)[0] : null;
    if (first) { ev.preventDefault(); ui.find.sel = first.key; ui_render(); ui_findShow(false); }
  }
}

function ui_boot() {
  if (ui.els) return;
  let r = null;
  if (ui_fn('storeInit')) {
    try { r = SP.storeInit(); }
    catch (e) { r = { ok: false, message: 'The saved data could not be opened: ' + ((e && e.message) || e) }; }
  } else r = { ok: false, message: 'The store is not available yet (SP.storeInit is missing), so nothing can be imported or saved.' };
  ui_skeleton();
  ui.manage = !ui_hasData() && !ui_vo();
  const app = ui.els.app;
  app.addEventListener('click', ui_onClick);
  app.addEventListener('change', ui_onChange);
  app.addEventListener('input', ev => { if (ev.target && ev.target.id === 'uiFindQ') { ui.find.q = ev.target.value; ui_findRedraw(); }
    else if (ev.target && ev.target.id === 'uiUfrQ') { ui.ufr.q = ev.target.value; ui_ufrRedraw(); }
    else if (ev.target && ev.target.id === 'uiSrrbQ') { ui.srrb.q = ev.target.value; ui_srrbRedraw(); } });
  app.addEventListener('keydown', ui_onKey);
  app.addEventListener('toggle', ui_naToggle, true);
  window.addEventListener('beforeprint', () => ui_naPrint(true));
  window.addEventListener('afterprint', () => ui_naPrint(false));
  ui_dragWire(app);
  document.addEventListener('fullscreenchange', ui_fsSync);
  app.addEventListener('focusout', ev => { if (ui.els && ev.target === ui.els.asOf) ui_asOfLeft(); });
  if (ui_fn('onStateChange')) { try { SP.onStateChange(ui_stateChanged); } catch (e) {} }
  window.addEventListener('resize', ui_layout);
  if (typeof ResizeObserver === 'function') { try { new ResizeObserver(() => ui_layout()).observe(ui.els.top); } catch (e) {} }
  ui_render();
  const off = ui_hasData() ? ui_offWords(ui_model()) : '';
  const plain = r && r.message && ui_vo() && r.ok !== false;
  if (r && r.message && !plain) ui_say(r.message + (off ? ' ' + off : ''), r.ok === false ? 'err' : off ? 'warn' : 'info');
  else if (off) ui_say(off, 'warn');
  window.addEventListener('beforeprint', ui_printPicks);
}
SP.uiRender = function uiRender() { ui_invalidate(); ui_render(); };
SP.say = ui_say;
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui_boot);
else ui_boot();
