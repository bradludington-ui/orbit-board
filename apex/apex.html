    if (!u || typeof u !== 'object') continue;
    const raw = u.raw && typeof u.raw === 'object' ? u.raw : {};
    const val = (k, v, dflt, f) => {
      const h = colName(k, dflt);
      return h + ' ' + (Object.prototype.hasOwnProperty.call(raw, h) ? imp_q(String(raw[h])) : f(v));
    };
    L.push('    ' + imp_where(at) + ' row ' + u.row + ': ' + arr(u.reasons).map(String).join('; ') + '. The row: '
      + colName(0, 'Budget Name') + ' ' + imp_q(String(u.name ?? '')) + ', '
      + val(1, u.fy, 'Budget FY', v => (typeof v === 'number' ? String(v) : 'blank')) + ', '
      + val(2, u.approved, 'Budget Approved Amount', usd) + ', ' + val(3, u.authorized, 'Budget Authorized Amount', usd) + '.');
  }
  const xo = arr(b.extraOnly);
  if (xo.length) {
    L.push('  Rows skipped because none of the four columns read holds anything, though another column does (their text is here, '
      + 'and in no figure): ' + SP.fmtInt(xo.length) + '.');
    for (const x of xo) if (x && typeof x === 'object') {
      L.push('    ' + imp_where(at) + ' row ' + x.row + ': ' + arr(x.values).map(p => (Array.isArray(p) ? String(p[0]) + ' ' + imp_q(String(p[1])) : '')).join(', ') + '.');
    }
  }
  const t = b.total && typeof b.total === 'object' ? b.total : null;
  if (!t) {
    L.push('  Total row: none found (a row with no Budget Name and no FY that holds amounts, after the last budget row), so the rows '
      + 'were not checked against the report’s own total.');
  } else {
    const fig = (v, k, dflt) => (typeof v === 'number' ? SP.fmtUsd(v)
      : 'that could not be read (' + imp_q(String(t.raw && typeof t.raw === 'object' ? t.raw[colName(k, dflt)] ?? '' : '')) + ')');
    L.push('  Total row (row ' + t.rowNo + ', the report’s own, never counted): Approved ' + fig(t.approved, 2, 'Budget Approved Amount')
      + ', Authorized ' + fig(t.authorized, 3, 'Budget Authorized Amount') + '. The readable rows add up to Approved ' + usd(t.sumApproved)
      + ' and Authorized ' + usd(t.sumAuthorized) + ': ' + (t.ok ? 'it agrees (within $1 each).'
        : 'it differs, the total less the rows being ' + signed(t.diffApproved) + ' on Approved and ' + signed(t.diffAuthorized) + ' on Authorized'
          + (bad.length ? ' (the unreadable rows are not in the rows’ sum)' : '') + '.'));
  }
}

// THE BAE REPORT ON SCREEN THAT THE LAST IMPORT DID NOT BRING. Only the last import's report is kept (CONTRACT §11), so after
// an import of pulls alone the report's own section, and with it its unreadable rows, would be listed nowhere, as the pulls'
// were before keptPullLines (review IMP-2). These lines are worked out from the stored report, every row of which keeps
// its sheet, row number, reasons and text as written; the blank rows and conversions were the import's and are not said.
//   bae     SP.state.bae.current (or null);  report  the last import's report (or null)
SP.baeKeptLines = function baeKeptLines(bae, report) {
  const L = [];
  const b = bae && typeof bae === 'object' && !Array.isArray(bae) && Array.isArray(bae.rows) ? bae : null;
  if (!b) return L;
  // the last import's own report: its section is already in that import's report
  if (report && report.bae && typeof report.bae === 'object' && typeof b.importedAt === 'string' && report.importedAt === b.importedAt) return L;
  const okNum = v => typeof v === 'number' && Number.isSafeInteger(v);
  let readable = 0, approved = 0, authorized = 0;
  const unreadable = [], obbba = imp_baeObbbaCount(b);
  for (const r of b.rows) {
    if (!r || !Array.isArray(r.c)) continue;
    if (Array.isArray(r.bad) && r.bad.length) {
      unreadable.push({ row: Array.isArray(r.src) && r.src[2] !== undefined ? r.src[2] : '?', reasons: r.bad, name: r.c[0], fy: r.c[1],
        approved: r.c[2], authorized: r.c[3], raw: r.raw && typeof r.raw === 'object' ? r.raw : {} });
    } else if (okNum(r.c[2]) && okNum(r.c[3])) { readable++; approved += r.c[2]; authorized += r.c[3]; }
  }
  const t = b.total && typeof b.total === 'object' ? b.total : null;
  const dA = t && okNum(t.approved) ? t.approved - approved : null, dU = t && okNum(t.authorized) ? t.authorized - authorized : null;
  imp_baeLines(L, { file: b.file, sheet: b.sheet, stamp: b.stamp, cols: SP.baeCols(b), columns: Array.isArray(b.headers) ? b.headers.length : 0,
    rowsRead: b.rows.length, readable, cents: { approved, authorized }, unreadable, obbba,
    total: t ? { rowNo: t.rowNo, approved: okNum(t.approved) ? t.approved : null, authorized: okNum(t.authorized) ? t.authorized : null,
      sumApproved: approved, sumAuthorized: authorized, diffApproved: dA, diffAuthorized: dU, raw: t.raw,
      ok: dA !== null && dU !== null && Math.abs(dA) <= 100 && Math.abs(dU) <= 100 } : null },
    typeof b.importedAt === 'string' ? b.importedAt : '');
  return L;
};

// THE ROWS WHOSE APPROPRIATION IS NOT IDENTIFIED, one line each. They are on no raw sheet (§8.7 has one per appropriation),
// and the Summary's note sends the reader to the Import report for them, which gave only their count and dollars: a reader
// could not find which rows they were (review XP-8). Each is named by where it was, and by what identifies it.
//   pulls   the current pulls
SP.unidentifiedLines = function unidentifiedLines(pulls) {
  const L = [];
  const p = pulls && typeof pulls === 'object' ? pulls.unidentified : null;
  if (!p || typeof p !== 'object' || !Array.isArray(p.rows) || !p.rows.length) return L;
  const files = Array.isArray(p.files) ? p.files.filter(f => f && typeof f === 'object') : [];
  // src[0] is the file's place in its IMPORT, not in this pull's file list (which holds only the files these rows came
  // from), so a row is matched to its file by its sheet's name; two files with a sheet of that name are both named
  const fileOf = r => {
    const sh = Array.isArray(r.src) ? String(r.src[1]) : '';
    const fs = files.length === 1 ? files : files.filter(f => Array.isArray(f.sheets) && f.sheets.map(String).includes(sh));
    return fs.length === 1 ? String(fs[0].name) : files.length ? 'one of ' + files.map(f => String(f.name)).join(', ') : 'a file not recorded';
  };
  const t = (r, k) => { const v = r.c[k]; return v === null || v === undefined ? '' : String(v); };
  L.push('Rows whose appropriation is not identified (their Budget names none, nor does their sheet), counted nowhere: ' + SP.fmtInt(p.rows.length) + '.');
  for (const r of p.rows) {
    if (!r || !Array.isArray(r.c)) continue;
    const raw = r.raw && typeof r.raw === 'object' ? r.raw : {};
    const fy = typeof r.c[IMP_FY] === 'number' ? 'FY' + r.c[IMP_FY] : 'FY ' + imp_q(Object.prototype.hasOwnProperty.call(raw, 'FY') ? String(raw.FY) : '') + ' not read';
    const amt = typeof r.c[IMP_AMT] === 'number' ? SP.fmtUsd(r.c[IMP_AMT]) : 'amount ' + imp_q(Object.prototype.hasOwnProperty.call(raw, 'Amount') ? String(raw.Amount) : '') + ' not read';
    L.push('  ' + imp_where({ file: fileOf(r), sheet: Array.isArray(r.src) && r.src[1] !== undefined ? String(r.src[1]) : '?' })
      + ' row ' + (Array.isArray(r.src) && r.src[2] !== undefined ? r.src[2] : '?') + ': CCaR ' + imp_q(t(r, IMP_CCAR)) + ', Title ' + imp_q(t(r, IMP_TITLE))
      + ', Budget ' + imp_q(t(r, IMP_BUDGET)) + ', Plan Event ' + imp_q(t(r, IMP_PE)) + ', ' + fy + ', ' + amt + '.');
  }
  return L;
};

// THE PULLS ON SCREEN THAT THE LAST IMPORT DID NOT BRING. Only the last import's report is kept (CONTRACT §11), but an
// appropriation it did not replace keeps its pull, and with it any rows that count nowhere. The Summary names those rows
// and sends the reader to the Import report, which (being the last import's) listed none of them and said "Unreadable
// rows: none." (review IMP-2). These lines are worked out from the pulls themselves, every row of which keeps its sheet,
// row number, reasons and raw text, so whatever the report a pull came with, what it holds is listed with it.
//   pulls   the current pulls; report  the last import's report (or null)
SP.keptPullLines = function keptPullLines(pulls, report) {
  const L = [];
  if (!pulls || typeof pulls !== 'object') return L;
  const by = report && report.byAp && typeof report.byAp === 'object' && !Array.isArray(report.byAp) ? report.byAp : {};
  const at = report ? report.importedAt : undefined;
  for (const ap of IMP_AP_IDS.concat(['unidentified'])) {
    const p = pulls[ap];
    if (!p || typeof p !== 'object' || !Array.isArray(p.rows)) continue;
    // unidentified rows carry no import time of their own: they are the last import's whenever its report counts some
    if (Object.prototype.hasOwnProperty.call(by, ap) && (ap === 'unidentified' || p.importedAt === at)) continue;
    const files = Array.isArray(p.files) ? p.files.filter(f => f && typeof f === 'object') : [];
    const fileOf = r => (files.length === 1 ? String(files[0].name) : files.length ? 'one of ' + files.map(f => String(f.name)).join(', ') : 'a file not recorded');
    const where = r => imp_where({ file: fileOf(r), sheet: Array.isArray(r.src) && r.src[1] !== undefined ? String(r.src[1]) : '?' })
      + ' row ' + (Array.isArray(r.src) && r.src[2] !== undefined ? r.src[2] : '?');
    let cents = 0;
    const bad = [], dates = [];
    for (const r of p.rows) {
      if (!r || !Array.isArray(r.c)) continue;
      const amt = r.c[IMP_AMT];
      if (Array.isArray(r.bad) && r.bad.length) bad.push(r);
      else if (typeof amt === 'number') cents += amt;
      const raw = r.raw && typeof r.raw === 'object' ? r.raw : {};
      for (const h of ['Month', 'Date']) if (Object.prototype.hasOwnProperty.call(raw, h)) dates.push([r, h, raw[h]]);
    }
    const src = files.map(f => (Array.isArray(f.sheets) && f.sheets.length ? f.sheets : ['?']).map(sn => imp_where({ file: String(f.name), sheet: String(sn) })).join(', ')).join(', ');
    if (ap === 'unidentified') {
      L.push(imp_apLabel(ap) + ': ' + imp_plural(p.rows.length, 'row') + ', ' + SP.fmtUsd(cents) + (src ? ', from ' + src : '') + ', counted nowhere.');
    } else {
      L.push(imp_apLabel(ap) + ': ' + imp_plural(p.rows.length, 'row') + ', ' + SP.fmtUsd(cents)
        + (bad.length ? ' (plus ' + imp_plural(bad.length, 'unreadable row') + ', counted in no figure)' : '')
        + ', imported ' + (typeof p.importedAt === 'string' && p.importedAt ? imp_localWhen(p.importedAt) : 'at a time not recorded') + (src ? ', from ' + src : '') + '.');
    }
    if (bad.length) {
      L.push('  Unreadable rows (kept, counted in no figure): ' + SP.fmtInt(bad.length) + '.');
      for (const r of bad) {
        const amt = r.c[IMP_AMT];
        L.push('    ' + where(r) + ': ' + r.bad.map(String).join('; ') + (typeof amt === 'number' ? '; amount ' + SP.fmtUsd(amt) : '') + '.');
      }
    }
    imp_dateLines(L, '  ', dates.filter(([, h]) => h === 'Date').map(([r, h, v]) => where(r) + ': ' + h + ' ' + imp_q(String(v)) + '.'),
      dates.filter(([, h]) => h === 'Month').map(([r, h, v]) => where(r) + ': ' + h + ' ' + imp_q(String(v)) + '.'));
  }
  return L;
};

// ===== 40-engine.js =====
// §4–§6 ENGINE — the model. Every figure on every screen, sheet and picture is read from SP.buildModel's result, so a
// screen and the workbook cannot disagree about a dollar: there is one place each figure is worked out (CONTRACT §4–§6).
//
// Two rules govern every line below:
//   - Money is whole CENTS and is only ever added as integers. A float of dollars summed over a few thousand rows drifts
//     by fractions of a cent, and then a tree whose children "add to the parent" fails by 0.0000001 and nobody can say
//     which figure is right.
//   - The model is built from SP.deriveRow's output and nothing else, so a rule fixed in the import (a service rule, a
//     status pattern) applies to every pull already saved the next time the page draws.

const ENG_COL_IDS = ['prior', 'm1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9', 'm10', 'm11', 'm12', 'next', 'nodate'];
const ENG_NC = 15, ENG_NEXT = 13, ENG_NODATE = 14;          // prior is 0, m1..m12 are 1..12
const ENG_AP_IDS = SP.APS.map(a => a.id);
const ENG_AP_LABEL = Object.fromEntries(SP.APS.map(a => [a.id, a.label]));
const ENG_AP_TYPE = Object.fromEntries(SP.APS.map(a => [a.id, a.type]));
const ENG_PMO_TAB_ORDER = ['ff', 'sp', 'om', 'opn'];   // v12's PMO tabs list Full Fund first (§4.6, §8.6)
const ENG_LANES = ['disc', 'mand'];
const ENG_ALL_SVC = SP.SERVICES.concat([SP.SVC_UNKNOWN]);
const ENG_BLANK = { pmo: '(no PMO)', title: '(no title)', pe: '(no plan event)', ccar: '(no CCaR)' };
const ENG_KINDS = ['pmo', 'title', 'pe', 'ccar'];
const ENG_PMO_RANK = new Map(SP.PMO_ORDER.map((p, i) => [SP.normKey(p), i]));
const ENG_EPS = 1e-12;
const ENG_ISO = /^(\d{4})-(\d{2})-\d{2}$/;
function eng_zeros() { return new Array(ENG_NC).fill(0); }
// plain code-unit order: the same on every machine. localeCompare would sort "(no PMO)" and accented names differently
// in different browsers, and then two people's exports would list the same PMOs in different orders.
function eng_cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
function eng_own(o, k) { return !!o && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k); }

// ---------------------------------------------------------------------------------------------------------------
// PUBLIC CONSTANTS AND SMALL HELPERS (for the screens, the workbook and the pictures, so each prints the same words)
// ---------------------------------------------------------------------------------------------------------------
SP.COL_IDS = Object.freeze(ENG_COL_IDS.slice());
SP.LANE_WORDS = Object.freeze({ disc: 'Discretionary', mand: 'Mandatory' });
// a colour never stands alone (§4.5): each status has its word, and the legend says what the colours mean
SP.STATUS_WORDS = Object.freeze({ green: 'On track', yellow: 'Within 10', red: 'Behind' });
SP.STATUS_LEGEND = Object.freeze([
  Object.freeze({ status: 'green', colour: 'Green', word: 'On track', meaning: 'at or above the OSD goal' }),
  Object.freeze({ status: 'yellow', colour: 'Yellow', word: 'Within 10', meaning: 'within 10 points of it' }),
  Object.freeze({ status: 'red', colour: 'Red', word: 'Behind', meaning: 'more than 10 points behind' })]);
SP.STATUS_LEGEND_TEXT = 'Green — at or above the OSD goal; Yellow — within 10 points of it; Red — more than 10 points behind.';
SP.statusWord = function statusWord(status) { return eng_own(SP.STATUS_WORDS, status) ? SP.STATUS_WORDS[status] : ''; };

// §4.5 and §4.3: the mark beside an Authorized figure, and what it means. An entered Authorized is typed for an
// appropriation and FY as a whole, so no switch can reach it; printed unmarked beside an Approved the switches have cut,
// it read on the real pull as a gap of over a billion dollars that was only the switch (review R3). The mark sits beside the figure,
// on every product, because a note three screens down is not where a reader looks.
// A TOTAL carries each mark its rows carry (SP.authMarks), so the words for † read true beside a total too: a total
// adds in Approved for every row marked †.
SP.AUTH_MARK_TEXT = Object.freeze({
  '†': 'Authorized was not entered; Approved is shown in its place (on a total, for the rows marked †).',
  '‡': 'Authorized as entered, for the appropriation and FY as a whole: it covers every service and lane, while the switches show only some.',
  // §14.5: printed only with a BAE report loaded, beside an Approved the report has no figure for
  '§': 'Approved is the CCaR plan: the BAE report has no figure for this block.',
});
// §14.5: with a BAE report loaded an Authorized can also come from the report, so † no longer means only "not entered",
// and ‡ is on every entered figure, whatever the switches (answer 8: a typed Authorized wins over the report, "marked as
// entered"; review I4-4). The words a mark carries therefore depend on the model; SP.markText gives the right ones, and
// with no report they are SP.AUTH_MARK_TEXT's, word for word.
SP.AUTH_MARK_TEXT_BAE = Object.freeze({
  '†': 'Authorized was neither entered nor in the BAE report; Approved is shown in its place (on a total, for the rows marked †).',
  '‡': 'Authorized as entered, for the appropriation and FY as a whole: it is used in place of the BAE report’s figure, where the report has one, '
    + 'and covers every service and lane, whatever the switches show.',
  '§': SP.AUTH_MARK_TEXT['§'],
});
SP.markText = function markText(mark, model) {
  const T = model && model.bae && model.bae.present ? SP.AUTH_MARK_TEXT_BAE : SP.AUTH_MARK_TEXT;
  return eng_own(T, mark) ? T[mark] : '';
};
// '†' not entered (Approved stands in); '‡' entered while some switch is off; '' entered with everything shown.
// With a BAE report loaded (§14.5), an Authorized taken from the report follows the switches exactly, as the rows do, so
// it carries no mark, and an entered one is '‡' whatever the switches (review I4-4). With none loaded no row has an
// authorizedSrc, and this reads as it always did.
SP.authMark = function authMark(row, model) {
  if (!row) return '';
  if (row.authorizedSrc === 'report') return '';
  if (row.authorizedSrc === 'entered') return '‡';
  if (!row.authorizedEntered) return '†';
  return model && model.shown && !model.shown.all ? '‡' : '';
};
// §14.5 the mark beside an APPROVED figure: '§' on a block (or a PMO row of a block) the BAE report has no figure for, so
// its Approved is the CCaR plan while the rows around it are the report's. approvedSrc is set only with a report loaded,
// so with none this is never '§'.
SP.approvedMark = function approvedMark(row, model) {
  return row && row.approvedSrc === 'plan' ? '§' : '';
};
// the marks a TOTAL over these rows carries: it adds whatever its rows are, so it carries each of their marks
SP.authMarks = function authMarks(rows, model) {
  const m = (rows || []).map(r => SP.authMark(r, model));
  return { dag: m.includes('†'), ddag: m.includes('‡'), sect: (rows || []).some(r => SP.approvedMark(r, model) === '§') };
};

// §8's "Obligation %  (Approved X.XXM; …)" and the PMO strip: $M inside a sentence. The screen wrote it with fmtM,
// the workbook as v12's TEXT(x,"#,##0.00") and the picture with fmtM but 0.00 for zero, so one block's label read
// "Approved -M", "Approved 0.00M" and "-1,234.57M" against "(1,234.57)M" across the three (review R7). One wording now:
// fmtM's, so a negative is in parentheses as in every cell beside it and nothing non-zero reads as zero (§2), with zero
// written 0.00, because a lone dash inside a sentence reads as a figure left out.
SP.fmtMText = function fmtMText(cents) {
  return typeof cents === 'number' && isFinite(cents) && Math.round(cents) === 0 ? '0.00' : SP.fmtM(cents);
};
// A block whose pull was imported before the data-through month ended cannot hold that whole month: "actual through
// Oct" over a pull imported on 5 October put a month of actuals on a slide that had five days of them, and read its
// goal and status at the end of October (review BP-3). Its label names where its actuals stop instead (model.stale).
// §14.5: the Obligation % row of a slide block and of a totals band measures the CCaR plan by month (rule 6), so X is
// always the plan (`planned`). Where a BAE report covers the block, its Approved is the report's, so the word is
// "CCaR plan" and the figure is not read as the Approved two columns away; elsewhere the plan IS Approved.
SP.oblLabel = function oblLabel(block, model) {
  const c = model && Array.isArray(model.cols) ? model.cols[model.asOfIndex] : null;
  const st = block && model && Array.isArray(model.stale) ? model.stale.find(s => s.ap === block.ap) : null;
  return 'Obligation %  (' + (block && block.covered ? 'CCaR plan ' : 'Approved ') + SP.fmtMText(SP.plannedOf(block)) + 'M; actual through '
    + (st ? 'the ' + st.day + ' import' : c ? c.label : '') + ', plan after)';
};
// §14.3 what a block (or a PMO block) measures its slide and its totals band against: the CCaR plan. With a BAE report
// loaded that is `planned`, beside an `approved` that may be the report's; with none there is only `approved`, which is
// the plan. The products read these two, never the fields, so they need not ask whether a report is loaded.
SP.plannedOf = function plannedOf(block) {
  return block && (typeof block.planned === 'number' ? block.planned : block.approved);
};
// {basis, oblPct, goal, delta, status}: what a slide block's and a totals band's Total column prints (§14.3)
SP.slideOf = function slideOf(block) {
  if (!block) return null;
  return block.slide || { basis: block.approved, oblPct: block.oblPct, goal: block.goal, delta: block.delta, status: block.status };
};
// §14.5 the Summary's line 2, in the one wording the screen and the workbook print. With no report it is §8.1's.
SP.summaryLine2 = function summaryLine2(model) {
  const asOf = model && model.asOfLabel ? model.asOfLabel : '';
  const tail = ' | Obligated = CCaR status "Actual Execution" | Unobligated = Approved - Obligated | Delta = Obl% - OSD%';
  if (model && model.bae && model.bae.present) {
    return 'Data through ' + asOf + ' | Approved, Authorized = BAE report ' + model.bae.of + ' (sustainment budgets)' + tail;
  }
  return 'Data through ' + asOf + ' | Approved = total planned ($M from the CCaR pull) | Authorized = entered, else Approved' + tail;
};
// §8.3 an appropriation's title, in the one wording the screen and the workbook print. With a BAE report loaded its
// Approved and Authorized are the report's wherever it covers a block (§14.3), so "from the CCaR pull" alone would not be
// true of them, and the title names the report too. The workbook named it and the screen did not, so on screen a table
// headed "from the CCaR pull" disagreed with the pull's own Monthly Totals under it, with nothing to say why (review
// BP4-1, P4-6). day: the pull's import day, or '' when not known. always: write "(from …)" when the day is not known (the
// workbook says "on an unknown date"; the screen, with no report, leaves the parenthesis out as it always has).
SP.apTitle = function apTitle(label, day, model, always) {
  const rep = !!(model && model.bae && model.bae.present);
  const base = 'F-35 Sustainment ' + label + ' - Spend Plan & FY Summary';
  if (!day && !always && !rep) return base;
  return base + ' (from the CCaR pull imported ' + (day || 'on an unknown date') + (rep ? ' and the BAE report ' + model.bae.of : '') + ')';
};
// §14.6 rule 6, said once on the Slide blocks view and on the Slide Snapshots sheet: with a BAE report loaded the Summary's
// Approved is the report's, and a slide block still adds up the plan. The screen said so and the sheet did not, so a block
// copied off the sheet beside the Summary read as a figure that disagreed with it (review P4-6).
SP.SLIDES_PLAN_NOTE = 'The slide blocks measure the CCaR plan by month, as they always have: where the BAE report has figures for a block, '
  + 'its Approved on the Summary is the report’s, and the block’s Obligation % row says “CCaR plan” beside the plan it measures.';
// §15.4, §17.3 FY2025 O&M OBBBA FUNDING (SP.isObbba25), in the one wording each product prints, the screen and the workbook
// alike: why such a row counts nowhere (a Counted column, with how it was marked when not by its own name), the Import
// report's section on it, the Settings line, what the BAE report's table by appropriation and FY says of an (ap, fy) whose
// only pull rows it leaves out, and the Import report's list of the OBBBA money that counts (§17.3). SP.obbbaLines and
// SP.obbbaElsewhereLines give the two sections' lines, and the Summary's two notes are worked out once, in the model.
const ENG_OBBBA = 'FY' + SP.OBBBA_FY + ' O&M OBBBA';
SP.OBBBA_WHY = ENG_OBBBA + ' funding (not a reporting year)';
// a report row marked in its Budget Flex 02 and not in its name (the BAE Report sheet's Counted); a pull row marked by the
// report's Budget Flex 02 (a raw data sheet's Counted, after "No: ")
SP.OBBBA_WHY_FLEX02 = SP.OBBBA_WHY + ', marked in Budget Flex 02';
SP.OBBBA_WHY_REPORT = SP.OBBBA_WHY + ', marked in the BAE report’s Budget Flex 02';
SP.OBBBA_HEAD = ENG_OBBBA + ' funding, left out (not a reporting year)';

    const key = ap + '|' + fy;
    if (!blockRows.has(key)) { blockRows.set(key, []); blockOf.set(key, { ap, fy }); }
    return blockRows.get(key);
  };
  // Rows count under the appropriation of the pull they are stored in, never re-decided here: an import replaces an
  // appropriation's pull whole (§11), which only holds if a row cannot drift into another appropriation afterwards.
  for (const ap of ENG_AP_IDS) {
    const p = pulls[ap];
    if (!p || !Array.isArray(p.rows)) continue;
    rowsByAp[ap] = p.rows.length;
    for (const row of p.rows) {
      const d = SP.deriveRow(row, settings);
      // §17.1 the predicate, with the row's appropriation (the pull it is stored in) and whether the report marks its budget
      const named = SP.obbbaWord(d.budget), ob = SP.isObbba25(d.budget, d.fy, ap, obMarks.has(SP.normKey(d.budget)));
      if (named) wordLoaded = true;
      if (!obLoaded && ob) obLoaded = true;
      if (B) {
        let sp = allSpell.get(d.k.pmo);
        if (!sp) allSpell.set(d.k.pmo, (sp = new Map()));
        eng_tally(sp, eng_txt(d.pmo));
        const bk = SP.normKey(d.budget);
        if (!pullBudget.has(bk)) pullBudget.set(bk, eng_txt(d.budget));
        pullKeys.add(bk);
      }
      if (!eng_readable(d)) {
        excluded.unreadable.rows++;
        // a row whose FY reads still names its block: a block does not vanish because its one row's amount is damaged.
        // §15.2: except FY2025 OBBBA funding, which would be left out if it read, so names no block, as a row before
        // First FY names none
        if (Number.isInteger(d.fy) && d.fy >= S.firstFY) {
          if (ob) obGone.add(ap + '|' + d.fy);
          else ensure(ap, d.fy);
        }
        continue;
      }
      if (d.fy < S.firstFY) {
        const b = excluded.beforeFirst, k = String(d.fy);
        b.cents += d.cents; b.rows++;
        b.byFy[k] = (b.byFy[k] || 0) + d.cents; b.rowsByFy[k] = (b.rowsByFy[k] || 0) + 1;
        continue;
      }
      // §4.3 condition 4 (§15.2, §17.1), after condition 3: counted in no figure, block or list, whatever the switches show
      if (ob) {
        const key = ap + '|' + d.fy, obl = d.status === 'exec' ? d.cents : 0;
        obGone.add(key);
        const o = excluded.obbba;
        o.rows++; o.cents += d.cents; o.obligated += obl;
        let t = obBlocks.get(key);
        if (!t) obBlocks.set(key, (t = { ap, fy: d.fy, rows: 0, cents: 0, obligated: 0 }));
        t.rows++; t.cents += d.cents; t.obligated += obl;
        const bk = SP.normKey(d.budget);
        let u = obBudgets.get(bk);
        // §17.2 how the budget is marked: by its own name, or by the report's Budget Flex 02 (every row of one normKey alike)
        if (!u) obBudgets.set(bk, (u = { key: bk, name: eng_txt(d.budget).trim(), ap, by: named ? 'name' : 'report', rows: 0, cents: 0, obligated: 0 }));
        u.rows++; u.cents += d.cents; u.obligated += obl;
        continue;
      }
      // §17.2 OBBBA money of another appropriation, FY2025: it counts like any other money, and is listed as such. Read and
      // of First FY or later, as the rows the rule leaves out are, whatever the switches show.
      if (SP.isObbbaElsewhere(d.budget, d.fy, ap)) {
        const e = elseOf(ap, d.fy).pull;
        e.rows++; e.cents += d.cents; e.obligated += d.status === 'exec' ? d.cents : 0;
      }
      const list = ensure(ap, d.fy);
      present.svc.add(d.svc); present.lane.add(d.lane);
      if (!V.svc.has(d.svc) || !V.lane.has(d.lane)) continue;    // §4.3: the switches, the only filter there is
      const r = { d, cents: d.cents, col: eng_colOf(d.date, cx) };
      if (r.col === ENG_NODATE) showNoDate = true;
      list.push(r);
      let sp = pmoSpell.get(d.k.pmo);
      if (!sp) pmoSpell.set(d.k.pmo, (sp = new Map()));
      eng_tally(sp, eng_txt(d.pmo));
      // a Flyaway budget is aircraft production, never sustainment, so no report row is owed for it (rule 1)
      if (B && !ENG_FLYAWAY.test(eng_txt(d.budget))) countedKeys.add(SP.normKey(d.budget));
    }
  }
  const un = pulls.unidentified;
  if (un && Array.isArray(un.rows)) {
    rowsByAp.unidentified = un.rows.length;
    for (const row of un.rows) {
      const d = SP.deriveRow(row, settings);
      // a row whose appropriation is not identified is never O&M, so never left out by the rule (§17.1); it can hold the word
      if (SP.obbbaWord(d.budget)) wordLoaded = true;
      if (B) pullKeys.add(SP.normKey(d.budget));
      if (!eng_readable(d)) excluded.unreadable.rows++;
      else { excluded.unidentified.cents += d.cents; excluded.unidentified.rows++; }
    }
  }
  // §15.2: blocks in model order (appropriation order then FY), budgets in row order; and the (ap, fy) such rows would
  // have named that have no block, whatever the switches (a block never depends on them)
  const obRank = (x, y) => ENG_AP_IDS.indexOf(x.ap) - ENG_AP_IDS.indexOf(y.ap) || x.fy - y.fy;
  excluded.obbba.blocks = [...obBlocks.values()].sort(obRank);
  excluded.obbba.budgets = [...obBudgets.values()];
  const obbbaNoBlock = [...obGone].filter(k => !blockOf.has(k)).map(k => { const i = k.indexOf('|'); return { ap: k.slice(0, i), fy: Number(k.slice(i + 1)) }; })
    .sort(obRank);
  // §14.2 THE REPORT'S ROWS, each derived and judged once, in file order. A report row counts when it reads, is a
  // sustainment budget (scope 'in'), is of firstFY or later, and the switches show its service and lane: the switches
  // reach it as they reach a pull row. So such a row makes its service's switch exist (§9) as a pull row does, or a
  // switch left off on another plan could hide its money with no box on screen to turn it back on (review S2).
  let R = null, idx = null;
  const covered = new Set(), repBy = new Map();   // 'ap|fy' covered whatever the switches; 'ap|fy' -> counting report rows
  if (B) {
    idx = eng_pmoIndex(allSpell);
    const fc = SP.baeFlex02Col(B);
    R = B.rows.map(row => {
      const x = SP.baeDerive(row, settings, idx, fc);
      const fx = SP.baeFlex02(row, fc);
      if (SP.obbbaWord(x.name) || SP.obbbaWord(fx)) wordLoaded = true;
      if (!obLoaded && SP.isObbba25(x.name, x.fy, x.ap, fx)) obLoaded = true;
      const why = eng_baeWhyKey(x, S.firstFY, V);
      x.counts = why === 'yes'; x.why = eng_baeWhyText(why, x);
      // §17.2 OBBBA money of another appropriation, FY2025, in the report: a sustainment budget's readable row of First FY
      // or later, whatever the switches show; marked by its name, else by its Budget Flex 02
      if (x.readable && x.scope === 'in' && x.fy >= S.firstFY && SP.isObbbaElsewhere(x.name, x.fy, x.ap, fx)) {
        const e = elseOf(x.ap, x.fy).report;
        e.rows++; e.approved += x.approved; e.authorized += x.authorized;
        if (SP.obbbaWord(x.name)) e.byName++; else e.byFlex02++;
      }
      // §15.3: FY2025 OBBBA funding never makes a block covered, as Flyaway never does
      if (why === 'bad' || why === 'flyaway' || why === 'noap' || why === 'obbba') return x;
      const key = x.ap + '|' + x.fy;
      covered.add(key);                                 // §14.3: covered whatever the switches show
      if (why === 'first') return x;
      present.svc.add(x.svc); present.lane.add(x.lane);
      if (why === 'off') return x;
      if (!repBy.has(key)) repBy.set(key, []);
      repBy.get(key).push(x);
      return x;
    });
  }
  const shown = eng_shown(V, present);
  // a Budget's PMO by its name's last word (§14.2), one reading per distinct Budget text: information only since §16
  // (model.bae.pullBudgetPmo), no figure reads it
  const bpCache = new Map();
  const bpmoOf = name => { const s = eng_txt(name); let k = bpCache.get(s); if (k === undefined) bpCache.set(s, (k = eng_budgetPmoKey(s, idx))); return k; };
  const okCache = new Map();
  const offKindOf = name => { const s = eng_txt(name); let k = okCache.get(s); if (k === undefined) okCache.set(s, (k = eng_offKind(s))); return k; };
  // a PMO's name: the spelling most of its counted rows use. A PMO named on no counted row (a budget's last word, §14.2,
  // read for information only) is named as the pull names it on any row, else as SP.PMO_ORDER writes it.
  const pmoLabel = pk => {
    if (pmoSpell.has(pk)) return eng_major(pmoSpell.get(pk), ENG_BLANK.pmo);
    if (allSpell && allSpell.has(pk)) return eng_major(allSpell.get(pk), ENG_BLANK.pmo);
    return SP.PMO_ORDER.find(x => SP.normKey(x) === pk) || ENG_BLANK.pmo;
  };
  // the model's PMO order (model.pmos is sorted so), by key: a tie in a split goes to the PMO earlier in it (§16.1)
  const pmoBefore = (a, b) => eng_pmoSort({ key: a, label: pmoLabel(a) }, { key: b, label: pmoLabel(b) });
  // the blocks, appropriation order then FY
  const keys = [...blockOf.keys()].sort((a, b) => {
    const x = blockOf.get(a), y = blockOf.get(b);
    return ENG_AP_IDS.indexOf(x.ap) - ENG_AP_IDS.indexOf(y.ap) || x.fy - y.fy;
  });
  const blocks = [], pmoBlocks = new Map();   // PMO key -> [PmoBlock]
  // §16.3 each covered block's budgets as they are shared among its PMOs: the split ones (more than one PMO's plan above
  // zero) and the unassigned (none); and every budget's sharing, for the BAE Report sheet's PMO column (§16.2)
  const splitAll = [], unassignedAll = [], shareOf = new Map();   // 'ap|fy' -> budget key -> [{pmo, plan}] | null
  for (const key of keys) {
    const { ap, fy } = blockOf.get(key), rows = blockRows.get(key);
    const entered = eng_own(S.authorized, key) && Number.isSafeInteger(S.authorized[key]);
    const auth = { entered, cents: entered ? S.authorized[key] : 0 };
    const b = eng_block(rows, ap, fy, cx, S, auth);
    const cov = !!B && covered.has(key), rep = cov ? repBy.get(key) || [] : [];
    if (B) {
      eng_baeBlock(b, rep, cov, auth);
      // only where Approved is the report's can the two sides differ (elsewhere Approved IS the plan)
      b.offReport = cov ? eng_offReport(rows, offKindOf) : null;
    }
    blocks.push(b);
    // each PMO's own block: the same figures over only its rows, by the PMO column: exactly the PMOs the block's tree shows
    // (§16.1: a budget's name no longer gives a PMO a row)
    const byPmo = new Map();
    for (const r of rows) {
      let l = byPmo.get(r.d.k.pmo);
      if (!l) byPmo.set(r.d.k.pmo, (l = []));
      l.push(r);
    }
    // §16.1 on a covered block: each PMO's plan on each budget (its counted rows by the PMO column and the Budget's
    // normKey), and the report's Approved and Authorized of each budget, shared among the PMOs by that plan
    const share = new Map(), offPmo = new Map();
    if (cov) {
      const pks = [...byPmo.keys()].sort(pmoBefore);
      for (const pk of pks) share.set(pk, { approved: 0, authorized: 0 });
      const plan = new Map();                       // budget key -> PMO key -> cents
      for (const r of rows) {
        const bk = SP.normKey(r.d.budget);
        let m = plan.get(bk);
        if (!m) plan.set(bk, (m = new Map()));
        m.set(r.d.k.pmo, (m.get(r.d.k.pmo) || 0) + r.cents);
        // §16.1 offObligated: the part of a PMO's own Obligated on budgets the report's Approved can never hold
        if (r.d.status === 'exec' && offKindOf(r.d.budget)) offPmo.set(r.d.k.pmo, (offPmo.get(r.d.k.pmo) || 0) + r.cents);
      }
      const rb = new Map();                         // budget key -> {key, name, approved, authorized}: the report's, in file order
      for (const x of rep) {
        let t = rb.get(x.key);
        if (!t) rb.set(x.key, (t = { key: x.key, name: x.name, approved: 0, authorized: 0 }));
        t.approved += x.approved; t.authorized += x.authorized;
      }
      const shares = new Map(), split = [], un = [];
      for (const t of rb.values()) {
        const m = plan.get(t.key);
        const weights = pks.map(pk => Math.max(0, (m && m.get(pk)) || 0));
        const sa = SP.splitByPlan(t.approved, weights), su = SP.splitByPlan(t.authorized, weights);
        if (!sa || !su) {
          // no PMO's plan on it is above zero: on no PMO tab, in the Summary, and named (§16.1, §16.2)
          un.push({ key: t.key, name: t.name, approved: t.approved, authorized: t.authorized, why: m ? 'noplan' : 'nopull' });
          shares.set(t.key, null);
          continue;
        }
        const takers = [];
        pks.forEach((pk, i) => {
          const s0 = share.get(pk);
          s0.approved += sa[i]; s0.authorized += su[i];
          if (weights[i] > 0) takers.push({ pmo: pk, rank: i, plan: weights[i], approved: sa[i], authorized: su[i] });
        });
        // largest share first: by plan, which orders the shares the same way (largest remainder never puts a smaller
        // weight's share above a larger one's); a tie in the model's PMO order
        takers.sort((x, y) => y.plan - x.plan || x.rank - y.rank);
        shares.set(t.key, takers.map(x => ({ pmo: x.pmo, plan: x.plan })));
        if (takers.length > 1) {
          split.push({ ap, fy, key: t.key, name: t.name, approved: t.approved, authorized: t.authorized,
            pmos: takers.map(x => ({ pmo: x.pmo, label: pmoLabel(x.pmo), plan: x.plan, approved: x.approved, authorized: x.authorized })) });
        }
      }
      const byName = (x, y) => eng_cmp(x.name, y.name) || eng_cmp(x.key, y.key);
      for (const e of split.sort(byName)) splitAll.push(e);
      if (un.length) {
        un.sort(byName);
        unassignedAll.push({ ap, fy, approved: eng_sumOf(un, 'approved'), authorized: eng_sumOf(un, 'authorized'), budgets: un });
      }
      shareOf.set(key, shares);
    }
    for (const [pk, prs] of byPmo) {
      const pb = eng_block(prs, ap, fy, cx, S, { entered: false, cents: 0 });
      if (B) { eng_baePmo(pb, cov, share.get(pk)); pb.offObligated = offPmo.get(pk) || 0; }
      if (!pmoBlocks.has(pk)) pmoBlocks.set(pk, []);
      pmoBlocks.get(pk).push(pb);
    }
  }
  const naAll = [];
  for (const b of blocks) for (const it of b.na) naAll.push(Object.assign({ ap: b.ap, apLabel: b.apLabel, fy: b.fy, blockKey: b.key }, it));
  const aps = [];
  for (const ap of ENG_AP_IDS) {
    const list = blocks.filter(b => b.ap === ap);
    if (list.length) aps.push({ ap, label: ENG_AP_LABEL[ap], blocks: list, total: B ? eng_baeTot(eng_tot(list), list) : eng_tot(list) });
  }
  // the PMOs, in PMO order by the label over every counted row; each with its blocks in v12's PMO-tab order
  const tabOrder = (a, b) => ENG_PMO_TAB_ORDER.indexOf(a.ap) - ENG_PMO_TAB_ORDER.indexOf(b.ap) || a.fy - b.fy;
  const pmos = [];
  for (const [pk, pbs] of pmoBlocks) {
    const label = B ? pmoLabel(pk) : eng_major(pmoSpell.get(pk) || new Map(), ENG_BLANK.pmo);
    pbs.sort(tabOrder);
    pmos.push({ pmo: pk, key: pk, label, code: SP.pmoCode(label), blocks: pbs,
      rows: pbs.map(pb => {
        const row = { ap: pb.ap, apLabel: pb.apLabel, fy: pb.fy, key: pb.key, approved: pb.approved,
          authorized: pb.authorized, obligated: pb.obligated, unobligated: pb.unobligated, unprog: pb.unprog, oblPct: pb.oblPct,
          goal: pb.goal, delta: pb.delta, status: pb.status, execAfterAsOf: pb.execAfterAsOf, execNoDate: pb.execNoDate };
        if (B) Object.assign(row, { planned: pb.planned, covered: pb.covered, approvedSrc: pb.approvedSrc, authorizedSrc: pb.authorizedSrc,
          basis: pb.basis, sect: pb.sect, marks: pb.marks, offObligated: pb.offObligated });
        return row;
      }),
      // with a report, a PMO row's Authorized is the report's where it covers the block, so the total adds Authorized
      total: B ? eng_baeTot(eng_tot(pbs), pbs) : eng_tot(pbs, true) });
  }
  pmos.sort(eng_pmoSort);
  const execAfter = { cents: 0, rows: 0 }, execNoDate = { cents: 0, rows: 0 };
  for (const b of blocks) {
    execAfter.cents += b.execAfterAsOf; execAfter.rows += b.execAfterAsOfRows;
    execNoDate.cents += b.execNoDate; execNoDate.rows += b.execNoDateRows;
  }
  // §4.6 stale: each appropriation shown whose pull was imported before the data-through month ended (its import day,
  // in this computer's time, before the first of the next month). An import made after the month ended can hold all of
  // it; one made during it cannot, and was kept from an earlier import while another appropriation moved Data through
  // on (review BP-3). A pull with no import time says nothing, rather than a guess.
  const stale = [];
  for (const a of aps) {
    const day = eng_localDay(pulls[a.ap] && pulls[a.ap].importedAt);
    if (day && day < cx.asOfNext) stale.push({ ap: a.ap, label: a.label, day });
  }
  const model = {
    asOf: S.asOf, asOfLabel: SP.asOfLabel(S.asOf), E: cx.E, firstFY: S.firstFY, window: { start: cx.wstart, end: cx.wend },
    cols: cx.cols, asOfIndex: cx.asOfIndex, showNoDate, shown, special: S.special,
    present: { services: ENG_ALL_SVC.filter(s => present.svc.has(s)), lanes: ENG_LANES.filter(l => present.lane.has(l)) },
    blocks, aps, pmos, naAll, excluded, execAfterAsOf: execAfter, execNoDate, rowsByAp, stale, obbbaNoBlock,
    // §17.2 the OBBBA money that counts, per (ap, fy) of another appropriation, FY2025, in model order (information only: no
    // figure reads it); written only when some row holds the word, so a plan with none is the model before §17
    ...(wordLoaded ? { obbbaElsewhere: [...obElse.values()].sort((x, y) => ENG_AP_IDS.indexOf(x.ap) - ENG_AP_IDS.indexOf(y.ap) || x.fy - y.fy) } : {}),
    summary: { rows: blocks, total: B ? eng_baeTot(eng_tot(blocks), blocks) : eng_tot(blocks), notes: [] },
  };
  // §23 what was left out entirely, for the Import report's one line: written only when a row was, so a plan with none is
  // the model as it was
  { const ks = [...new Set([...Object.keys(keptP.out), ...Object.keys(keptB.out)])].sort();
    if (ks.length) model.leftOut = ks.map(k => { const i = k.indexOf('|'); return { ap: k.slice(0, i), fy: Number(k.slice(i + 1)), rows: keptP.out[k] || 0, reportRows: keptB.out[k] || 0 }; }); }
  if (B) model.bae = eng_baeModel(B, R, idx, { leftSum: keptB.sum, S, cx, blocks, pmoLabel, bpmoOf, pullBudget, pullKeys, countedKeys, obbbaNoBlock, obLoaded,
    split: splitAll, unassigned: unassignedAll, shareOf });
  model.summary.notes = eng_notes(model);
  return model;
};

// §14.5 model.bae: the report as the model reads it. Its counts and dollars are over every FY and take no switch (the
// report as a whole); noBlock, planShort and pullOnly follow the switches, as the blocks they speak of do.
//   K: {S, cx, blocks, pmoLabel, bpmoOf, pullBudget (key -> first spelling, four pulls), pullKeys (every pull row's
//       budget key, unidentified rows' too), countedKeys (each counted row's budget key, Flyaway left out),
//       obbbaNoBlock (each (ap, fy) whose only pull rows are FY2025 OBBBA funding, §15.2), obLoaded (any row SP.isObbba25
//       names is loaded, a pull's or the report's, read or not), split and unassigned (§16.3), shareOf ('ap|fy' of each
//       covered block -> budget key -> the PMOs taking a share, [{pmo, plan}] largest first, or null when unassigned)}
function eng_baeModel(B, R, idx, K) {
  const { S, cx, blocks } = K;
  // §16.2 the BAE Report sheet's PMO column: where a counting row's money goes. Each PMO whose plan events take a share of
  // its budget in its block, with its share of the plan, largest first; else "No plan event uses it" (a budget the plan
  // events use with no plan above zero is on no PMO tab either, and §16.2 gives no third wording; the Import report says
  // which of the two it is). Blank on a row that does not count. A counting row of a year the pull has no block for is on
  // no PMO tab, so no plan event uses it there either.
  const goes = x => {
    if (!x.counts) return '';
    const sh = K.shareOf && K.shareOf.get(x.ap + '|' + x.fy), t = sh ? sh.get(x.key) : null;
    if (!t || !t.length) return ENG_NO_PLAN_EVENT;
    let W = 0;
    for (const p of t) W += p.plan;
    return t.map(p => K.pmoLabel(p.pmo) + ' ' + SP.planPct(p.plan, W)).join('; ');
  };
  const good = R.filter(x => x.readable), ins = good.filter(x => x.scope === 'in');
  const rank = ap => ENG_AP_IDS.indexOf(ap);
  const byKey = (a, b) => rank(a.ap) - rank(b.ap) || a.fy - b.fy;
  // in scope, every FY, no switches: Approved and Authorized per (ap, fy), in model order
  const bb = new Map();
  for (const x of ins) {
    const k = x.ap + '|' + x.fy;
    if (!bb.has(k)) bb.set(k, { ap: x.ap, fy: x.fy, approved: 0, authorized: 0 });
    const t = bb.get(k);
    t.approved += x.approved; t.authorized += x.authorized;
  }
  const byBlock = {};
  for (const t of [...bb.values()].sort(byKey)) byBlock[t.ap + '|' + t.fy] = { approved: t.approved, authorized: t.authorized };
  // §14.1 the report's own total row, checked against the rows that read: it is a sum of floating-point dollars, so each
  // figure agrees within $1. A total row whose figure could not be read is not checked (null), and says so.
  const tr = B.total && typeof B.total === 'object' ? B.total : null;
  const totalRow = tr ? { approved: Number.isSafeInteger(tr.approved) ? tr.approved : null,
    authorized: Number.isSafeInteger(tr.authorized) ? tr.authorized : null, rowNo: Number.isInteger(tr.rowNo) ? tr.rowNo : null } : null;
  let total = null;
  if (totalRow && totalRow.approved !== null && totalRow.authorized !== null) {
    // §23: the report's total row adds the rows left out entirely too, so they are added back for this check alone
    const ls = K.leftSum || { approved: 0, authorized: 0 };
    const diff = { approved: totalRow.approved - eng_sumOf(good, 'approved') - ls.approved, authorized: totalRow.authorized - eng_sumOf(good, 'authorized') - ls.authorized };
    total = { ok: Math.abs(diff.approved) <= 100 && Math.abs(diff.authorized) <= 100, diff };
  }
  // an (ap, fy) the report holds counting money for, from firstFY to the execution year, with no block in the pull:
  // named, never added as a block (§14.3)
  const blockKeys = new Set(blocks.map(b => b.key));
  const nb = new Map();
  for (const x of R) {
    if (!x.counts || x.fy > cx.E) continue;
    const k = x.ap + '|' + x.fy;
    if (blockKeys.has(k)) continue;
    if (!nb.has(k)) nb.set(k, { ap: x.ap, fy: x.fy, approved: 0, authorized: 0, money: false });

// §4.6 the Summary's notes, each only when it has something to say.
// Under a switch, a note must not claim more than is true (§4.3: "each product states what it shows when not

// typed for an appropriation and FY as a whole) and the rows not counted (each is named by the FIRST §4.3 condition it
// fails, and the switches come last). "Every figure counts only these" stood beside both, and with USAF off the
// before-FY2025 note on the real pull still counted every dollar of USAF's FY2024 money (review R3). So the claim names its exceptions, and
// each of those notes says it covers every service and lane.
function eng_notes(M) {
  const notes = [];

  const every = filtered ? ' This counts every service and lane, whatever the switches show.' : '';
  const authAll = filtered ? M.blocks.filter(b => b.authorizedEntered) : [];

  const X = M.bae && M.bae.present ? M.bae : null;

    const ex = [];
    if (authAll.length) ex.push('an entered Authorized (marked ‡)');

    // the report's own totals (§14.5 cents: in scope, every FY, no switches) describe the report, not what is shown
    if (X) ex.push('the note below on the BAE report as a whole');

      + (one ? 'its' : 'their') + ' goals and statuses are read at ' + M.asOfLabel + '. '

  const up = M.blocks.filter(b => b.unprog !== 0 && !b.covered), upC = M.blocks.filter(b => b.unprog !== 0 && b.covered);
  if (up.length) notes.push('Unprogrammed money is counted in Approved: ' + up.map(b => eng_fyName(b) + ' ' + eng_dollars(b.unprog)).join('; ') + '.');
  if (upC.length) notes.push('Unprogrammed money is counted in the CCaR plan: ' + upC.map(b => eng_fyName(b) + ' ' + eng_dollars(b.unprog)).join('; ') + '.');

  }

      + authAll.map(eng_fyName).join(', ') + ' ' + (authAll.length === 1 ? 'shows its' : 'show their') + ' entered Authorized (marked ‡) beside an Approved,'

      + eng_dollarsT(ob.obligated) + ' of it obligated. See the Import report.' + every);

  if (ui.rows) notes.push(eng_rowsWord(ui.rows) + ' (' + eng_dollars(ui.cents) + ') ' + (ui.rows === 1 ? 'carries' : 'carry')
    + ' a Budget name that names no appropriation, on a sheet whose name does not name one either; '
    + (ui.rows === 1 ? 'it is' : 'they are') + ' counted nowhere. See the Import report.' + every);
  if (ur) notes.push(eng_rowsWord(ur) + ' could not be read (FY or Amount) and ' + (ur === 1 ? 'is' : 'are') + ' counted nowhere. See the Import report.' + every);

  if (nd && nd.rows) notes.push(eng_rowsWord(nd.rows) + ' marked Actual Execution (' + eng_dollars(nd.cents) + ') ' + (nd.rows === 1 ? 'has' : 'have')
    + ' no readable date; ' + (nd.rows === 1 ? 'it is' : 'they are') + ' counted as obligated (Obligated and the Obl % beside it), but in no month’s actual Obligation %,'
    + ' so the headline Obl % and the data-through month’s differ by ' + (nd.rows === 1 ? 'it' : 'them') + '.');
  return notes;
}
// §14.5 the Summary's notes on the BAE report, each only when it applies: the report itself (its date, the budgets in it,

// under half the report's Approved (rule 5: flagged, never hidden), and the report's money for a year the pull has no
// block for (named, never added as a block).

// §14.5 how a planShort block's plan is said against the report's Approved: a whole percent, as §14.5's example rounds

SP.planShortPct = function planShortPct(planned, approved) {

function eng_baeNotes(M, X, notes, every) {
  const r = X.rows;
  const before = X.derived.filter(d => d.why === ENG_BAE_WHY.first).length;
  const out = [];
  if (r.flyaway) out.push(SP.fmtInt(r.flyaway) + ' Flyaway (production) ' + (r.flyaway === 1 ? 'row' : 'rows'));
  if (r.noap) out.push(eng_rowsWord(r.noap) + ' naming no appropriation');
  if (r.bad) out.push(eng_rowsWord(r.bad) + ' that could not be read');
  if (before) out.push(eng_rowsWord(before) + ' before FY' + M.firstFY);
  // §15.3: the rows the rule leaves out (by why, as the rows before First FY are: under a later First FY they are those)
  const obN = X.derived.filter(d => eng_isObWhy(d.why)).length;
  if (obN) out.push(SP.fmtInt(obN) + ' ' + ENG_OBBBA + (obN === 1 ? ' row' : ' rows'));
  let check;
  if (X.total) {
    check = X.total.ok ? 'Its total row agrees with the rows read.'
      : 'Its total row differs from the rows read by ' + SP.fmtUsd(X.total.diff.approved) + ' Approved and ' + SP.fmtUsd(X.total.diff.authorized)
        + ' Authorized; see the Import report.';
  } else check = X.totalRow ? 'Its total row could not be read, so it was not checked.' : 'It has no total row to check against.';
  notes.push('Approved and Authorized come from the BAE report ' + X.of + (X.file ? ' (' + X.file + ')' : '') + ' wherever it has figures for a block: it holds '
    + eng_rowsWord(r.in) + ' of sustainment budgets (' + SP.fmtInt(X.budgetsIn) + (X.budgetsIn === 1 ? ' budget' : ' budgets') + '), '
    + eng_dollarsT(X.cents.approved) + ' Approved and ' + eng_dollarsT(X.cents.authorized) + ' Authorized over every FY. '
    + (out.length ? 'Counted nowhere: ' + eng_and(out) + '. ' : '') + check + every);
  const unc = M.blocks.filter(b => !b.covered);
  if (unc.length) notes.push('The BAE report has no figure for ' + eng_and(unc.map(eng_fyName)) + ': Approved there is the CCaR plan (marked §).');
  for (const b of M.blocks.filter(x => x.planShort)) {
    notes.push(eng_fyName(b) + ': the CCaR plan (' + eng_dollarsT(b.planned) + ') is ' + SP.planShortPct(b.planned, b.approved) + ' of the BAE report’s Approved ('
      + eng_dollarsT(b.approved) + '); Obl % is measured against the report’s figure.');
  }
  // review M4-6: a covered block's plan and Obligated hold money its Approved leaves out by rule; named, never moved (§14.3)
  for (const o of X.offReport) {
    const b = { ap: o.ap, fy: o.fy };
    notes.push(eng_fyName(b) + ': the CCaR plan counts ' + eng_dollarsT(o.planned) + ' on ' + eng_offWords(o.budgets) + ', which the BAE report’s Approved leaves out'
      + (o.obligated !== 0 ? '; ' + eng_dollarsT(o.obligated) + ' of it is obligated, so Obligated and Obl % count money that Approved does not.'

  // tabs are not read as adding up to the Summary. Its Approved AND its Authorized: named by its Approved alone, the PMO tabs'
  // Authorized fell short of the Summary's by a figure no sentence gave, an out-year budget carrying less Authorized than
  // Approved (review P5-2). And an Authorized typed in Settings is for its block as a whole (§14.4), never shared among PMOs,
  // so where one is typed the PMO tabs' Authorized cannot add up to the Summary's: said too, naming each such block.
  const una = eng_unassignedOf(M, null);
  if (una.length) {
    const typed = M.blocks.filter(b => b.authorizedEntered);
    notes.push('The PMO tabs share each budget’s Approved and Authorized among the PMOs whose plan events use it, by their CCaR plan on it. '
      + una.map(u => eng_fyName(u) + ' ' + eng_dollarsT(u.approved) + ' Approved and ' + eng_dollarsT(u.authorized) + ' Authorized').join('; ')
      + ' of the BAE report’s money is on budgets no plan event uses, so the PMO tabs add up to the Summary less it.'
      + (typed.length ? ' An Authorized typed in Settings (marked ‡: ' + eng_and(typed.map(eng_fyName)) + ') is for its block as a whole and is never shared '
        + 'among the PMOs, so there the PMO tabs’ Authorized need not add up to the Summary’s.' : ''));
  }

    const one = nbo.length === 1;
    notes.push('The BAE report holds money for ' + nbo.map(t => ENG_AP_LABEL[t.ap] + ' FY' + t.fy + ' (' + eng_dollarsT(t.approved) + ' Approved, '
      + eng_dollarsT(t.authorized) + ' Authorized)').join('; ') + ', which the CCaR pull has no rows for: no block is shown for ' + (one ? 'it' : 'them') + '.');
  }

      + eng_dollarsT(t.approved) + ' Approved and ' + eng_dollarsT(t.authorized) + ' Authorized for it are not shown.');
  }
}

// ---------------------------------------------------------------------------------------------------------------
// WHAT CHANGED (§4.6 diffPulls): every row of every FY, with no switches and no first FY, because the question is what the

// A row that cannot be read (its FY or Amount) is counted in no dollar figure here, as everywhere, but it is still IN the

// unreadable read "gone from this pull" with its dollars taken off Approved, while the row sat in the pull (review M1);
// the other way round it read "new". Such lines are listed apart, with what each side could read.
//
// A LINE is every row of one appropriation, FY, PMO, Title, Plan Event and CCaR, added together. It changes when its

    // and from the others only when none reads

    const lk = JSON.stringify(parts);      // grouped by the parts, never by a joined string a '|' in a name could fake

    [d.pmo, d.title, d.pe, d.ccar].forEach((s, i) => eng_tally(l.sp[i], eng_txt(s)));

// ---------------------------------------------------------------------------------------------------------------
// WHAT CHANGED IN THE BAE REPORT (§14.6 SP.diffBae): the report that replaced another, against it, over its sustainment
// budgets (scope 'in'), every FY and every row, with no switches: the question is what the new report says that the old
// one did not, not what this browser shows. A budget is IN a report when it has an in-scope row there, readable or not,
// as a CCaR whose rows do not read is still in its pull (§4.6): so a row that turned unreadable never makes a budget
// gone, and its dollars, like every unreadable row's, count nowhere. A budget changed when any FY's Approved or
// Authorized moved. Each list is largest change first: the change summed over its FYs, Approved or Authorized,
// whichever is larger; ties by name (its normKey).
// A BUDGET WITH A ROW THAT COULD NOT BE READ, on either side, is listed apart (budgetsUnread), as the pull's lines with
// such a row are (§4.6, review M1), with how many rows each side could not read: listed as changed, a budget whose one
// Authorized cell turned to "n/a" read "Approved 500.00 → -", cut to $0, though its Approved cell held the same figure
// in both files, and nothing on the view said a row could not be read (review I4-3). `unread` counts every such row.

function eng_baeSide(bae, settings) {

    const x = SP.baeDerive(row, settings, undefined, fc);
    if (x.name === '' || x.scope !== 'in') continue;
    if (!names.has(x.key)) names.set(x.key, x.name);
    if (!figs.has(x.key)) figs.set(x.key, new Map());
    if (!x.readable) { unread.set(x.key, (unread.get(x.key) || 0) + 1); unreadN++; continue; }
    const bk = x.ap + '|' + x.fy;
    if (!blocks.has(bk)) blocks.set(bk, { ap: x.ap, fy: x.fy, approved: 0, authorized: 0 });
    const t = blocks.get(bk);

}

    importedAt: typeof b.importedAt === 'string' ? b.importedAt : null, when,

SP.diffBae = function diffBae(prev, cur, settings) {
  prev = eng_keepBae(prev, settings).bae; cur = eng_keepBae(cur, settings).bae;     // §23
  const a = eng_baeSide(prev, settings), b = eng_baeSide(cur, settings);
  const rank = ap => ENG_AP_IDS.indexOf(ap);
  const keys = new Map([...a.blocks.values(), ...b.blocks.values()].map(t => [t.ap + '|' + t.fy, t]));
  const byBlock = {};
  for (const [k, t] of [...keys].sort((x, y) => rank(x[1].ap) - rank(y[1].ap) || x[1].fy - y[1].fy)) {
    const p = a.blocks.get(k) || { approved: 0, authorized: 0 }, q = b.blocks.get(k) || { approved: 0, authorized: 0 };
    byBlock[k] = { ap: t.ap, fy: t.fy, approved: [p.approved, q.approved], authorized: [p.authorized, q.authorized] };
  }

    const f0 = a.figs.get(k) || new Map(), f1 = b.figs.get(k) || new Map();
    const fys = [...new Set([...f0.keys(), ...f1.keys()])].sort(eng_cmp);

    const approved = [0, 0], authorized = [0, 0];
    for (const fy of fys) {
      const x = f0.get(fy) || [0, 0], y = f1.get(fy) || [0, 0];

// THE ZIP. Each member is DEFLATEd through the browser's CompressionStream('deflate-raw') where it has one, and stored
// where it has not (or where deflate would not make it smaller); either way the file opens. No ZIP64: a member or a whole
// archive past 4 GB is refused rather than written with sizes that wrap.
// ---------------------------------------------------------------------------------------------------------------
// CRC-32 eight bytes a step (slicing-by-8): a byte at a time it took a third of a second on a 64 MB sheet.
const xw_CRC = (() => {
  const t = new Int32Array(256 * 8);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; }
  for (let n = 0; n < 256; n++) for (let k = 1; k < 8; k++) t[k * 256 + n] = (t[(k - 1) * 256 + n] >>> 8) ^ t[t[(k - 1) * 256 + n] & 0xFF];
  return t;
})();
// the running CRC (start at 0xFFFFFFFF, finish with ^ 0xFFFFFFFF) over u8[from, to)
function xw_crcRun(c, u8, from, to) {
  const T = xw_CRC;

    const a = c ^ (u8[i] | (u8[i + 1] << 8) | (u8[i + 2] << 16) | (u8[i + 3] << 24));
    c = T[1792 + (a & 0xFF)] ^ T[1536 + ((a >>> 8) & 0xFF)] ^ T[1280 + ((a >>> 16) & 0xFF)] ^ T[1024 + (a >>> 24)]
      ^ T[768 + u8[i + 4]] ^ T[512 + u8[i + 5]] ^ T[256 + u8[i + 6]] ^ T[u8[i + 7]];
  }
  for (; i < to; i++) c = T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return c;
}
// raw DEFLATE, or null where the browser cannot (no CompressionStream, or one that does not know 'deflate-raw').
// between(): called after each compressed chunk is read, while the stream works on the next one. The CRC is computed
// there, so wherever the stream compresses off the main thread (Node does) it costs no time at all, and elsewhere no more.
async function xw_deflate(chunks, between) {
  const CS = (typeof window !== 'undefined' && window.CompressionStream) || null;
  if (typeof CS !== 'function') return null;

  try { cs = new CS('deflate-raw'); } catch (e) { return null; }

    const wrote = (async () => { for (const ch of chunks) await w.write(ch); await w.close(); })();
    // A write the stream refuses must end the read too: otherwise the read below waits for an end that never comes, and
    // the export hangs with nothing said. (The catch also keeps the refusal from being an unhandled rejection.)
    wrote.catch(e => { rd.cancel(e).catch(() => {}); });
    let len = 0;
    for (;;) {
      const { done, value } = await rd.read();

async function xw_zip(files, fixed) {

    u32(e.crc); u32(e.body.length); u32(e.size); u16(e.nb.length); u16(0);
    out.set(e.nb, o); o += e.nb.length; out.set(e.body, o); o += e.body.length;
  }

    u32(0x02014b50); u16(20); u16(20); u16(e.flags); u16(e.method); u16(dosTime); u16(dosDate);
    u32(e.crc); u32(e.body.length); u32(e.size); u16(e.nb.length); u16(0); u16(0); u16(0); u16(0); u32(0); u32(e.off);
    out.set(e.nb, o); o += e.nb.length;

SP.zipFiles = async function zipFiles(files) {
  if (!Array.isArray(files)) throw new Error('zipFiles: give a list of {name, data}');
  const seen = new Set(), list = [];
  for (const f of files) {
    if (!f || typeof f !== 'object') throw new Error('zipFiles: each file must be {name, data}');
    const name = String(f.name ?? '');

    const k = name.toLowerCase();

    seen.add(k);

    let data = f.data;

// v12's widths: a 70-character label column, then the money columns (FINDINGS "### look" §5)
const EX_W_LABEL = 69.949, EX_W_TOTAL = 13.047, EX_W_MONTH = 11.027, EX_W_EDGE = 11.973;
const EX_RAW_W = [6.05, 11.97, 11.97, 34.97, 34.97, 6.05, 6.05, 34.97, 11.97, 13.99, 7.93, 30.00, 9.95, 18.02, 14.93, 14.93,
  14.93, 18.02, 27.98, 16.01, 16.01, 13.99, 13.99, 13.99, 9.95, 7.93, 7.93, 9.95, 9.95, 9.95, 13.99, 13.99];   // the 32
const EX_CURVES = [['om1', 'O&M, first year'], ['om2', 'O&M, second year or later'], ['p1', 'Procurement, first year'],
  ['p2', 'Procurement, second year'], ['p3', 'Procurement, third year'], ['p4', 'Procurement, fourth year or later']];

// ---------------------------------------------------------------------------------------------------------------
// SMALL HELPERS
// ---------------------------------------------------------------------------------------------------------------
// cents -> $M as the cell's number. A missing figure is an empty cell, never 0: "no goal" and "a goal of 0%" differ.
function ex_M(c) { return typeof c === 'number' && isFinite(c) ? c / 1e8 : null; }
// a money cell: cents as $M, in style s, or in s's '<0.01' twin when the amount is non-zero and under $5,000 (fmtM's rule)
const ex_tinyOf = new Map();
function ex_mc(c, s) {
  const v = ex_M(c);
  if (v === null || !s || c === 0 || Math.abs(c) >= 500000) return ex_cell(v, s);
  let t = ex_tinyOf.get(s);
  if (!t) {
    const mark = EX_MARKS.find(m => s.fmt === ex_markFmt(m)) || '';
    t = Object.freeze(Object.assign({}, s, { fmt: ex_tinyFmt(mark) }));
    ex_tinyOf.set(s, t);
  }
  return ex_cell(v, t);
}
function ex_num(x) { return typeof x === 'number' && isFinite(x) ? x : null; }
function ex_cell(v, s) {
  if (v === null || v === undefined || (typeof v === 'number' && !isFinite(v))) return s ? { s } : null;
  return s ? { v, s } : { v };
}
function ex_pad2(n) { return String(n).padStart(2, '0'); }
// this browser's calendar date: a file exported at 9 pm in Virginia is dated that day, not tomorrow's in UTC
function ex_today(d) {
  d = d instanceof Date && !isNaN(d.getTime()) ? d : new Date();
  return d.getFullYear() + '-' + ex_pad2(d.getMonth() + 1) + '-' + ex_pad2(d.getDate());
}
// an import time -> its local date; a plain 'YYYY-MM-DD' is that date as written
function ex_localDate(iso) {
  if (typeof iso !== 'string') return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
  const t = Date.parse(iso);
  return isNaN(t) ? '' : ex_today(new Date(t));
}
// an import time -> 'YYYY-MM-DD HH:MM' in this computer's time, as the Import Report writes every import's time
function ex_localWhen(iso) {
  const t = typeof iso === 'string' ? Date.parse(iso) : NaN;
  if (isNaN(t)) return '';
  const d = new Date(t);
  return ex_today(d) + ' ' + ex_pad2(d.getHours()) + ':' + ex_pad2(d.getMinutes());
}
function ex_rng(r1, c1, r2, c2) { return SP.colLetter(c1) + r1 + ':' + SP.colLetter(c2) + r2; }
function ex_own(o, k) { return !!o && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k); }
// How many lines a wrapped text takes in a width of w (Excel's units, one '0' of Calibri 11). Calibri 10 fits about 1.15
// characters to a unit; this errs a little wide of that, because a row cut short hides words and one a line too tall
// only shows white. Explicit line breaks count.
function ex_lines(text, w, sz, indent) {
  const per = Math.max(8, Math.floor(w * 1.08 * (10 / (sz || 10))) - (indent || 0) * 2);
  let n = 0;
  for (const p of String(text).split('\n')) n += Math.max(1, Math.ceil(p.length / per));
  return n;
}
// a row's height for that many lines (Excel caps a row at 409 points); undefined (the default 15) for one line
function ex_ht(lines, sz) {
  if (lines <= 1) return undefined;
  return Math.min(409, Math.round((lines * (sz || 10) * 1.32 + 3) * 4) / 4);
}
function ex_statusWord(st) { return st ? SP.statusWord(st) : ''; }
// a BAE report of budgets is loaded (§14): only then does any product print a §, the report's words or its sheet
function ex_hasBae(M) { return !!(M && M.bae && M.bae.present); }

// ---------------------------------------------------------------------------------------------------------------
// A SHEET UNDER CONSTRUCTION. K.sh is exactly what the writer is given (it refuses any key it does not know, so nothing of
// this module's own rides on it); K holds the layout facts the row builders share.
// ---------------------------------------------------------------------------------------------------------------
function ex_sheet(name, widths, opts) {
  const sh = { name, grid: false, page: EX_PAGE, header: EX_HEADER, footer: EX_FOOTER, cols: widths.map(w => ({ w })),
    rows: [], merges: [] };
  Object.assign(sh, opts || {});
  return { sh, W: widths.length, widths };
}
function ex_push(K, cells, opts) {
  const r = { cells };
  if (opts) {
    if (opts.ht !== undefined) r.ht = opts.ht;
    if (opts.level) r.level = opts.level;
    if (opts.hidden) r.hidden = true;
  }
  K.sh.rows.push(r);
  return K.sh.rows.length;   // the row's number, 1-based
}
function ex_blank(K, opts) { return ex_push(K, [], opts); }
// a text across columns c1..c2 of a new row: merged, every covered cell painted with the same style
function ex_span(K, text, s, c1, c2, opts) {
  const cells = [];
  for (let i = 0; i < c1; i++) cells.push(null);
  cells.push({ v: text, s });
  for (let i = c1 + 1; i <= c2; i++) cells.push({ s });
  const r = ex_push(K, cells, opts);
  if (c2 > c1) K.sh.merges.push(ex_rng(r, c1, r, c2));
  return r;
}
function ex_widthOf(K, c1, c2) { let w = 0; for (let i = c1; i <= c2; i++) w += K.widths[i] || EX_W_MONTH; return w; }
// a sheet's title, merged across its width
function ex_title(K, text) { return ex_span(K, text, EXS.title, 0, K.W - 1, { ht: 27.75 }); }
// an explanatory line: italic grey, wrapped, as tall as its words need
function ex_subLine(K, text) {
  return ex_span(K, text, EXS.sub, 0, K.W - 1, { ht: ex_ht(ex_lines(text, ex_widthOf(K, 0, K.W - 1), 11), 11) });
}
// the line every report sheet carries: what the switches show (§4.3)
function ex_shownLine(K, M) { return ex_span(K, M.shown.text, EXS.shown, 0, K.W - 1); }
function ex_bar(K, text, set, ht) {
  const cells = [];
  for (let i = 0; i < K.W; i++) cells.push({ s: K.W === 1 ? set.only : i === 0 ? set.first : i === K.W - 1 ? set.last : set.mid });
  cells[0].v = text;
  const r = ex_push(K, cells, { ht });
  if (K.W > 1) K.sh.merges.push(ex_rng(r, 0, r, K.W - 1));
  return r;
}
function ex_headRow(K, labels, ht) { return ex_push(K, labels.map(t => ({ v: t, s: EXS.head })), { ht }); }

// ---------------------------------------------------------------------------------------------------------------
// THE SPEND-PLAN BLOCKS: label | Total | Prior Yr | Oct … Sep | FY{E+1}+ | [No date] | Total
// ---------------------------------------------------------------------------------------------------------------
// the model columns a block shows: all but No date, which only when some shown row has no date (§4.2)
function ex_dcols(M) { const d = []; for (let i = 0; i < 14; i++) d.push(i); if (M.showNoDate) d.push(14); return d; }
function ex_blockWidths(M) {
  const w = [EX_W_LABEL, EX_W_TOTAL];
  for (const i of ex_dcols(M)) w.push(i === 0 || i === 13 ? EX_W_EDGE : EX_W_MONTH);
  w.push(EX_W_TOTAL);
  return w;
}
function ex_blockSheet(name, M, opts) {
  const K = ex_sheet(name, ex_blockWidths(M), opts);
  K.dc = ex_dcols(M);
  K.closed = M.cols.map(c => !!c.closed);
  return K;
}
function ex_blockHead(K, M, first) {
  return ex_headRow(K, [first, 'Total'].concat(K.dc.map(i => M.cols[i].label), ['Total']), 24);
}
// one money row: label, Total, each shown column, Total
function ex_moneyRow(K, label, labS, cols, total, cellS, totS, opts) {
  const cells = [{ v: label, s: labS }, ex_mc(total, totS)];
  for (const i of K.dc) cells.push(ex_mc(cols[i], cellS[K.closed[i] ? 1 : 0]));
  cells.push(ex_mc(total, totS));
  return ex_push(K, cells, opts);
}
// The tree, PMO -> Title -> Plan Event -> CCaR. `base` is the outline level of the PMO row: 0 on every sheet, as v12 had
// it (CONTRACT §8.5, §8.6), so Excel draws the four outline buttons each bar names and button 4 opens the CCaRs. With the
// PMO at level 1 the appropriation sheets had five, and their button 4 stopped at Plan Event (review XP-1). Plan Event and
// CCaR rows are hidden, so a sheet opens at PMO and Title.
function ex_tree(K, tree, base) {
  for (const n of SP.treeRows(tree, 4)) {
    const k = n.level - 1;
    const sz = EXS.treeSz[k];
    const lines = ex_lines(n.label, K.widths[0], sz, EXS.treeIndent[k]);
    ex_moneyRow(K, n.label, EXS.treeLab[k], n.cols, n.total, EXS.treeCell[k], EXS.treeTot[k],
      { level: n.level - 1 + base, hidden: n.level >= 3, ht: ex_ht(lines, sz) });
  }
}
// Monthly Totals, Cumulative Totals, Obligation %, OSD Goal %, OSD Status. The Total columns carry the block's headline:
// Approved, then its Obl %, goal and status, the figures the Summary row prints (§4.5). With a BAE report loaded they
// carry the CCaR PLAN's headline instead (§14.3, rule 6: a band measures the plan by month, and its months add to the
// plan, never to a report's Approved), read through SP.plannedOf and SP.slideOf; with none the two are the same figures.
function ex_band(K, M, b) {
  const L = EXS.bandLab;
  const plan = SP.plannedOf(b), sl = SP.slideOf(b);
  ex_moneyRow(K, 'Monthly Totals', L, b.cols, plan, EXS.bandM, EXS.bandM[0]);
  // Cumulative's Total is the whole block, as v12's was: No date is outside the running sum, never outside the total
  ex_moneyRow(K, 'Cumulative Totals', L, b.cum, plan, EXS.bandM, EXS.bandM[0]);
  const pct = ex_num(sl.oblPct), goal = ex_num(sl.goal);
  // the label in the words the screen and the picture use (SP.oblLabel, review R7)
  // A label longer than its column wraps in a row as tall as its lines: right-aligned in the first column, the overflow
  // has no cell to run into and Excel cuts it. "actual through the 2026-10-05 import" (review BP-3) beside an Approved over
  // $10,000M is wider than the 70-wide column.
  const lab = SP.oblLabel(b, M), labLines = ex_lines(lab, K.widths[0], 10, 1);
  const obl = [{ v: lab, s: labLines > 1 ? EXS.bandLabW : L },
    ex_cell(pct, EXS.bandP[0])];
  for (const i of K.dc) {
    const o = b.obl[i] || {};
    obl.push(ex_cell(ex_num(o.v), o.kind === 'plan' ? EXS.bandPlan : EXS.bandP[K.closed[i] ? 1 : 0]));
  }
  obl.push(ex_cell(pct, EXS.bandP[0]));
  ex_push(K, obl, { ht: ex_ht(labLines, 10) });
  const g = [{ v: 'OSD Goal %', s: L }, ex_cell(goal, EXS.bandP[0])];
  for (const i of K.dc) g.push(ex_cell(ex_num(b.goalC[i]), EXS.bandP[K.closed[i] ? 1 : 0]));
  g.push(ex_cell(goal, EXS.bandP[0]));
  ex_push(K, g);
  const sc = (status, plan, closed) => {
    if (!status || !EXS.bandStatus[status]) return ex_cell(null, EXS.bandP[closed ? 1 : 0]);
    return ex_cell(ex_statusWord(status), EXS.bandStatus[status][plan ? 1 : 0]);
  };
  const s = [{ v: 'OSD Status', s: L }, sc(sl.status, false, false)];
  for (const i of K.dc) { const x = b.statusC[i] || {}; s.push(sc(x.status, x.kind === 'plan', !!K.closed[i])); }
  s.push(sc(sl.status, false, false));
  ex_push(K, s);
}
// §5's one line per month, under its bar. A month longer than EX_NA_CHUNK continues on the next row with its label
// blank, so every item is printed whole and none is clipped by a row height.
function ex_na(K, M, items) {
  ex_bar(K, 'Not Allocated Requirements', EXS.barNa, 19.5);
  const lines = SP.naLines(items, M.cols);
  const tw = ex_widthOf(K, 1, K.W - 1);
  const row = (label, text) => {
    const cells = [label ? { v: label, s: EXS.naLab } : null, { v: text, s: EXS.naText }];
    for (let i = 2; i < K.W; i++) cells.push({ s: EXS.naText });
    const r = ex_push(K, cells, { ht: ex_ht(ex_lines(text, tw, 10, 1), 10) });
    if (K.W > 2) K.sh.merges.push(ex_rng(r, 1, r, K.W - 1));
  };
  if (!lines.length) { row('', 'None.'); return; }
  for (const ln of lines) {
    let chunk = '', first = true;
    for (const it of ln.items) {
      const t = SP.naItemText(it);
      if (chunk && chunk.length + 2 + t.length > EX_NA_CHUNK) { row(first ? ln.label : '', chunk); first = false; chunk = ''; }
      chunk = chunk ? chunk + '; ' + t : t;
    }
    if (chunk) row(first ? ln.label : '', chunk);
  }
}

// ---------------------------------------------------------------------------------------------------------------
// THE FY TABLES (Summary, appropriation sheets, PMO tabs)
// ---------------------------------------------------------------------------------------------------------------
// the cells after Appropriation/FY: Approved, Authorized, Obligated, Unobligated, Obl %, OSD Goal %, Delta (pp), Status
// mark: '', '†' or '‡' (SP.authMark) on Authorized; on a TOTAL also '†‡'. amark: '' or '§' (SP.approvedMark) on Approved,
// only ever '§' with a BAE report loaded
function ex_figCells(r, mark, amark) {
  const st = r.status && EXS.tStatus[r.status] ? r.status : null;
  return [ex_mc(r.approved, EXS.tMMark[amark] || EXS.tM), ex_mc(r.authorized, EXS.tMMark[mark] || EXS.tM),
    ex_mc(r.obligated, EXS.tM), ex_mc(r.unobligated, EXS.tM), ex_cell(ex_num(r.oblPct), EXS.tPct),
    // a delta within SP.DELTA_ZERO of zero is written 0, as the screen prints it '0.00%': the format chooses its section by
    // the sign, so a -1e-13 left by a division showed '-0.00%' beside On track (review M5)
    ex_cell(ex_num(r.goal), EXS.tGoal), ex_cell(SP.deltaShown(r.delta), EXS.tDelta),
    st ? { v: ex_statusWord(st), s: EXS.tStatus[st] } : { s: EXS.tBlank }];
}
// a TOTAL row: the sums and their Obl %; no goal, delta or status (§8.1). amark '§' when a row it adds carries it.
function ex_totCells(t, mark, amark) {
  return [ex_mc(t.approved, EXS.totMMark[amark] || EXS.totM), ex_mc(t.authorized, EXS.totMMark[mark] || EXS.totM),
    ex_mc(t.obligated, EXS.totM), ex_mc(t.unobligated, EXS.totM), ex_cell(ex_num(t.oblPct), EXS.totP),
    { s: EXS.totBlank }, { s: EXS.totBlank }, { s: EXS.totBlank }];
}
// rows grouped by appropriation, the label merged down its rows. rows: [{apLabel, fy, figures…, mark, amark}]. -> the
// last row
function ex_apFyRows(K, rows) {
  let r0 = 0, prev = null, last = 0;
  rows.forEach((x, j) => {
    const startsGroup = x.apLabel !== prev;
    const cells = [startsGroup ? { v: x.apLabel, s: EXS.tApLab } : { s: EXS.tApLab }, { v: x.fy, s: EXS.tFy }].concat(ex_figCells(x, x.mark, x.amark));
    last = ex_push(K, cells);
    if (startsGroup) { if (prev !== null && last - 1 > r0) K.sh.merges.push(ex_rng(r0, 0, last - 1, 0)); r0 = last; prev = x.apLabel; }
  });
  if (prev !== null && last > r0) K.sh.merges.push(ex_rng(r0, 0, last, 0));
  return last;
}
// a TOTAL's mark: each mark its rows carry (on Authorized), and § (on Approved) when a row carries it
function ex_totMark(am) { return (am.dag ? '†' : '') + (am.ddag ? '‡' : ''); }
function ex_totAMark(am) { return am.sect ? '§' : ''; }
// a line per mark used, saying what it means (SP.markText: the words the screen uses, which with a BAE report loaded say
// what † means then, §14.5). § first, as Approved is the column before Authorized. Each row is as tall as its words need
// across B:D: Excel never fits a row's height to a merged cell, so with no height the row stayed one line and showed
// "Authorized as entered, for the appropriation and", hiding the half of ‡ that says why (review XP2-1). LibreOffice
// sizes such a row itself, which is why its PDF never showed it.
function ex_markLines(K, am, M) {
  for (const m of ['§', '†', '‡']) {
    if (!(m === '§' ? am.sect : m === '†' ? am.dag : am.ddag)) continue;
    const text = SP.markText(m, M);
    const r = ex_push(K, [{ v: m, s: EXS.lineB }, { v: text, s: EXS.text }, { s: EXS.text }, { s: EXS.text }],
      { ht: ex_ht(ex_lines(text, ex_widthOf(K, 1, 3), 10), 10) });
    K.sh.merges.push(ex_rng(r, 1, r, 3));
  }
}
const EX_FIG_HEADS = ['Approved ($M)', 'Authorized ($M)', 'Obligated ($M)', 'Unobligated ($M)', 'Obl %', 'OSD Goal %', 'Delta (pp)', 'Status'];

// ---------------------------------------------------------------------------------------------------------------
// §8.1 SUMMARY
// ---------------------------------------------------------------------------------------------------------------
function ex_summary(M) {
  const K = ex_sheet('Summary', [22.059, 7.934, 16.008, 16.008, 16.008, 16.008, 11.027, 13.047, 13.047, 13.047], { freeze: 'A5' });
  const E2 = ex_pad2(((M.E % 100) + 100) % 100), q = Math.ceil(M.asOfIndex / 3);
  ex_title(K, 'F-35 Sustainment Financial Execution - Top-Line Snapshot (FY' + E2 + 'Q' + q + ')');
  // line 2 in the one wording the screen prints (SP.summaryLine2): §8.1's, or with a BAE report §14.5's
  ex_subLine(K, SP.summaryLine2(M));
  ex_shownLine(K, M);
  ex_headRow(K, ['Appropriation', 'FY'].concat(EX_FIG_HEADS), 30.75);
  ex_apFyRows(K, M.summary.rows.map(b => Object.assign({}, b, { mark: SP.authMark(b, M), amark: SP.approvedMark(b, M) })));
  const am = SP.authMarks(M.summary.rows, M);
  ex_push(K, [{ v: 'TOTAL - Sustainment', s: EXS.totLab }, { s: EXS.totBlank }].concat(ex_totCells(M.summary.total, ex_totMark(am), ex_totAMark(am))));
  ex_blank(K);
  ex_push(K, [{ v: 'Legend (OSD Status):', s: EXS.h11 }]);
  for (const g of SP.STATUS_LEGEND) {
    const r = ex_push(K, [{ v: g.word, s: EXS.tStatus[g.status] }, { v: g.colour + ' — ' + g.meaning, s: EXS.text }, { s: EXS.text }, { s: EXS.text }]);
    K.sh.merges.push(ex_rng(r, 1, r, 3));
  }
  ex_markLines(K, am, M);
  if (M.summary.notes.length) {
    ex_blank(K);
    ex_push(K, [{ v: 'Notes:', s: EXS.h11 }]);
