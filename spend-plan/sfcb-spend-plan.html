function ex_widthOf(K, c1, c2) { let w = 0; for (let i = c1; i <= c2; i++) w += K.widths[i] || EX_W_MONTH; return w; }
// a sheet's title, merged across its width
function ex_title(K, text) { return ex_span(K, text, EXS.title, 0, K.W - 1, { ht: 27.75 }); }
// an explanatory line: italic grey, wrapped, as tall as its words need
function ex_subLine(K, text) {
  return ex_span(K, text, EXS.sub, 0, K.W - 1, { ht: ex_ht(ex_lines(text, ex_widthOf(K, 0, K.W - 1), 10), 10) });
}
// the line every report sheet carries: what the switches show (§4.3)
function ex_shownLine(K, M) { return ex_span(K, M.shown.text, EXS.shown, 0, K.W - 1); }
function ex_bar(K, text, set, ht) {
  const cells = [];
  for (let i = 0; i < K.W; i++) cells.push({ s: K.W === 1 ? set.only : i === 0 ? set.first : i === K.W - 1 ? set.last : set.mid });
  cells[0].v = text;
  const r = ex_push(K, cells, { ht });
  if (K.W > 1) K.sh.merges.push(ex_rng(r, 0, r, K.W - 1));
  return r;
}
function ex_headRow(K, labels, ht) { return ex_push(K, labels.map(t => ({ v: t, s: EXS.head })), { ht }); }

// ---------------------------------------------------------------------------------------------------------------
// THE SPEND-PLAN BLOCKS: label | Total | Prior Yr | Oct … Sep | FY{E+1}+ | [No date] | Total
// ---------------------------------------------------------------------------------------------------------------
// the model columns a block shows: all but No date, which only when some shown row has no date (§4.2)
function ex_dcols(M) { const d = []; for (let i = 0; i < 14; i++) d.push(i); if (M.showNoDate) d.push(14); return d; }
function ex_blockWidths(M) {
  const w = [EX_W_LABEL, EX_W_TOTAL];
  for (const i of ex_dcols(M)) w.push(i === 0 || i === 13 ? EX_W_EDGE : EX_W_MONTH);
  w.push(EX_W_TOTAL);
  return w;
}
function ex_blockSheet(name, M, opts) {
  const K = ex_sheet(name, ex_blockWidths(M), opts);
  K.dc = ex_dcols(M);
  K.closed = M.cols.map(c => !!c.closed);
  return K;
}
function ex_blockHead(K, M, first) {
  return ex_headRow(K, [first, 'Total'].concat(K.dc.map(i => M.cols[i].label), ['Total']), 24);
}
// one money row: label, Total, each shown column, Total
function ex_moneyRow(K, label, labS, cols, total, cellS, totS, opts) {
  const tv = ex_M(total);
  const cells = [{ v: label, s: labS }, ex_cell(tv, totS)];
  for (const i of K.dc) cells.push(ex_cell(ex_M(cols[i]), cellS[K.closed[i] ? 1 : 0]));
  cells.push(ex_cell(tv, totS));
  return ex_push(K, cells, opts);
}
// The tree, PMO -> Title -> Plan Event -> CCaR. `base` is the outline level of the PMO row: 1 on the appropriation sheets,
// 0 on a PMO tab (CONTRACT §8.5, §8.6). Plan Event and CCaR rows are hidden, so a sheet opens at PMO and Title.
function ex_tree(K, tree, base) {
  for (const n of SP.treeRows(tree, 4)) {
    const k = n.level - 1;
    const sz = EXS.treeSz[k];
    const lines = ex_lines(n.label, K.widths[0], sz, EXS.treeIndent[k]);
    ex_moneyRow(K, n.label, EXS.treeLab[k], n.cols, n.total, EXS.treeCell[k], EXS.treeTot[k],
      { level: n.level - 1 + base, hidden: n.level >= 3, ht: ex_ht(lines, sz) });
  }
}
// Monthly Totals, Cumulative Totals, Obligation %, OSD Goal %, OSD Status. The Total columns carry the block's headline:
// Approved, then its Obl %, goal and status, the figures the Summary row prints (§4.5).
function ex_band(K, M, b) {
  const L = EXS.bandLab;
  ex_moneyRow(K, 'Monthly Totals', L, b.cols, b.approved, EXS.bandM, EXS.bandM[0]);
  // Cumulative's Total is the whole block, as v12's was: No date is outside the running sum, never outside the total
  ex_moneyRow(K, 'Cumulative Totals', L, b.cum, b.approved, EXS.bandM, EXS.bandM[0]);
  const pct = ex_num(b.oblPct), goal = ex_num(b.goal);
  // the label in the words the screen and the picture use (SP.oblLabel, review R7)
  const obl = [{ v: SP.oblLabel(b, M), s: L },
    ex_cell(pct, EXS.bandP[0])];
  for (const i of K.dc) {
    const o = b.obl[i] || {};
    obl.push(ex_cell(ex_num(o.v), o.kind === 'plan' ? EXS.bandPlan : EXS.bandP[K.closed[i] ? 1 : 0]));
  }
  obl.push(ex_cell(pct, EXS.bandP[0]));
  ex_push(K, obl);
  const g = [{ v: 'OSD Goal %', s: L }, ex_cell(goal, EXS.bandP[0])];
  for (const i of K.dc) g.push(ex_cell(ex_num(b.goalC[i]), EXS.bandP[K.closed[i] ? 1 : 0]));
  g.push(ex_cell(goal, EXS.bandP[0]));
  ex_push(K, g);
  const sc = (status, plan) => {
    const set = EXS.bandStatus[status && EXS.bandStatus[status] ? status : 'none'];
    return ex_cell(status ? ex_statusWord(status) : null, set[plan ? 1 : 0]);
  };
  const s = [{ v: 'OSD Status', s: L }, sc(b.status, false)];
  for (const i of K.dc) { const x = b.statusC[i] || {}; s.push(sc(x.status, x.kind === 'plan')); }
  s.push(sc(b.status, false));
  ex_push(K, s);
}
// §5's one line per month, under its bar. A month longer than EX_NA_CHUNK continues on the next row with its label
// blank, so every item is printed whole and none is clipped by a row height.
function ex_na(K, M, items) {
  ex_bar(K, 'Not Allocated Requirements', EXS.barNa, 19.5);
  const lines = SP.naLines(items, M.cols);
  const tw = ex_widthOf(K, 1, K.W - 1);
  const row = (label, text) => {
    const cells = [label ? { v: label, s: EXS.naLab } : null, { v: text, s: EXS.naText }];
    for (let i = 2; i < K.W; i++) cells.push({ s: EXS.naText });
    const r = ex_push(K, cells, { ht: ex_ht(ex_lines(text, tw, 10, 1), 10) });
    if (K.W > 2) K.sh.merges.push(ex_rng(r, 1, r, K.W - 1));
  };
  if (!lines.length) { row('', 'None.'); return; }
  for (const ln of lines) {
    let chunk = '', first = true;
    for (const it of ln.items) {
      const t = SP.naItemText(it);
      if (chunk && chunk.length + 2 + t.length > EX_NA_CHUNK) { row(first ? ln.label : '', chunk); first = false; chunk = ''; }
      chunk = chunk ? chunk + '; ' + t : t;
    }
    if (chunk) row(first ? ln.label : '', chunk);
  }
}

// ---------------------------------------------------------------------------------------------------------------
// THE FY TABLES (Summary, appropriation sheets, PMO tabs)
// ---------------------------------------------------------------------------------------------------------------
// the cells after Appropriation/FY: Approved, Authorized, Obligated, Unobligated, Obl %, OSD Goal %, Delta (pp), Status
// mark: '', '†' or '‡' (SP.authMark); on a TOTAL also '†‡'
function ex_figCells(r, mark) {
  const st = r.status && EXS.tStatus[r.status] ? r.status : null;
  return [ex_cell(ex_M(r.approved), EXS.tM), ex_cell(ex_M(r.authorized), EXS.tMMark[mark] || EXS.tM),
    ex_cell(ex_M(r.obligated), EXS.tM), ex_cell(ex_M(r.unobligated), EXS.tM), ex_cell(ex_num(r.oblPct), EXS.tPct),
    ex_cell(ex_num(r.goal), EXS.tGoal), ex_cell(ex_num(r.delta), EXS.tDelta),
    st ? { v: ex_statusWord(st), s: EXS.tStatus[st] } : { s: EXS.tBlank }];
}
// a TOTAL row: the sums and their Obl %; no goal, delta or status (§8.1)
function ex_totCells(t, mark) {
  return [ex_cell(ex_M(t.approved), EXS.totM), ex_cell(ex_M(t.authorized), EXS.totMMark[mark] || EXS.totM),
    ex_cell(ex_M(t.obligated), EXS.totM), ex_cell(ex_M(t.unobligated), EXS.totM), ex_cell(ex_num(t.oblPct), EXS.totP),
    { s: EXS.totBlank }, { s: EXS.totBlank }, { s: EXS.totBlank }];
}
// rows grouped by appropriation, the label merged down its rows. rows: [{apLabel, fy, figures…, mark}]. -> the last row
function ex_apFyRows(K, rows) {
  let r0 = 0, prev = null, last = 0;
  rows.forEach((x, j) => {
    const startsGroup = x.apLabel !== prev;
    const cells = [startsGroup ? { v: x.apLabel, s: EXS.tApLab } : { s: EXS.tApLab }, { v: x.fy, s: EXS.tFy }].concat(ex_figCells(x, x.mark));
    last = ex_push(K, cells);
    if (startsGroup) { if (prev !== null && last - 1 > r0) K.sh.merges.push(ex_rng(r0, 0, last - 1, 0)); r0 = last; prev = x.apLabel; }
  });
  if (prev !== null && last > r0) K.sh.merges.push(ex_rng(r0, 0, last, 0));
  return last;
}
// a TOTAL's mark: each mark its rows carry
function ex_totMark(am) { return (am.dag ? '†' : '') + (am.ddag ? '‡' : ''); }
// a line per mark used, saying what it means (SP.AUTH_MARK_TEXT, the words the screen uses)
function ex_markLines(K, am) {
  for (const m of ['†', '‡']) {
    if (!(m === '†' ? am.dag : am.ddag)) continue;
    const r = ex_push(K, [{ v: m, s: EXS.lineB }, { v: SP.AUTH_MARK_TEXT[m], s: EXS.text }, { s: EXS.text }, { s: EXS.text }]);
    K.sh.merges.push(ex_rng(r, 1, r, 3));
  }
}
const EX_FIG_HEADS = ['Approved ($M)', 'Authorized ($M)', 'Obligated ($M)', 'Unobligated ($M)', 'Obl %', 'OSD Goal %', 'Delta (pp)', 'Status'];

// ---------------------------------------------------------------------------------------------------------------
// §8.1 SUMMARY
// ---------------------------------------------------------------------------------------------------------------
function ex_summary(M) {
  const K = ex_sheet('Summary', [22.059, 7.934, 16.008, 16.008, 16.008, 16.008, 11.027, 13.047, 13.047, 13.047], { freeze: 'A5' });
  const E2 = ex_pad2(((M.E % 100) + 100) % 100), q = Math.ceil(M.asOfIndex / 3);
  ex_title(K, 'F-35 Sustainment Financial Execution - Top-Line Snapshot (FY' + E2 + 'Q' + q + ')');
  ex_subLine(K, 'Data through ' + M.asOfLabel + ' | Approved = total planned ($M from the CCaR pull) | Authorized = entered, else Approved'
    + ' | Obligated = CCaR status "Actual Execution" | Unobligated = Approved - Obligated | Delta = Obl% - OSD%');
  ex_shownLine(K, M);
  ex_headRow(K, ['Appropriation', 'FY'].concat(EX_FIG_HEADS), 30.75);
  ex_apFyRows(K, M.summary.rows.map(b => Object.assign({}, b, { mark: SP.authMark(b, M) })));
  const am = SP.authMarks(M.summary.rows, M);
  ex_push(K, [{ v: 'TOTAL - Sustainment', s: EXS.totLab }, { s: EXS.totBlank }].concat(ex_totCells(M.summary.total, ex_totMark(am))));
  ex_blank(K);
  ex_push(K, [{ v: 'Legend (OSD Status):', s: EXS.h11 }]);
  for (const g of SP.STATUS_LEGEND) {
    const r = ex_push(K, [{ v: g.word, s: EXS.tStatus[g.status] }, { v: g.colour + ' — ' + g.meaning, s: EXS.text }, { s: EXS.text }, { s: EXS.text }]);
    K.sh.merges.push(ex_rng(r, 1, r, 3));
  }
  ex_markLines(K, am);
  if (M.summary.notes.length) {
    ex_blank(K);
    ex_push(K, [{ v: 'Notes:', s: EXS.h11 }]);
    for (const n of M.summary.notes) ex_span(K, n, EXS.text, 0, K.W - 1, { ht: ex_ht(ex_lines(n, ex_widthOf(K, 0, K.W - 1), 10), 10) });
  }
  return K.sh;
}

// ---------------------------------------------------------------------------------------------------------------
// §8.2 SLIDE SNAPSHOTS: each block from its bar through OSD Status is the picture region
// ---------------------------------------------------------------------------------------------------------------
function ex_slides(M) {
  const K = ex_blockSheet('Slide Snapshots', M);
  ex_title(K, 'Slide Snapshots - picture-ready blocks for PowerPoint');
  ex_subLine(K, 'Each block is sized for a 13.33 in x 4.5 in slide region. In the dashboard, Slide blocks > Copy picture or Save'
    + ' pictures makes the picture; or select a block here from its title through OSD Status and use Copy as Picture.');
  ex_shownLine(K, M);
  ex_blank(K);
  for (const b of M.blocks) {
    ex_bar(K, b.apLabel + ' FY' + b.fy + ' - Spend Plan (PMO Summary, slide-ready)', EXS.barSlide, 25.5);
    ex_blockHead(K, M, 'PMO');
    for (const p of b.pmoRows) {
      ex_moneyRow(K, p.label, EXS.treeLab[0], p.cols, p.total, EXS.treeCell[0], EXS.treeTot[0],
        { ht: ex_ht(ex_lines(p.label, K.widths[0], 11), 11) });
    }
    ex_blank(K);
    ex_band(K, M, b);
    ex_na(K, M, b.na);
    ex_blank(K); ex_blank(K);
  }
  return K.sh;
}

// ---------------------------------------------------------------------------------------------------------------
// §8.3–§8.5 ONE SHEET PER APPROPRIATION: the FY table, then each FY's full tree
// ---------------------------------------------------------------------------------------------------------------
function ex_apSheet(M, a, pulls) {
  const K = ex_blockSheet(a.label, M, { outlineAbove: true });
  const p = pulls && pulls[a.ap];
  const when = ex_localDate(p && p.importedAt);
  ex_title(K, 'F-35 Sustainment ' + a.label + ' - Spend Plan & FY Summary (from the CCaR pull imported ' + (when || 'on an unknown date') + ')');
  ex_shownLine(K, M);
  ex_headRow(K, ['FY'].concat(EX_FIG_HEADS), 30);
  for (const b of a.blocks) ex_push(K, [{ v: b.fy, s: EXS.tFy }].concat(ex_figCells(b, SP.authMark(b, M))));
  const am = SP.authMarks(a.blocks, M);
  const tr = ex_push(K, [{ v: 'Total - All FYs', s: EXS.totLab }].concat(ex_totCells(a.total, ex_totMark(am))));
  K.sh.freeze = 'A' + (tr + 1);
  // ‡ is said under the table it marks: this sheet has no Summary notes beside it (review R3)
  if (am.ddag) ex_markLines(K, { ddag: true });
  ex_blank(K);
  for (const b of a.blocks) {
    ex_bar(K, 'FY' + b.fy + ' - Spend Plan by PMO / Title / Plan Event / CCaR  (1/2/3/4 in left margin)', EXS.barAp, 21.75);
    ex_blockHead(K, M, 'PMO / Title / Plan Event / CCaR');
    ex_tree(K, b.tree, 1);
    ex_blank(K);
    ex_band(K, M, b);
    ex_na(K, M, b.na);
    ex_blank(K); ex_blank(K);
  }
  return K.sh;
}

// ---------------------------------------------------------------------------------------------------------------
// §8.6 ONE TAB PER PMO, across appropriations (Full Fund, Initial Spares, O&M, OPN, as v12 ordered them)
// ---------------------------------------------------------------------------------------------------------------
function ex_pmoSheet(M, p) {
  const K = ex_blockSheet('PMO ' + p.code, M, { outlineAbove: true });
  ex_title(K, 'PMO: ' + p.label + ' - Sustainment Spend Plan (Cross-Appropriation Detail)');
  ex_shownLine(K, M);
  ex_headRow(K, ['Appropriation', 'FY'].concat(EX_FIG_HEADS), 30);
  ex_apFyRows(K, p.rows.map(r => Object.assign({}, r, { mark: '' })));
  const tr = ex_push(K, [{ v: 'Total - All', s: EXS.totLab }, { s: EXS.totBlank }].concat(ex_totCells(p.total, '')));
  K.sh.freeze = 'A' + (tr + 1);
  ex_span(K, 'Authorized is entered by appropriation and FY; a PMO row shows Approved.', EXS.note, 0, 9);
  ex_blank(K);
  for (const b of p.blocks) {
    ex_bar(K, b.apLabel + ' - FY' + b.fy, EXS.barPmo, 21.75);
    ex_blockHead(K, M, 'PMO / Title / Plan Event / CCaR');
    ex_span(K, b.apLabel + ' FY' + b.fy + ' Summary  |  Approved ' + SP.fmtMText(b.approved) + 'M  |  Authorized ' + SP.fmtMText(b.authorized)
      + 'M  |  Obligated ' + SP.fmtMText(b.obligated) + 'M  |  Unobligated ' + SP.fmtMText(b.unobligated) + 'M', EXS.strip, 0, K.W - 1, { ht: 21.75 });
    ex_tree(K, b.tree, 0);
    ex_blank(K);
    ex_band(K, M, b);
    ex_na(K, M, b.na);
    ex_blank(K); ex_blank(K);
  }
  return K.sh;
}

// ---------------------------------------------------------------------------------------------------------------
// §8.7 THE OTHER SHEETS
// ---------------------------------------------------------------------------------------------------------------
function ex_naSheet(M) {
  const K = ex_sheet('Not Allocated', [16, 7.934, 11.027, 60, 22, 18, 32, 48, 13.047]);
  ex_title(K, 'Not Allocated - every item, by appropriation and FY (largest first within each month)');
  ex_shownLine(K, M);
  const hr = ex_headRow(K, ['Appropriation', 'FY', 'Column', 'Item', 'Status', 'CCaR(s)', 'PMO(s)', 'Title(s)', '$M'], 24);
  K.sh.freeze = 'A' + (hr + 1);
  if (!M.naAll.length) { ex_span(K, 'No Not Allocated items.', EXS.text, 0, K.W - 1); return K.sh; }
  for (const it of M.naAll) {
    const col = M.cols[it.colIndex];
    ex_push(K, [{ v: it.apLabel, s: EXS.lText }, { v: it.fy, s: EXS.lFy }, { v: col ? col.label : it.col, s: EXS.lText },
      { v: String(it.label ?? ''), s: EXS.lText }, { v: String(it.statusLabel ?? ''), s: EXS.lText },
      { v: (it.ccars || []).join('; '), s: EXS.lText }, { v: (it.pmos || []).join('; '), s: EXS.lText },
      { v: (it.titles || []).join('; '), s: EXS.lText }, ex_cell(ex_M(it.cents), EXS.lM)]);
  }
  return K.sh;
}

// Why a row counts in no figure, by the first §4.3 condition it fails; 'Yes' when it counts.
function ex_counted(d, M, svcOn, laneOn) {
  if (d.bad || !Number.isInteger(d.fy) || !Number.isSafeInteger(d.cents)) {
    return 'No: could not be read (' + (d.bad && d.bad.length ? d.bad.join('; ') : 'FY or Amount') + ')';
  }
  if (d.fy < M.firstFY) return 'No: FY' + d.fy + ' is before the first FY shown (FY' + M.firstFY + ')';
  if (!svcOn.has(d.svc)) return 'No: service switched off (' + d.svc + ')';
  if (!laneOn.has(d.lane)) return 'No: lane switched off (' + (SP.LANE_WORDS[d.lane] || d.lane) + ')';
  return 'Yes';
}
// every row of one appropriation's pull, in pull order: the 32, the extra columns, then what the tool made of it
function ex_rawSheet(M, a, p, settings) {
  const extras = Array.isArray(p.headers) ? p.headers.slice(SP.RAW_HEADERS.length) : [];
  if (!Array.isArray(p.headers)) {
    const seen = new Set();
    for (const row of p.rows) if (row && row.x) for (const k of Object.keys(row.x)) if (!seen.has(k)) { seen.add(k); extras.push(k); }
  }
  const heads = SP.RAW_HEADERS.concat(extras, ['Service', 'Lane', 'Status', 'Counted']);
  const widths = EX_RAW_W.concat(extras.map(() => 16), [18, 13.99, 24, 40]);
  const K = ex_sheet(a.rawSheet, widths, { freeze: 'A2' });
  delete K.sh.grid;   // a data sheet keeps its gridlines, as v12's raw tabs did
  ex_push(K, heads.map(t => ({ v: t, s: EXS.rHead })), { ht: 21.75 });
  const svcOn = new Set(M.shown.services), laneOn = new Set(M.shown.lanes);
  const nx = extras.length;
  for (const row of p.rows) {
    if (!row || !Array.isArray(row.c)) continue;
    const c = row.c, raw = row.raw || {}, cells = new Array(heads.length);
    for (let k = 0; k < 32; k++) {
      const v = c[k];
      if (k === 0) cells[k] = typeof v === 'number' ? { v, s: EXS.rNum } : ex_own(raw, 'FY') ? { v: String(raw.FY), s: EXS.rBad } : { s: EXS.rText };
      else if (k === 1 || k === 8) {
        const h = SP.RAW_HEADERS[k];
        if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) cells[k] = { v: { date: v }, s: k === 1 ? EXS.rMonth : EXS.rDate };
        else if (ex_own(raw, h)) cells[k] = { v: String(raw[h]), s: EXS.rBad };
        else cells[k] = { s: EXS.rText };
      } else if (k === 9) {
        // whole dollars as a number with cents, as v12's raw tabs held them; an unreadable amount keeps the text it had
        cells[k] = typeof v === 'number' ? { v: v / 100, s: EXS.rAmt } : ex_own(raw, 'Amount') ? { v: String(raw.Amount), s: EXS.rBad } : { s: EXS.rText };
      } else cells[k] = v === null || v === undefined || v === '' ? { s: EXS.rText } : { v: String(v), s: EXS.rText };
    }
    for (let j = 0; j < nx; j++) {
      const v = row.x && ex_own(row.x, extras[j]) ? row.x[extras[j]] : '';
      cells[32 + j] = v === '' || v === null || v === undefined ? { s: EXS.rText } : { v: String(v), s: EXS.rText };
    }
    const d = SP.deriveRow(row, settings);
    cells[32 + nx] = { v: d.svc, s: EXS.rText };
    cells[33 + nx] = { v: SP.LANE_WORDS[d.lane] || d.lane, s: EXS.rText };
    cells[34 + nx] = { v: d.statusLabel || d.status, s: EXS.rText };
    cells[35 + nx] = { v: ex_counted(d, M, svcOn, laneOn), s: EXS.rText };
    ex_push(K, cells);
  }
  return K.sh;
}

function ex_reportSheet(M, pulls, meta) {
  const K = ex_sheet('Import Report', [180]);
  ex_title(K, 'Import Report');
  ex_push(K, [{ v: 'The pulls in this workbook:', s: EXS.lineB }]);
  for (const a of SP.APS) {
    const p = pulls && pulls[a.id];
    if (!p || !Array.isArray(p.rows)) continue;
    const files = (p.files || []).map(f => '“' + f.name + '”' + (f.sheets && f.sheets.length ? ' › ' + f.sheets.map(s => '“' + s + '”').join(', ') : '')).join('; ');
    ex_push(K, [{ v: '  ' + a.label + ': ' + SP.fmtInt(p.rows.length) + (p.rows.length === 1 ? ' row' : ' rows') + ', imported '
      + (ex_localDate(p.importedAt) || 'on an unknown date') + (files ? ', from ' + files : '') + '.', s: EXS.line }]);
  }
  const un = pulls && pulls.unidentified;
  if (un && Array.isArray(un.rows) && un.rows.length) {
    ex_push(K, [{ v: '  Appropriation not identified: ' + SP.fmtInt(un.rows.length) + (un.rows.length === 1 ? ' row' : ' rows')
      + ', counted nowhere.', s: EXS.line }]);
  }
  ex_blank(K);
  const rep = meta && meta.report;
  if (!rep) { ex_push(K, [{ v: 'No import report is held for the last import.', s: EXS.line }]); return K.sh; }
  ex_push(K, [{ v: 'The last import:', s: EXS.lineB }]);
  for (const line of SP.importReportLines(rep)) ex_push(K, [{ v: line, s: EXS.line }]);
  return K.sh;
}

function ex_settingsSheet(M, pulls, settings) {
  const s = settings && typeof settings === 'object' ? settings : {};
  const widths = [60].concat(new Array(13).fill(11.027));
  const K = ex_sheet('Settings', widths);
  ex_title(K, 'Settings used for this workbook');
  const kv = (k, v, sv) => ex_push(K, [{ v: k, s: EXS.lineB }, ex_cell(v, sv || EXS.line)]);
  kv('Data through', M.asOfLabel + ' (' + M.asOf + ')');
  kv('Execution year', 'FY' + M.E + ': ' + M.window.start + ' up to ' + M.window.end);
  kv('First FY shown', M.firstFY, EXS.line);
  ex_blank(K);
  // not "every figure": an entered Authorized and the notes on rows not counted cover every service and lane (review R3)
  ex_push(K, [{ v: 'Switches (this browser’s view; every figure counts only what is shown, except an entered Authorized and the Summary’s notes on rows not counted,'
    + ' which cover every service and lane)', s: EXS.h11 }]);
  const shownS = new Set(M.shown.services), shownL = new Set(M.shown.lanes);
  for (const sv of SP.SERVICES.concat([SP.SVC_UNKNOWN])) kv(sv, shownS.has(sv) ? 'Shown' : 'Hidden');
  for (const l of ['disc', 'mand']) kv(SP.LANE_WORDS[l] + ' lane', shownL.has(l) ? 'Shown' : 'Hidden');
  kv('In words', M.shown.text);
  ex_blank(K);
  ex_push(K, [{ v: 'OSD goal curves', s: EXS.h11 }]);
  ex_headRow(K, ['Curve', 'Prior Yr'].concat(SP.MONTHS));
  for (const [key, name] of EX_CURVES) {
    const g = s.goals && Array.isArray(s.goals[key]) && s.goals[key].length === 13 ? s.goals[key] : SP.GOALS_DEFAULT[key];
    ex_push(K, [{ v: name + ' (' + key + ')', s: EXS.lText }].concat(g.map(x => ex_cell(ex_num(x), EXS.lPct))));
  }
  ex_blank(K);
  ex_push(K, [{ v: 'Authorized entered ($M)', s: EXS.h11 }]);
  const auth = s.authorized && typeof s.authorized === 'object' ? Object.keys(s.authorized).filter(k => Number.isSafeInteger(s.authorized[k])) : [];
  if (!auth.length) ex_push(K, [{ v: 'None entered: Approved is shown in its place.', s: EXS.line }]);
  else {
    ex_headRow(K, ['Appropriation | FY', '$M']);
    auth.sort();
    for (const k of auth) {
      const [ap, fy] = k.split('|'), a = SP.APS.find(x => x.id === ap);
      ex_push(K, [{ v: (a ? a.label : ap) + ' FY' + fy, s: EXS.lText }, ex_cell(ex_M(s.authorized[k]), EXS.lM)]);
    }
  }
  ex_blank(K);
  ex_push(K, [{ v: 'Special CCaRs (a Not Allocated item under one of these is named by its Title)', s: EXS.h11 }]);
  const sp = Array.isArray(s.special) ? s.special : SP.SPECIAL_CCARS_DEFAULT;
  if (!sp.length) ex_push(K, [{ v: 'None.', s: EXS.line }]);
  for (const x of sp) ex_push(K, [{ v: String(x ?? ''), s: EXS.line }]);
  ex_blank(K);
  ex_push(K, [{ v: 'Budgets (every Budget name in the pulls)', s: EXS.h11 }]);
  ex_headRow(K, ['Name', 'Rows', '$M', 'Service', 'Lane', 'Override']);
  const bt = SP.budgetTable ? SP.budgetTable(pulls || {}, s) : [];
  for (const b of bt) {
    const ov = b.override ? [b.override.svc ? 'Service: ' + b.override.svc : '', b.override.lane ? 'Lane: ' + SP.LANE_WORDS[b.override.lane] : '']
      .filter(Boolean).join('; ') : '';
    ex_push(K, [{ v: b.name === '' ? '(blank)' : String(b.name), s: EXS.lText }, { v: b.rows, s: EXS.lFy }, ex_cell(ex_M(b.cents), EXS.lM),
      { v: b.svc + (b.unknown ? '  (no rule names a service: check this name)' : ''), s: EXS.lText },
      { v: SP.LANE_WORDS[b.lane] || b.lane, s: EXS.lText }, { v: ov, s: EXS.lText }]);
  }
  return K.sh;
}

// ---------------------------------------------------------------------------------------------------------------
// THE WORKBOOK
// ---------------------------------------------------------------------------------------------------------------
// every sheet of §8, in §8's order: Summary, Slide Snapshots, each appropriation, each PMO, Not Allocated, the raw data
// of each appropriation with a pull, the Import Report and the Settings
SP.excelSpec = function excelSpec(model, pulls, settings, meta) {
  const M = model;
  if (!M || !Array.isArray(M.blocks)) throw new Error('The workbook needs a model; there is none to write.');
  pulls = pulls && typeof pulls === 'object' ? pulls : {};
  const sheets = [ex_summary(M), ex_slides(M)];
  for (const a of M.aps) sheets.push(ex_apSheet(M, a, pulls));
  for (const p of M.pmos) sheets.push(ex_pmoSheet(M, p));
  sheets.push(ex_naSheet(M));
  for (const a of SP.APS) {
    const p = pulls[a.id];
    if (p && Array.isArray(p.rows)) sheets.push(ex_rawSheet(M, a, p, settings));
  }
  sheets.push(ex_reportSheet(M, pulls, meta || {}));
  sheets.push(ex_settingsSheet(M, pulls, settings));
  return { creator: 'SFCB Spend Plan', sheets };
};
SP.excelBytes = async function excelBytes(model, pulls, settings, meta) {
  return SP.writeXlsx(SP.excelSpec(model, pulls, settings, meta));
};
// 'SFCB Spend Plan FY2027 - data through Oct-2026 - 2026-11-09.xlsx', and ' [filtered]' before the extension when the
// switches hide anything: a filtered workbook emailed on must say so in the one place everyone reads, its name
SP.excelFileName = function excelFileName(model, today) {
  const day = typeof today === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(today) ? today : ex_today();
  return 'SFCB Spend Plan FY' + model.E + ' - data through ' + model.asOfLabel + ' - ' + day
    + (model.shown && model.shown.all ? '' : ' [filtered]') + '.xlsx';
};

// The UI action: the model from the saved state and this browser's switches, the workbook, the download, and a sentence
// saying what was written. A failure is said, never thrown past the button.
SP.exportExcel = async function exportExcel() {
  try {
    const st = SP.state && typeof SP.state === 'object' ? SP.state : null;
    const pulls = st && st.pulls && st.pulls.current && typeof st.pulls.current === 'object' ? st.pulls.current : {};
    if (!SP.APS.some(a => pulls[a.id] && Array.isArray(pulls[a.id].rows))) {
      return { ok: false, message: 'There is nothing to export yet: import a CCaR pull first.' };
    }
    const today = ex_today();
    const settings = st.settings && typeof st.settings === 'object' ? st.settings : SP.defaultSettings(today);
    let view = null;
    if (typeof SP.getView === 'function') { try { view = SP.getView(); } catch (e) { view = null; } }
    if (!view || typeof view !== 'object') view = SP.defaultView();
    const model = SP.buildModel(pulls, settings, view);
    const bytes = await SP.excelBytes(model, pulls, settings, { report: st.lastImport && st.lastImport.report, today });
    const name = SP.excelFileName(model, today);
    SP.download(name, bytes, EX_MIME);
    const N = SP.lastXlsxNotes || { sheets: 0, messages: [] };
    let msg = 'Wrote “' + name + '”: ' + N.sheets + ' sheets, ' + SP.fmtInt(Math.round(bytes.length / 1024)) + ' KB.';
    if (!model.shown.all) msg += ' It is filtered: ' + model.shown.text + '.';
    if (N.messages && N.messages.length) msg += ' ' + N.messages.join(' ');
    return { ok: true, message: msg, name, sheets: N.sheets, size: bytes.length };
  } catch (e) {
    return { ok: false, message: 'The workbook was not written: ' + ((e && e.message) || String(e)) };
  }
};

// ===== 70-pictures.js =====
// §10 PICTURES — one slide block as a picture for PowerPoint (CONTRACT §10).
//
//   SP.blockCanvas(block, model)            -> a 2000 x 675 canvas: the block from its title bar through OSD Status
//   await SP.blockPng(block, model)         -> a PNG Blob of it
//   await SP.copyBlockPicture(block, model) -> {ok, message}: the PNG on the clipboard, or why not
//   await SP.allPicturesZip(model)          -> a zip Blob, one '{Ap} FY{fy}.png' per block
//
// 2000 x 675 px is 13.33 x 4.5 in at 150 dpi, the slide region v12's instructions named. v12 asked people to select a
// cell range and Copy as Picture, which came out about 1,664 x 286 px (5.8 : 1) against that 2.96 : 1 region, with the
// FY+ column hidden (FINDINGS look §10.2). Here the block is drawn to the region's own shape, every column shown.
//
// Every figure is READ from the model (SP.buildModel), printed with the tool's own formats: the picture, the screens and
// the workbook print the same numbers, so a slide can never disagree with the workbook it came from. Canvas text is
// never parsed as markup, so a hostile plan event is drawn as the characters it is.

// ---------------------------------------------------------------------------------------------------------------
// THE LOOK: §8's colours and words (FINDINGS "### look")
// ---------------------------------------------------------------------------------------------------------------
const PIC_W = 2000, PIC_H = 675;
const PIC = Object.freeze({
  navy: '#1F3A68', gold: '#FFE699', box: '#404040', grid: '#808080', ink: '#1A1A1A', closed: '#F2F2F2', plan: '#808080',
  white: '#FFFFFF', filtered: '#8A3A00',
  status: Object.freeze({ green: '#00B050', yellow: '#FFD700', red: '#C00000' }),
  // white on red and green, black on yellow: the word must be readable on its own colour, which never stands alone
  statusInk: Object.freeze({ green: '#FFFFFF', yellow: '#000000', red: '#FFFFFF' }),
});
const PIC_FONT = 'Calibri, Carlito, "Segoe UI", Arial, sans-serif';
// The picture's own frame, in canvas pixels: the CUI marking in a band at the top and the bottom, and the table in
// the region between, never under either band.
const PIC_CUI_BAND = 30, PIC_CUI_PX = 18, PIC_MARGIN = 16, PIC_SHOWN_H = 26;
// The table in its own units (about a pixel at 1:1), scaled as a whole to the region afterwards. Sizes follow v12:
// title bar 14 pt, header 11 pt, PMO rows 11 pt, the totals band 10 pt.
const PIC_T = Object.freeze({
  titleH: 34, headH: 30, rowH: 22, spacerH: 10, padX: 7, minNumW: 64,
  labelMax: 520,              // a longer PMO name wraps in its cell rather than squeezing every figure on the slide
  fTitle: 19, fHead: 14, fPmo: 14.5, fBand: 13.3,
  lPmo: 17, lBand: 16,        // line heights, for a label that wraps
});
function pic_font(px, bold, italic) { return (italic ? 'italic ' : '') + (bold ? 'bold ' : '') + px + 'px ' + PIC_FONT; }

// ---------------------------------------------------------------------------------------------------------------
// LAYOUT: what goes in each cell, and how wide and tall everything is before scaling. Kept apart from the drawing, so
// a test can hold the layout to the region without reading pixels, and the pixels to the layout.
// ---------------------------------------------------------------------------------------------------------------
function pic_cols(model) { return model.cols.filter(c => c.id !== 'nodate' || model.showNoDate); }
function pic_money(c) { return typeof c === 'number' && isFinite(c) ? SP.fmtM(c) : ''; }
function pic_pct(x) { return typeof x === 'number' && isFinite(x) ? SP.fmtPct(x) : ''; }
// words into lines no wider than maxW; a word wider than a line is broken by characters, never left to run out
function pic_wrap(ctx, text, maxW) {
  const words = String(text).split(/\s+/).filter(w => w !== '');
  const lines = [];
  let cur = '';
  const push = w => {
    if (ctx.measureText(w).width <= maxW) return w;
    let piece = '';
    for (const ch of w) {
      if (piece && ctx.measureText(piece + ch).width > maxW) { lines.push(piece); piece = ch; } else piece += ch;
    }
    return piece;
  };
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (!cur || ctx.measureText(t).width <= maxW) { cur = cur ? t : push(w); continue; }
    lines.push(cur);
    cur = push(w);
  }
  if (cur || !lines.length) lines.push(cur);
  return lines;
}

// cell: {t: text, align: 'l'|'r'|'c', font, ink, fill, swatch?: status colour (a plan status)}
function pic_layout(ctx, block, model) {
  const T = PIC_T;
  const V = pic_cols(model);
  const nNum = V.length + 2;                 // Total, the columns, Total
  const fPmoB = pic_font(T.fPmo, true), fBandB = pic_font(T.fBand, true), fPlan = pic_font(T.fBand, true, true);
  const cell = (t, align, font, ink, fill) => ({ t, align, font, ink, fill: fill || null });
  const closedFill = c => (c.closed ? PIC.closed : null);
  const rows = [];
  // the header
  rows.push({ kind: 'head', cells: [cell('PMO', 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold), cell('Total', 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold)]
    .concat(V.map(c => cell(c.label, 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold)), [cell('Total', 'c', pic_font(T.fHead, true), PIC.ink, PIC.gold)]) });
  // the PMO rows: every PMO with money in the block (§6 item 11), never a typed list
  for (const p of block.pmoRows || []) {
    rows.push({ kind: 'pmo', cells: [cell(p.label, 'l', fPmoB, PIC.navy), cell(pic_money(p.total), 'r', fPmoB, PIC.navy)]
      .concat(V.map(c => cell(pic_money(p.cols[c.index]), 'r', fPmoB, PIC.navy, closedFill(c))), [cell(pic_money(p.total), 'r', fPmoB, PIC.navy)]) });
  }
  rows.push({ kind: 'spacer', cells: [] });
  const band = (label, tot, each) => ({ kind: 'band', cells: [cell(label, 'r', fBandB, PIC.navy), tot].concat(V.map(each), [tot]) });
  rows.push(band('Monthly Totals', cell(pic_money(block.approved), 'r', fBandB, PIC.navy),
    c => cell(pic_money(block.cols[c.index]), 'r', fBandB, PIC.navy, closedFill(c))));
  // the running sum ends in the last dated column; No date is outside it (§4.5), so its cell stays empty
  rows.push(band('Cumulative Totals', cell(pic_money(block.approved), 'r', fBandB, PIC.navy),
    c => cell(c.id === 'nodate' ? '' : pic_money(block.cum[c.index]), 'r', fBandB, PIC.navy, closedFill(c))));
  // the label in the one wording the screen and the workbook use too (SP.oblLabel: '0.00M', never '-M', review R7)
  rows.push(band(SP.oblLabel(block, model),
    cell(pic_pct(block.oblPct), 'c', fBandB, PIC.navy),
    c => {
      const o = block.obl[c.index] || {};
      // a planned percentage is not an obligation: italic and grey, as §8 prints it
      return o.kind === 'plan' ? cell(pic_pct(o.v), 'c', fPlan, PIC.plan, closedFill(c)) : cell(pic_pct(o.v), 'c', fBandB, PIC.navy, closedFill(c));
    }));
  rows.push(band('OSD Goal %', cell(pic_pct(block.goal), 'c', fBandB, PIC.navy), c => cell(pic_pct(block.goalC[c.index]), 'c', fBandB, PIC.navy, closedFill(c))));
  const st = (status, plan) => {
    if (!status || !PIC.status[status]) return cell('', 'c', fBandB, PIC.ink, PIC.gold);   // no goal here: v12's base fill, no word
    const word = SP.statusWord(status);
    // a plan status: its fill and readable ink, in italic, as the workbook prints it (integration ruling)
    if (plan) return cell(word, 'c', fPlan, PIC.statusInk[status], PIC.status[status]);
    return cell(word, 'c', fBandB, PIC.statusInk[status], PIC.status[status]);
  };
  rows.push(band('OSD Status', st(block.status, false), c => { const s = block.statusC[c.index] || {}; return st(s.status, s.kind === 'plan'); }));

  // widths: each column as wide as its widest text, the label column up to labelMax (wider labels wrap)
  const widths = new Array(nNum + 1).fill(0);
  for (const r of rows) {
    r.cells.forEach((c, j) => {
      if (!c.t) return;
      ctx.font = c.font;
      let w = ctx.measureText(c.t).width + 2 * T.padX + (c.swatch ? 14 : 0);
      if (j === 0) w = Math.min(w, T.labelMax);
      widths[j] = Math.max(widths[j], w);
    });
  }
  for (let j = 1; j <= nNum; j++) widths[j] = Math.max(widths[j], T.minNumW);
  widths[0] = Math.max(widths[0], 160);
  // heights: a label that wraps makes its row taller; nothing is cut
  for (const r of rows) {
    if (r.kind === 'head') { r.h = T.headH; continue; }
    if (r.kind === 'spacer') { r.h = T.spacerH; continue; }
    const lab = r.cells[0];
    ctx.font = lab.font;
    lab.lines = pic_wrap(ctx, lab.t, widths[0] - 2 * T.padX);
    const lh = r.kind === 'pmo' ? T.lPmo : T.lBand;
    r.h = Math.max(T.rowH, lab.lines.length * lh + 6);
    r.lh = lh;
  }
  const title = (block.apLabel || '') + ' FY' + block.fy + ' - Spend Plan (PMO Summary, slide-ready)';
  ctx.font = pic_font(T.fTitle, true);
  const tableW = widths.reduce((a, b) => a + b, 0);
  const natW = Math.max(tableW, ctx.measureText(title).width + 2 * T.padX + 8);
  if (natW > tableW) widths[0] += natW - tableW;   // a title wider than the table widens the label column, so the bar covers the table
  const natH = T.titleH + rows.reduce((a, r) => a + r.h, 0);

  // the region and the scale: fit the width, then shrink further if the height would not fit (CONTRACT §10)
  const shown = model.shown && !model.shown.all ? String(model.shown.text || '') : '';
  const top = PIC_CUI_BAND + (shown ? PIC_SHOWN_H : 0) + 4;
  const region = { x: PIC_MARGIN, y: top, w: PIC_W - 2 * PIC_MARGIN, h: PIC_H - PIC_CUI_BAND - 4 - top };
  let scale = region.w / natW;
  if (natH * scale > region.h) scale = region.h / natH;
  const ox = region.x + (region.w - natW * scale) / 2, oy = region.y + (region.h - natH * scale) / 2;
  return { title, rows, widths, natW, natH, scale, ox, oy, region, shown, nCols: nNum + 1,
    box: { x: ox, y: oy, w: natW * scale, h: natH * scale },
    cui: { top: { y: 0, h: PIC_CUI_BAND }, bottom: { y: PIC_H - PIC_CUI_BAND, h: PIC_CUI_BAND } } };
}

// ---------------------------------------------------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------------------------------------------------
function pic_text(ctx, c, x, y, w, h, lines, lh) {
  if (!c.t) return;
  ctx.font = c.font;
  ctx.fillStyle = c.ink;
  ctx.textBaseline = 'middle';
  const T = PIC_T;
  const ls = lines || [c.t];
  const first = y + h / 2 - ((ls.length - 1) * (lh || 0)) / 2;
  ls.forEach((t, i) => {
    const yy = first + i * (lh || 0);
    if (c.swatch) {
      // a swatch beside a word (no caller draws one since the integration ruling; kept for a cell that asks)
      const tw = ctx.measureText(t).width, sw = 10, all = sw + 4 + tw;
      const sx = x + (w - all) / 2;
      ctx.fillStyle = c.swatch;
      ctx.fillRect(sx, yy - sw / 2, sw, sw);
      ctx.strokeStyle = PIC.grid; ctx.lineWidth = 0.75;
      ctx.strokeRect(sx, yy - sw / 2, sw, sw);
      ctx.fillStyle = c.ink;
      ctx.textAlign = 'left';
      ctx.fillText(t, sx + sw + 4, yy);
      return;
    }
    if (c.align === 'l') { ctx.textAlign = 'left'; ctx.fillText(t, x + T.padX, yy); }
    else if (c.align === 'r') { ctx.textAlign = 'right'; ctx.fillText(t, x + w - T.padX, yy); }
    else { ctx.textAlign = 'center'; ctx.fillText(t, x + w / 2, yy); }
  });
}

SP.blockCanvas = function blockCanvas(block, model) {
  if (!block || !model || !Array.isArray(model.cols)) throw new Error('There is no block to draw.');
  const cv = document.createElement('canvas');
  cv.width = PIC_W; cv.height = PIC_H;
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) throw new Error('This browser cannot draw pictures (it has no canvas), so no picture was made.');
  ctx.fillStyle = PIC.white;
  ctx.fillRect(0, 0, PIC_W, PIC_H);
  const L = pic_layout(ctx, block, model);
  // the CUI marking, top and bottom, outside the table's region (§6 item 14)
  ctx.fillStyle = '#000000';
  ctx.font = pic_font(PIC_CUI_PX, true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(SP.CUI, PIC_W / 2, PIC_CUI_BAND / 2);
  ctx.fillText(SP.CUI, PIC_W / 2, PIC_H - PIC_CUI_BAND / 2);
  // what the picture shows, when not everything is shown (§4.3): a slide is a product too
  if (L.shown) {
    ctx.fillStyle = PIC.filtered;
    ctx.font = pic_font(16, true, true);
    ctx.textAlign = 'left';
    ctx.fillText(L.shown, PIC_MARGIN, PIC_CUI_BAND + PIC_SHOWN_H / 2 + 2, PIC_W - 2 * PIC_MARGIN);
  }
  ctx.save();
  ctx.setTransform(L.scale, 0, 0, L.scale, L.ox, L.oy);
  const T = PIC_T, W = L.natW;
  // the title bar
  ctx.fillStyle = PIC.navy;
  ctx.fillRect(0, 0, W, T.titleH);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, T.titleH); ctx.clip();
  ctx.fillStyle = PIC.white; ctx.font = pic_font(T.fTitle, true); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(L.title, T.padX + 4, T.titleH / 2);
  ctx.restore();
  ctx.strokeStyle = PIC.box; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, T.titleH - 2);
  // the rows
  let y = T.titleH;
  for (const r of L.rows) {
    if (r.kind === 'spacer') { y += r.h; continue; }
    let x = 0;
    r.cells.forEach((c, j) => {
      const w = L.widths[j];
      if (c.fill) { ctx.fillStyle = c.fill; ctx.fillRect(x, y, w, r.h); }
      pic_text(ctx, c, x, y, w, r.h, j === 0 && c.lines ? c.lines : null, r.lh);
      if (r.kind === 'head') { ctx.strokeStyle = PIC.box; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, r.h - 2); }
      else { ctx.strokeStyle = PIC.grid; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, r.h - 1); }
      x += w;
    });
    y += r.h;
  }
  ctx.restore();
  return cv;
};

// The PNG is encoded with toDataURL, synchronously, not with toBlob. Measured at integration in Chromium on the real
// workbook: with the Slide blocks view on screen, toBlob on a canvas that is not in the page waited about a second
// for the browser's idle time on every picture (Save all pictures took 17 s for 11 blocks); toDataURL takes about 20 ms.
// toBlob stays as the way out for a browser whose toDataURL does not give a PNG.
function pic_dataUrlBlob(url) {
  const i = url.indexOf(',');
  if (!/^data:image\/png;base64,/.test(url.slice(0, i + 1))) return null;
  const bin = atob(url.slice(i + 1));
  const a = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
  return new Blob([a], { type: 'image/png' });
}
SP.blockPng = function blockPng(block, model) {
  return new Promise((resolve, reject) => {
    let cv;
    try { cv = SP.blockCanvas(block, model); } catch (e) { reject(e); return; }
    const fail = () => new Error('The picture of ' + block.apLabel + ' FY' + block.fy + ' could not be made into a PNG.');
    if (typeof cv.toDataURL === 'function') {
      let b = null;
      try { b = pic_dataUrlBlob(cv.toDataURL('image/png')); } catch (e) { b = null; }

    }

// The clipboard. The PNG goes to the clipboard as a PROMISE: Safari honours a write only when it starts in the click
// itself, and drawing first would end that. Where the browser refuses (no permission, an old browser, a locked-down
// profile), the reason is said in plain words and Save picture, which always works, is offered instead.
SP.copyBlockPicture = async function copyBlockPicture(block, model) {
  const name = (block && block.apLabel ? block.apLabel + ' FY' + block.fy : 'this block');
  const instead = ' Use Save picture to keep it as a file instead.';
  const cb = typeof navigator !== 'undefined' ? navigator.clipboard : null;
  if (!cb || typeof cb.write !== 'function' || typeof ClipboardItem !== 'function') {
    return { ok: false, message: 'This browser does not let a page put a picture on the clipboard, so the picture of ' + name + ' was not copied.' + instead };
  }
  const png = SP.blockPng(block, model);
  png.catch(() => {});      // the failure is reported once, below, never as an unhandled rejection besides
  try {
    await cb.write([new ClipboardItem({ 'image/png': png })]);
  } catch (e) {
    let why;
    try { await png; why = null; } catch (e2) { why = 'it could not be drawn: ' + ((e2 && e2.message) || e2); }
    if (!why) why = e && e.name === 'NotAllowedError' ? 'the browser did not allow this page to use the clipboard'
      : 'the clipboard refused it' + (e && e.message ? ': ' + e.message : '');
    return { ok: false, message: 'The picture of ' + name + ' was not copied: ' + why + '.' + instead };
  }

SP.allPicturesZip = async function allPicturesZip(model) {
  if (!model || !Array.isArray(model.blocks) || !model.blocks.length) throw new Error('There is no block to draw, so no pictures were made.');
  const files = [];
  for (const b of model.blocks) files.push({ name: b.apLabel + ' FY' + b.fy + '.png', data: await SP.blockPng(b, model) });
  return new Blob([await SP.zipFiles(files)], { type: 'application/zip' });
};

// ===== 80-store.js =====
// §11 STORE — the state, opening it, saving it, and this browser's switches (CONTRACT §11).
//
//   SP.storeInit()            -> {ok, message}   read the state baked into this page; call ONCE, before the UI draws
//   SP.state                  the state (CONTRACT §11): {v, tool, savedAt, settings, pulls:{current, previous}, history, lastImport}
//   SP.getView() / SP.setView(view)              this browser's switches (localStorage 'sfcbsp.view'), never the file's
//   SP.applyImport(parsed)    -> {message}       SP.parseFiles's result, put into the state
//   SP.setSettings(patch)                        merge into settings; marks the file unsaved when anything changed
//   SP.isDirty()              -> bool            work this page holds that its file does not
//   SP.onStateChange(fn)      -> unsubscribe     called after an import, a settings change or a save
//   await SP.saveFile()       -> {ok, message}   write this page's own file (or download it where the browser cannot)
//   await SP.saveCopy()       -> {ok, message}   write a new file
//   SP.savedHtml()            -> string          the page as a file: the captured page, the state in its tag, #app reset
//
// THE FILE IS THE DATABASE. The state lives in <script id="spState" type="application/json"> and nowhere else: browser
// storage holds only the switches, because the file is what travels on the share and what anyone else opens. A value
// that is not in the file is not saved, whatever this browser remembers.

// ---------------------------------------------------------------------------------------------------------------
// WHAT THE STATE IS
// ---------------------------------------------------------------------------------------------------------------
const ST_TOOL = 'sfcb-spend-plan';
const ST_V = 1;
const ST_VIEW_KEY = 'sfcbsp.view';     // ORBIT's prio27*/spmt* share this file:// origin; ours never collide with them

}

let st_base = null;              // the savedAt of this page's own file as last read or written: Save's collision check
let st_baseWhy = '';             // why the opened state was refused (ST_REFUSED), for the question Save then asks
let st_handle = null;            // this page's own file, once picked and checked; remembered for the session only
let st_busy = false;
let st_inited = false;
let st_cap = null;               // the page as captured at boot: {html, stateAt, stateLen, stateOpen, appAt, appLen, appOpen, boot}
let st_view = null;
let st_unloadOn = false;
const st_subs = [];

}

// ---------------------------------------------------------------------------------------------------------------
// SMALL WORDS
// ---------------------------------------------------------------------------------------------------------------
function st_pad(n) { return String(n).padStart(2, '0'); }

}
function st_when(iso) {

function st_apLabel(ap) {

}

}
function st_rows(n) { return (SP.fmtInt ? SP.fmtInt(n) : String(n)) + (n === 1 ? ' row' : ' rows'); }
// the name of the file this page was opened from: what Save asks the person to pick, and what a download is called
function st_pageName() {

  return /\.html?$/i.test(n) ? n : 'sfcb-spend-plan.html';
}
function st_copyName() {

}
// Said while a file window is open, where the page has a way to say it (SP.say, when the screens provide one). The
// picker itself cannot carry a sentence, only the name of its file type, which names the file too.
function st_say(text) {
  if (typeof SP.say === 'function') { try { SP.say(text, 'info'); } catch (e) {} }
}

// ---------------------------------------------------------------------------------------------------------------
// IS THIS A STATE THIS PAGE CAN USE? '' when it is, else the reason in words. Checked on opening, before anything reads
// it: a file is input like any other, and a state that half-loads draws a board that looks complete and is not.
// ---------------------------------------------------------------------------------------------------------------
function st_checkRows(rows, where) {
  if (!Array.isArray(rows)) return where + ' has no list of rows';
  const N = SP.RAW_HEADERS.length;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!st_isObj(r) || !Array.isArray(r.c)) return where + ', row ' + (i + 1) + ', is not a row';
    if (r.c.length !== N) return where + ', row ' + (i + 1) + ', has ' + r.c.length + ' values, not ' + N;
    for (let k = 0; k < N; k++) {
      const v = r.c[k];
      if (v !== null && typeof v !== 'string' && !(typeof v === 'number' && isFinite(v))) {
        return where + ', row ' + (i + 1) + ', has a ' + SP.RAW_HEADERS[k] + ' that is neither text nor a number';
      }
    }
    if (r.x !== undefined && !st_isObj(r.x)) return where + ', row ' + (i + 1) + ', has extra columns that are not a list of named values';
    if (r.src !== undefined && !Array.isArray(r.src)) return where + ', row ' + (i + 1) + ', does not say where it came from';
    if (r.bad !== undefined && !Array.isArray(r.bad)) return where + ', row ' + (i + 1) + ', has reasons that are not a list';
  }

}
function st_checkPulls(side, name) {
  if (!st_isObj(side)) return 'its ' + name + ' pulls are not a set of pulls';
  for (const k of Object.keys(side)) {
    if (!ST_PULL_KEYS.includes(k)) return 'its ' + name + ' pulls hold “' + k + '”, which is not an appropriation';
    const p = side[k];
    const where = 'the ' + name + ' ' + (k === 'unidentified' ? 'unidentified rows' : st_apLabel(k) + ' pull');
    if (!st_isObj(p)) return where + ' is not a pull';
    const bad = st_checkRows(p.rows, where);
    if (bad) return bad;
    if (p.importedAt !== undefined && p.importedAt !== null && typeof p.importedAt !== 'string') return where + ' has an import time that is not a time';
  }
  return '';
}
function st_checkSettings(s) {
  if (s === null || s === undefined) return '';
  if (!st_isObj(s)) return 'its settings are not a set of settings';
  // the model cannot place a single column without it, so a bad one would leave every screen blank
  if (!(typeof s.asOf === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s.asOf))) return 'its Data through month (' + JSON.stringify(s.asOf ?? null) + ') is not a month written YYYY-MM';
  if (s.firstFY !== undefined && !Number.isInteger(s.firstFY)) return 'its First FY is not a year';
  for (const k of ['goals', 'authorized', 'budgets']) if (s[k] !== undefined && !st_isObj(s[k])) return 'its ' + k + ' setting is not a table';
  if (s.special !== undefined && !(Array.isArray(s.special) && s.special.every(x => typeof x === 'string'))) return 'its special CCaRs are not a list of names';
  return '';
}
function st_check(st) {
  if (!st_isObj(st)) return 'it is not a saved plan';
  if (st.tool !== ST_TOOL) return 'it was saved by another tool' + (typeof st.tool === 'string' && st.tool ? ' (“' + st.tool + '”)' : '');
  if (st.v !== ST_V) {
    return typeof st.v === 'number' && st.v > ST_V
      ? 'it was saved by a newer version of this tool (format ' + st.v + '; this page reads format ' + ST_V + ')'
      : 'its format (' + JSON.stringify(st.v ?? null) + ') is not one this page reads';
  }
  if (st.savedAt !== null && st.savedAt !== undefined && typeof st.savedAt !== 'string') return 'its save time is not a time';
  if (!st_isObj(st.pulls)) return 'it holds no pulls in the shape this page reads';
  const bad = st_checkPulls(st.pulls.current, 'current') || st_checkPulls(st.pulls.previous, 'previous');
  if (bad) return bad;
  const sb = st_checkSettings(st.settings);
  if (sb) return sb;
  if (st.history !== undefined && !(Array.isArray(st.history) && st.history.every(st_isObj))) return 'its import history is not a list of imports';
  if (st.lastImport !== undefined && st.lastImport !== null && !st_isObj(st.lastImport)) return 'its last import report is not a report';
  return '';
}

// ---------------------------------------------------------------------------------------------------------------
// CAPTURING THE PAGE. Save writes back the page as it was LOADED, never the page as it is now: by then the UI has drawn
// thousands of rows into #app, and a file saved with them would open showing a frozen screen under the live one. The
// state tag and #app are found by their own serialised text in the capture, so each is replaced exactly where it is.
// ---------------------------------------------------------------------------------------------------------------
function st_capture() {
  if (st_cap) return st_cap;
  const root = document.documentElement;
  const html = '<!DOCTYPE html>\n' + (root ? root.outerHTML : '');
  const cap = { html, stateAt: -1, stateOpen: '', stateLen: 0, appAt: -1, appOpen: '', appLen: 0, boot: ST_BOOT_NOTE };
  const app = document.getElementById('app');
  if (app) {
    const outer = app.outerHTML, inner = app.innerHTML;
    const at = html.indexOf(outer);
    if (at >= 0 && outer.endsWith(inner + '</div>')) {
      cap.appAt = at; cap.appLen = outer.length; cap.appOpen = outer.slice(0, outer.length - inner.length - '</div>'.length);
      // the shell's own boot note, as this browser serialises it, when the capture came before the UI drew
      const kids = [...app.childNodes].filter(n => !(n.nodeType === 3 && !n.textContent.trim()));
      if (kids.length === 1 && kids[0].nodeType === 1 && kids[0].classList && kids[0].classList.contains('boot-note')) cap.boot = inner;
    }
  }
  const tag = document.getElementById('spState');
  if (tag) {
    const outer = tag.outerHTML, text = tag.textContent;
    // searched for after #app, where the shell puts it: the program's own text can never hold a closing script tag
    const at = html.indexOf(outer, cap.appAt >= 0 ? cap.appAt + cap.appLen : 0);
    const close = '<' + '/script>';
    if (at >= 0 && outer.endsWith(text + close)) {
      cap.stateAt = at; cap.stateLen = outer.length; cap.stateOpen = outer.slice(0, outer.length - text.length - close.length);
    }
  }
  st_cap = cap;
  return cap;
}
// JSON with every '<' written as its JSON escape (a backslash, then u003c). Without it a plan event holding a closing
// script tag would end the tag there and truncate the file: the next opening would see half a state, or none.
function st_json(state) { return JSON.stringify(state).replace(/</g, '\\u003c'); }
function st_htmlFor(state) {
  const cap = st_capture();
  const close = '<' + '/script>';
  const tag = '<script id="spState" type="application/json">' + st_json(state) + close;
  let h = cap.html;
  // spliced from the end backwards, so the earlier position still holds after the later one changes length
  const parts = [];
  if (cap.stateAt >= 0) parts.push({ at: cap.stateAt, len: cap.stateLen, text: cap.stateOpen + st_json(state) + close });
  if (cap.appAt >= 0) parts.push({ at: cap.appAt, len: cap.appLen, text: cap.appOpen + cap.boot + '</div>' });
  parts.sort((a, b) => b.at - a.at);
  for (const p of parts) h = h.slice(0, p.at) + p.text + h.slice(p.at + p.len);
  if (cap.stateAt < 0) {
    // a page with no state tag (not one this build writes) still saves its data: the tag goes before the program
    const at = h.search(/<\/body>/i);
    h = at >= 0 ? h.slice(0, at) + tag + '\n' + h.slice(at) : h + tag;
  }
  return h;
}
SP.savedHtml = function savedHtml() { return st_htmlFor(SP.state); };

// ---------------------------------------------------------------------------------------------------------------
// OPENING
// ---------------------------------------------------------------------------------------------------------------
SP.storeInit = function storeInit() {
  // a second call must not capture again: by then the UI has drawn, and the capture is what every Save writes back
  if (st_inited) return { ok: true, message: '' };
  st_inited = true;
  st_capture();
  st_view = st_loadView();
  if (!st_unloadOn && typeof window.addEventListener === 'function') {
    window.addEventListener('beforeunload', st_beforeUnload);
    st_unloadOn = true;
  }
  SP.state = st_empty();
  st_dirty = false; st_base = null; st_baseWhy = '';
  const tag = document.getElementById('spState');
  const text = tag ? String(tag.textContent || '').trim() : '';
  if (!tag || text === '' || text === 'null') return { ok: true, message: '' };
  let st;
  try { st = JSON.parse(text); }
  catch (e) {
    st_base = ST_REFUSED; st_baseWhy = 'its saved data cannot be read';
    return { ok: false, message: 'The data saved in this file cannot be read (' + ((e && e.message) || e) + '), so the page opened empty. '
      + 'The file itself is unchanged; Save will not write over data it cannot read.' };
  }
  if (st === null) return { ok: true, message: '' };
  const why = st_check(st);
  if (why) {
    st_base = ST_REFUSED; st_baseWhy = why;
    return { ok: false, message: 'The data saved in this file was not opened: ' + why + '. The page opened empty, and the file itself is '
      + 'unchanged; Save asks before writing over it.' };
  }
  if (!Array.isArray(st.history)) st.history = [];
  if (st.lastImport === undefined) st.lastImport = null;
  if (st.savedAt === undefined) st.savedAt = null;
  SP.state = st;
  st_base = st.savedAt;
  const aps = SP.APS.filter(a => st.pulls.current[a.id]).map(a => a.label);
  return { ok: true, message: (st.savedAt ? 'Opened the plan saved ' + st_when(st.savedAt) : 'Opened the saved plan')
    + (aps.length ? ' (' + st_list(aps) + ').' : '; it holds no pull yet.') };
};
function st_beforeUnload(ev) {
  if (!st_dirty) return undefined;

  ev.preventDefault();
  ev.returnValue = '';
  return '';
}

// ---------------------------------------------------------------------------------------------------------------
// THE SWITCHES: this browser's view, kept in localStorage and never in the file. Storage may be refused (a private
// window, a locked-down profile, file:// in some browsers): every touch is in a try, and the page works without it.
// ---------------------------------------------------------------------------------------------------------------
function st_defaultView() {
  if (typeof SP.defaultView === 'function') return SP.defaultView();

  for (const s of SP.SERVICES.concat([SP.SVC_UNKNOWN])) svc[s] = true;
  return { svc, lane: { disc: true, mand: true } };
}
// only the known switches, only true or false: a stored view from another version cannot add a switch nothing draws
function st_cleanView(v) {

  for (const k of Object.keys(out.lane)) if (st_isObj(v.lane) && st_own(v.lane, k) && typeof v.lane[k] === 'boolean') out.lane[k] = v.lane[k];

SP.getView = function getView() {

};
SP.setView = function setView(view) {
  st_view = st_cleanView(view);
  try { window.localStorage.setItem(ST_VIEW_KEY, JSON.stringify(st_view)); } catch (e) { /* the switches still apply to this page */ }

// ---------------------------------------------------------------------------------------------------------------
// AN IMPORT (CONTRACT §11): each appropriation in it replaces that appropriation's current pull, and the pull it
// replaces becomes previous (What changed reads the two). Appropriations not in it keep theirs. The unidentified rows
// are handled the same way: they are the import's, so a new import's replace the last import's.
// ---------------------------------------------------------------------------------------------------------------
// approved and obligated per 'ap|fy' over every readable row, whatever the switches or the first FY: what this pull
// held, the figures What changed compares
function st_totals(pulls, settings) {
  const out = {};
  for (const a of SP.APS) {
    const p = pulls[a.id];
    if (!p || !Array.isArray(p.rows)) continue;
    for (const row of p.rows) {
      const d = SP.deriveRow(row, settings);
      if (d.bad || !Number.isInteger(d.fy) || !Number.isSafeInteger(d.cents)) continue;
      const k = a.id + '|' + d.fy;
      const t = out[k] || (out[k] = { approved: 0, obligated: 0 });
      t.approved += d.cents;
      if (d.status === 'exec') t.obligated += d.cents;
    }
  }
  return out;
}
SP.applyImport = function applyImport(parsed) {
  if (!st_isObj(parsed) || !st_isObj(parsed.pulls)) throw new Error('There was nothing to import (the import gave no pulls), so nothing was changed.');
  const keys = Object.keys(parsed.pulls).filter(k => ST_PULL_KEYS.includes(k) && parsed.pulls[k] && Array.isArray(parsed.pulls[k].rows));
  if (!keys.length) throw new Error('The import held no rows, so nothing was changed.');
  if (typeof SP.defaultSettings !== 'function') throw new Error('The model is not loaded (SP.defaultSettings is missing), so nothing was imported.');
  const report = st_isObj(parsed.report) ? parsed.report : {};
  const importedAt = typeof report.importedAt === 'string' && report.importedAt ? report.importedAt : new Date().toISOString();
  const st = SP.state;
  const before = {};
  for (const a of SP.APS) if (st.pulls.current[a.id]) before[a.id] = st.pulls.current[a.id];
  for (const k of keys) {
    if (st.pulls.current[k]) st.pulls.previous[k] = st.pulls.current[k];
    st.pulls.current[k] = st_clone(parsed.pulls[k]);
  }
  // The unidentified rows are the import's, not an appropriation's: an import that holds none replaces the last one's
  // with none. Kept, they outlived it, and the Summary went on naming them and sending the reader to an Import report
  // (the new import's) that does not list them (review R6).
  if (!keys.includes('unidentified') && st.pulls.current.unidentified) {
    st.pulls.previous.unidentified = st.pulls.current.unidentified;
    delete st.pulls.current.unidentified;
  }
  // the settings a person chose stay; only Data through follows the new pull (CONTRACT §4.1)
  const def = SP.defaultSettings(importedAt);
  const first = !st_isObj(st.settings);
  const was = first ? null : st.settings.asOf;
  st.settings = first ? def : Object.assign({}, st.settings, { asOf: def.asOf });
  const aps = SP.APS.filter(a => keys.includes(a.id)).map(a => a.id);
  st.history.push({ importedAt, aps, totals: st_totals(st_pick(st.pulls.current, aps), st.settings) });
  st.lastImport = { report: st_clone(report) };
  st_changed();

  // what the person needs to know, in the order they need it
  const said = [];
  if (aps.length) {
    said.push('Imported ' + st_list(aps.map(ap => st_apLabel(ap) + ' (' + st_rows(st.pulls.current[ap].rows.length) + ')')) + '.');
  } else said.push('No row in this import could be placed in an appropriation.');
  const replaced = aps.filter(ap => before[ap]);
  if (replaced.length) said.push('The ' + st_list(replaced.map(st_apLabel)) + ' pull' + (replaced.length === 1 ? ' it replaces is' : 's it replaces are')
    + ' kept for What changed.');
  const kept = SP.APS.filter(a => before[a.id] && !aps.includes(a.id));
  if (kept.length) {
    const byDay = new Map();
    for (const a of kept) {
      const d = st_day(before[a.id].importedAt) || 'an unknown date';
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(a.label);
    }
    said.push([...byDay].map(([d, l]) => st_list(l) + ' keep' + (l.length === 1 ? 's its pull' : ' their pulls') + ' of ' + d).join('; ') + '.');
  }

// ---------------------------------------------------------------------------------------------------------------
// SAVING. The first Save in a page goes through the browser's OPEN window: a file picked there is read and checked
// before anything is written, where a Save window empties the file the moment it is picked (measured in Chromium for
// ORBIT, v2.14), so one wrong pick would lose a plan. A file that cannot be read, is not this tool, or holds another
// tool's data is never written over. One saved by someone else since this page last read or wrote it is written over
// only after the person says so.
// ---------------------------------------------------------------------------------------------------------------
const ST_TYPES = name => [{ description: 'SFCB Spend Plan — pick this file: ' + name, accept: { 'text/html': ['.html', '.htm'] } }];
// the file's text -> {state} (null when it holds none) or {why}: why it must not be written over
function st_readFile(txt) {
  if (typeof txt !== 'string' || !/<meta\s+name=["']?sfcb-spend-plan["'\s>]/i.test(txt)) return { why: 'is not an SFCB Spend Plan file' };
  const m = /<script\b[^>]*\bid=["']?spState["']?[^>]*>([\s\S]*?)<\/script\s*>/i.exec(txt);
  if (!m) return { why: 'is an SFCB Spend Plan page with no place for its data' };
  let st;
  try { st = JSON.parse(m[1].trim() || 'null'); } catch (e) { return { why: 'holds saved data that cannot be read' }; }
  if (st === null) return { state: null };
  if (!st_isObj(st)) return { why: 'holds saved data that is not a plan' };
  if (st.tool !== ST_TOOL) return { why: 'holds data saved by another tool' };
  return { state: st };
}
function st_abortish(e) { return !!e && (e.name === 'AbortError'); }
function st_err(e) { return (e && e.message) || String(e); }

  catch (e) { try { await w.abort(); } catch (e2) {} throw e; }
}

    if (typeof h.queryPermission === 'function') p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted' && typeof h.requestPermission === 'function') p = await h.requestPermission({ mode: 'readwrite' });
  } catch (e) { p = 'denied'; }

}
function st_saved(now, gen, h) {
  SP.state.savedAt = now;
  st_base = now; st_baseWhy = '';
  if (h) st_handle = h;
  if (gen === st_gen) st_dirty = false;   // an edit made while the file was being written is still unsaved
  st_fire();
}

SP.saveFile = async function saveFile() {
  if (st_busy) return { ok: false, message: 'A save is already running; nothing else was written.' };
  st_busy = true;
  try { return await st_saveFile(); }
  catch (e) { return { ok: false, message: 'Not saved: ' + st_err(e) + '. Nothing was written.' }; }
  finally { st_busy = false; }
};
async function st_saveFile() {
  const name = st_pageName();
  if (typeof window.showOpenFilePicker !== 'function') {
    // no way to write a file in place: the page is downloaded under its own name, and the person puts it in place
    const now = new Date().toISOString(), gen = st_gen;
    const html = st_htmlFor(Object.assign({}, SP.state, { savedAt: now }));
    const got = SP.download(name, html, 'text/html');
    st_saved(now, gen, null);
    return { ok: true, message: 'This browser cannot write to the file directly, so the plan was downloaded as “' + got + '”. '
      + 'The shared copy is not updated until you put the download in its place (replace “' + name + '” with it).' };
  }
  let h = st_handle, picked = false;
  if (!h) {
    st_say('Save: in the window that opened, pick this file — “' + name + '”, the one this page was opened from. Picking it changes '
      + 'nothing until it has been checked.');
    let hs;
    try { hs = await window.showOpenFilePicker({ multiple: false, types: ST_TYPES(name) }); }
    catch (e) {
      if (st_abortish(e)) return { ok: false, message: 'Not saved: no file was picked. Save again and pick “' + name + '”, the file this page was opened from.' };
      return { ok: false, message: 'Not saved: the file window could not open (' + st_err(e) + '). Use Save a copy… instead.' };
    }
    h = hs && hs[0];
    if (!h) return { ok: false, message: 'Not saved: no file was picked. Save again and pick “' + name + '”.' };
    picked = true;
  }
  const fname = h.name || name;
  let txt;
  try { txt = await (await h.getFile()).text(); }
  catch (e) {
    // a file that cannot be read cannot be checked, so it is never written over; a remembered one that has gone is forgotten
    if (!picked && e && e.name === 'NotFoundError') st_handle = null;
    return { ok: false, message: 'Not saved: “' + fname + '” could not be read (' + st_err(e) + '), so it was not written over. '
      + (e && e.name === 'NotFoundError' ? 'Save again and pick where the file is now.' : 'If it is syncing, try again in a moment, or use Save a copy….') };
  }
  const f = st_readFile(txt);
  if (f.why) {
    if (!picked) st_handle = null;      // the next Save asks which file, rather than failing here again
    return { ok: false, message: 'Not saved: “' + fname + '” ' + f.why + ', so it was not written over. Save again and pick “' + name
      + '”, the file this page was opened from, or use Save a copy….' };
  }
  const fs = f.state, fsAt = fs && typeof fs.savedAt === 'string' ? fs.savedAt : null;
  // the data this page refused on opening is still there (whatever its save time says, even none): never written over unasked
  const refusedHere = st_base === ST_REFUSED && !!fs && st_check(fs) !== '';
  if (fs && (refusedHere || (fsAt !== null && fsAt !== st_base))) {
    let q;
    if (refusedHere) {
      q = 'This page opened empty because the data saved in “' + fname + '” was not opened (' + (st_baseWhy || st_check(fs)) + ').\n\nSaving now writes over '
        + 'that data' + (fsAt ? ', saved ' + st_when(fsAt) : '') + ', and it is lost. Write over it?';
    } else {
      q = '“' + fname + '” was saved ' + st_when(fsAt) + (st_base && st_base !== ST_REFUSED ? ', after this page last opened or saved it (' + st_when(st_base) + ')'
        : ', after this page was opened') + ' — by someone else, or in another window.\n\nSaving now writes over that save, and whatever it added is lost. Write over it?';
    }
    if (!window.confirm(q)) {
      return { ok: false, message: refusedHere
        ? 'Not saved: you chose not to write over the data in “' + fname + '” that this page could not open. Nothing was written. To keep this work, use Save a copy…'
        : 'Not saved: “' + fname + '” was saved ' + st_when(fsAt) + ' by someone else, and you chose not to write over it. '
          + 'Nothing was written. To keep both, use Save a copy…; to see theirs, open the file.' };
    }
  }
  if (!(await st_permit(h))) return { ok: false, message: 'Not saved: writing to “' + fname + '” was not allowed. Nothing was written.' };
  const now = new Date().toISOString(), gen = st_gen;
  const html = st_htmlFor(Object.assign({}, SP.state, { savedAt: now }));
  try { await st_write(h, html); }
  catch (e) { return { ok: false, message: 'Not saved: “' + fname + '” could not be written (' + st_err(e) + '). Use Save a copy… to keep the work.' }; }
  st_saved(now, gen, h);
  return { ok: true, message: 'Saved to “' + fname + '” at ' + st_when(now).slice(11) + '.' };
}

SP.saveCopy = async function saveCopy() {

async function st_saveCopy() {
  const suggested = st_copyName();
  const now = new Date().toISOString(), gen = st_gen;
  const html = st_htmlFor(Object.assign({}, SP.state, { savedAt: now }));
  if (typeof window.showSaveFilePicker !== 'function') {
    const got = SP.download(suggested, html, 'text/html');
    return { ok: true, message: 'A copy was downloaded as “' + got + '”. This page still saves to “' + st_pageName() + '”.' };
  }
  let h;
  try {
    h = await window.showSaveFilePicker({ suggestedName: suggested,
      types: [{ description: 'SFCB Spend Plan (a new file)', accept: { 'text/html': ['.html', '.htm'] } }] });
  } catch (e) {
    if (st_abortish(e)) return { ok: false, message: 'No copy was saved: no file name was given.' };

  }

  catch (e) { return { ok: false, message: 'No copy was saved: “' + (h.name || suggested) + '” could not be written (' + st_err(e) + ').' }; }

  if (own) { st_saved(now, gen, st_handle); return { ok: true, message: 'Saved to “' + (h.name || suggested) + '” (this page’s own file).' }; }
  return { ok: true, message: 'Saved a copy as “' + (h.name || suggested) + '”. This page still saves to “' + st_pageName() + '”'
    + (st_dirty ? ', which does not have this work yet: use Save for that.' : '.') };
}

// ===== 90-ui.js =====
// §9 THE SCREENS. One page, drawn from SP.buildModel's result and nothing else, so a figure on screen is the figure in
// the workbook and on the slide picture: this module formats, it never adds up a dollar of its own (CONTRACT §9).
//
// Three rules hold every line below:
//   - Every value that came out of a pull is escaped (SP.esc) where it reaches markup. A plan event may be
//     "><img src=x onerror=…> or hold a closing script tag; drawn raw, it would run as code in a page that is also the file's
//     database. No inline handler exists anywhere: controls carry data-act plus an INDEX into a registry built while
//     drawing, never a name from the data, and one listener on #app does the rest.
//   - A redraw puts the keyboard back where it was. Every control carries data-fkey, a key made from indices and
//     hashes, never from data; after innerHTML is replaced the control with the same key gets focus again, so a
//     keyboard user who expands a row or ticks a switch does not land back at the top of the page.
//   - A tree only draws what is open. The children of a collapsed node are never put in the page, so a block with
//     1,400 nodes costs one row per PMO until someone opens it.

const UI_SVC = SP.SERVICES.concat([SP.SVC_UNKNOWN]);

  ['p4', 'Procurement, fourth year or later']];

function ui_day(iso) {

// ---------------------------------------------------------------------------------------------------------------

// ---------------------------------------------------------------------------------------------------------------

  R.nodes.set(id, { scope, pk });

    if (kids) {
      const id = ui_nodeId(scope, n);

// a top table: one row per block, with a Total row that has no goal (§8.1, §8.3, §8.6)
function ui_topTable(rows, opts) {
  const withAp = opts.withAp;
  const head = (withAp ? '<th scope="col">Appropriation</th>' : '') + '<th scope="col">FY</th><th scope="col" class="n">Approved ($M)</th>'
    + '<th scope="col" class="n">Authorized ($M)</th><th scope="col" class="n">Obligated ($M)</th><th scope="col" class="n">Unobligated ($M)</th>'
    + '<th scope="col" class="n">Obl %</th><th scope="col" class="n">OSD Goal %</th><th scope="col" class="n">Delta (pp)</th><th scope="col">Status</th>';
  const body = [];
  let i = 0;
  while (i < rows.length) {
    let j = i;
    if (withAp && opts.mergeAp) while (j + 1 < rows.length && rows[j + 1].ap === rows[i].ap) j++;
    for (let k = i; k <= j; k++) {
      const r = rows[k];
      const apCell = !withAp ? '' : !opts.mergeAp ? '<td>' + ui_e(UI_AP_LABEL[r.ap] || r.ap) + '</td>'
        : k === i ? '<th scope="rowgroup" rowspan="' + (j - i + 1) + '" class="apg">' + ui_e(UI_AP_LABEL[r.ap] || r.ap) + '</th>' : '';
      body.push('<tr data-bk="' + ui_e(SP.blockKey(r.ap, r.fy)) + '">' + apCell + '<td>FY' + ui_e(r.fy) + '</td>' + ui_m(r.approved)
        + ui_auth(r.authorized, opts.authAlways ? '' : SP.authMark(r, opts.model)) + ui_m(r.obligated) + ui_m(r.unobligated) + ui_p(r.oblPct) + ui_p(r.goal)
        + ui_d(r.delta) + ui_st(r.status, false) + '</tr>');
    }
    i = j + 1;
  }
  const t = opts.total;
  // a TOTAL that adds in an Authorized the switches do not reach is marked ‡ like the row it came from (review R3)
  const ddag = !opts.authAlways && SP.authMarks(rows, opts.model).ddag;
  body.push('<tr class="total" data-bk="total"><th scope="row"' + (withAp ? ' colspan="2"' : '') + '>' + ui_e(opts.totalLabel) + '</th>'
    + ui_m(t.approved) + ui_auth(t.authorized, ddag ? '‡' : '') + ui_m(t.obligated) + ui_m(t.unobligated) + ui_p(t.oblPct) + '<td></td><td></td><td></td></tr>');
  return '<div class="tw"><table class="grid top"><thead><tr class="hd">' + head + '</tr></thead><tbody>' + body.join('') + '</tbody></table></div>'
    + (ddag ? '<p class="note">‡ ' + ui_e(SP.AUTH_MARK_TEXT['‡']) + '</p>' : '');
}

// The PMO filter shows a PMO's OWN items: the lists its PMO tab prints (§5, "PMO blocks list only that PMO's items"),
// keyed by the PMO's normKey (§4.4). It used to keep every naAll item whose PMO names held the chosen spelling, and a
// §5 item groups rows by plan event across PMOs, so (review R2):
//   - a shared item counted whole under every PMO it named: on the real pull one PMO showed another's money, named on
//     it only by a $0.00 row, and its total disagreed with its own tab;
//   - one PMO spelled two ways was two choices, each with part of its money.
function ui_vNa(M) {
  const R = ui.reg, F = ui.naF;
  const all = M.naAll;
  // each PMO's own items, its blocks in the model's block order (appropriation, then FY) so they read as naAll does
  const apAt = new Map(SP.APS.map((a, i) => [a.id, i]));
  const own = new Map();
  for (const p of M.pmos) {
    const list = [];
    for (const pb of p.blocks.slice().sort((a, b) => apAt.get(a.ap) - apAt.get(b.ap) || a.fy - b.fy)) {
      for (const it of pb.na) list.push(Object.assign({ ap: pb.ap, apLabel: pb.apLabel, fy: pb.fy, blockKey: pb.key }, it));
    }
    if (list.length) own.set(p.key, { label: p.label, items: list });
  }
  // the appropriation and FY choices offer every block either list has: a PMO's part can be non-zero in a block where
  // the item it belongs to nets to $0 across PMOs, and so is not in naAll
  const pool = all.concat(...[...own.values()].map(o => o.items));
  const aps = SP.APS.filter(a => pool.some(it => it.ap === a.id));
  const fys = [...new Set(pool.map(it => it.fy))].sort((a, b) => a - b);
  // F.pmo is 'k:' + the PMO's key, '' for All: the key of '(no PMO)' is the empty text, which would otherwise read as All
  const pm = [...own.keys()];
  R.naPmos = pm.map(k => 'k:' + k);
  if (F.ap && !aps.some(a => a.id === F.ap)) F.ap = '';
  if (F.fy && !fys.includes(Number(F.fy))) F.fy = '';
  if (F.pmo && !own.has(F.pmo.slice(2))) F.pmo = '';
  const P = F.pmo ? own.get(F.pmo.slice(2)) : null;
  const src = P ? P.items : all;
  const items = src.filter(it => (!F.ap || it.ap === F.ap) && (!F.fy || it.fy === Number(F.fy)));
  let cents = 0;
  for (const it of items) cents += it.cents;
  const filt = '<div class="acts filt" role="group" aria-label="Filter the list">'
    + '<label>Appropriation <select data-act="naf" data-f="ap" data-fkey="naf:ap"><option value="">All</option>'
    + aps.map(a => '<option value="' + a.id + '"' + (F.ap === a.id ? ' selected' : '') + '>' + ui_e(a.label) + '</option>').join('') + '</select></label>'
    + '<label>FY <select data-act="naf" data-f="fy" data-fkey="naf:fy"><option value="">All</option>'
    + fys.map(y => '<option value="' + ui_e(y) + '"' + (String(F.fy) === String(y) ? ' selected' : '') + '>FY' + ui_e(y) + '</option>').join('') + '</select></label>'
    + '<label>PMO <select data-act="naf" data-f="pmo" data-fkey="naf:pmo"><option value="">All</option>'
    + pm.map((k, i) => '<option value="' + i + '"' + (F.pmo === 'k:' + k ? ' selected' : '') + '>' + ui_e(own.get(k).label) + '</option>').join('') + '</select></label>'
    + '<button type="button" data-act="naclear" data-fkey="naclear">Clear filters</button></div>';
  return '<h2 class="title">Not Allocated Requirements - every appropriation and FY</h2>'
    + ui_shown(M, 'Only rows those switches show are listed.')
    + '<p class="l2">Rows that count and are not marked Actual Execution, grouped by column, status and plan event (a special CCaR is one item).'
    + ' Largest first within each column; items of $0 are left out.</p>' + filt
    + (P ? '<p class="note">' + ui_e(P.label) + '’s own items, as its PMO tab lists them: where other PMOs share a plan event, only '
      + ui_e(P.label) + '’s rows are counted.</p>' : '')
    + '<p class="count" aria-live="polite">' + ui_e(SP.fmtInt(items.length)) + ' of ' + ui_e(SP.fmtInt(src.length)) + ' items, $' + ui_e(SP.fmtM(cents)) + 'M</p>'
    + ui_naTable(M, items, true);
}
